<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<title>Actualizar Firestore - Lima / Barranca</title>
<style>
  body { font-family: Arial, sans-serif; max-width: 800px; margin: 40px auto; background:#111; color:#eee; }
  h1 { font-size: 20px; }
  button {
    background:#2563eb; color:#fff; border:none; padding:10px 16px;
    border-radius:6px; cursor:pointer; font-size:14px; margin:6px 6px 6px 0;
  }
  button:disabled { background:#555; cursor:not-allowed; }
  #log {
    background:#000; color:#0f0; padding:12px; height:400px; overflow-y:auto;
    font-family:monospace; font-size:13px; white-space:pre-wrap; border-radius:6px;
    margin-top:16px; border:1px solid #333;
  }
</style>
</head>
<body>

<h1>Actualizar campos de ubicacion en Firestore</h1>
<p>Colecciones: <b>alias_tiendas</b> y <b>alias_turismo</b></p>
<p>Se agregara: <code>departamento: "lima"</code>, <code>provincia: "barranca"</code>, <code>distrito: "barranca"</code></p>
<p>Se eliminara el campo <code>capital</code> si existe.</p>

<button id="btnTiendas">Actualizar alias_tiendas</button>
<button id="btnTurismo">Actualizar alias_turismo</button>
<button id="btnAmbas">Actualizar ambas colecciones</button>

<div id="log">Listo. Presiona un boton para iniciar...\n</div>

<script type="module">
import { initializeApp, getApps, getApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import {
  getFirestore,
  collection,
  getDocs,
  doc,
  updateDoc,
  deleteField,
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBFV4SF7hMFifKz45GaBiu2xwTq7T_gxBQ",
  authDomain: "geinzworkapp.firebaseapp.com",
  databaseURL: "https://geinzworkapp-default-rtdb.firebaseio.com",
  projectId: "geinzworkapp",
  storageBucket: "geinzworkapp.appspot.com",
  messagingSenderId: "921389328767",
  appId: "1:921389328767:web:dc6fffc43a51444f5b524a",
  measurementId: "G-38J7RJP8HK",
};

const app = getApps().find((a) => a.name === "[DEFAULT]") || initializeApp(firebaseConfig);
const db = getFirestore(app);

const logEl = document.getElementById("log");
function log(msg) {
  logEl.textContent += msg + "\n";
  logEl.scrollTop = logEl.scrollHeight;
}

async function actualizarColeccion(nombreColeccion) {
  log(`\n=== Iniciando actualizacion de "${nombreColeccion}" ===`);
  const colRef = collection(db, nombreColeccion);
  const snapshot = await getDocs(colRef);

  if (snapshot.empty) {
    log(`No se encontraron documentos en "${nombreColeccion}".`);
    return;
  }

  log(`Encontrados ${snapshot.size} documentos. Actualizando...`);

  let actualizados = 0;
  let errores = 0;

  for (const docSnap of snapshot.docs) {
    const docRef = doc(db, nombreColeccion, docSnap.id);
    const data = docSnap.data();

    const cambios = {
      departamento: "lima",
      provincia: "barranca",
      distrito: "barranca",
    };

    if (Object.prototype.hasOwnProperty.call(data, "capital")) {
      cambios.capital = deleteField();
    }

    try {
      await updateDoc(docRef, cambios);
      actualizados++;
      log(`OK -> ${docSnap.id}`);
    } catch (err) {
      errores++;
      log(`ERROR -> ${docSnap.id}: ${err.message}`);
    }
  }

  log(`\nResumen "${nombreColeccion}": ${actualizados} actualizados, ${errores} con error.`);
}

async function ejecutar(colecciones, boton) {
  boton.disabled = true;
  try {
    for (const c of colecciones) {
      await actualizarColeccion(c);
    }
    log("\nProceso finalizado.");
  } catch (err) {
    log(`ERROR GENERAL: ${err.message}`);
  } finally {
    boton.disabled = false;
  }
}

document.getElementById("btnTiendas").addEventListener("click", (e) => {
  ejecutar(["alias_tiendas"], e.target);
});

document.getElementById("btnTurismo").addEventListener("click", (e) => {
  ejecutar(["alias_turismo"], e.target);
});

document.getElementById("btnAmbas").addEventListener("click", (e) => {
  ejecutar(["alias_tiendas", "alias_turismo"], e.target);
});
</script>

</body>
</html>
