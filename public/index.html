<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Geinz - Redirigiendo...</title>
    <link rel="icon" href="img/icons/favicon.ico" sizes="any">
    <link rel="icon" type="image/png" sizes="32x32" href="img/icons/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="img/icons/favicon-16x16.png">
    <link rel="apple-touch-icon" href="img/icons/apple-touch-icon.png">
    <link rel="manifest" href="img/icons/site.webmanifest">
  <style>
    :root {
      --primary-color: #8800F2;
      --bg-dark: #0a0a0a;
      --skeleton-base: #1a1a1a;
      --skeleton-highlight: #252525;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: var(--bg-dark);
      background-image:
        radial-gradient(circle at 0% 0%, rgba(136, 0, 242, 0.15) 0%, transparent 50%),
        radial-gradient(circle at 100% 100%, rgba(136, 0, 242, 0.1) 0%, transparent 50%);
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      overflow: hidden;
    }

    .container {
      width: 100%;
      max-width: 400px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 24px;
      animation: fadeIn 0.8s ease-out;
    }

    .skeleton-card {
      background: var(--skeleton-base);
      border-radius: 20px;
      padding: 30px;
      border: 1px solid rgba(136, 0, 242, 0.2);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      position: relative;
      overflow: hidden;
    }

    .skeleton-card::after {
      content: "";
      position: absolute;
      top: 0;
      right: 0;
      bottom: 0;
      left: 0;
      background: linear-gradient(90deg, transparent, rgba(136, 0, 242, 0.05), transparent);
      animation: shimmer 2s infinite;
    }

    .shimmer-element {
      background: var(--skeleton-highlight);
      border-radius: 8px;
      margin-bottom: 15px;
    }

    .circle {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      margin: 0 auto 20px;
      border: 2px solid var(--primary-color);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .line-full {
      height: 12px;
      width: 100%;
    }

    .line-mid {
      height: 12px;
      width: 60%;
      margin: 0 auto;
    }

    .status-text {
      color: white;
      text-align: center;
      font-size: 1.1rem;
      font-weight: 500;
      letter-spacing: 0.5px;
    }

    .brand {
      color: var(--primary-color);
      font-weight: 800;
      font-size: 1.5rem;
      text-transform: uppercase;
      margin-bottom: 5px;
      display: block;
    }

    @keyframes shimmer {
      0% {
        transform: translateX(-100%);
      }

      100% {
        transform: translateX(100%);
      }
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(10px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .pulse {
      animation: pulse-glow 2s infinite ease-in-out;
    }

    @keyframes pulse-glow {

      0%,
      100% {
        box-shadow: 0 0 15px rgba(136, 0, 242, 0.3);
      }

      50% {
        box-shadow: 0 0 30px rgba(136, 0, 242, 0.6);
      }
    }
  </style>
</head>

<body>
  <div class="container">
    <div class="skeleton-card pulse">
      <div class="circle">
        <div style="width:30px;height:30px;background:var(--primary-color);border-radius:6px;transform:rotate(45deg);">
        </div>
      </div>
      <div class="shimmer-element line-full"></div>
      <div class="shimmer-element line-mid"></div>
    </div>
    <div class="status-text">
      <span class="brand">Geinz</span>
      <p id="message" style="margin:0;opacity:0.8;font-size:0.9rem;">Preparando tu destino...</p>
    </div>
  </div>

  <script>
    (function () {

      console.clear();
      console.log("🚀 SHARE INICIADO");

      const params = new URLSearchParams(window.location.search);

      // =========================
      // DETECTAR TIPO
      // =========================
      let t = (params.get("t") || "").trim().toLowerCase();

      if (!t) {
        const path = window.location.pathname;
        console.log("🛣️ PATH:", path);
        if (path.includes("/ti")) t = "ti";
        else if (path.includes("/p")) t = "p";
        else if (path.includes("/scr")) t = "scr";
        else if (path.includes("/prms")) t = "prms";
        else if (path.includes("/promo")) t = "promo";
        else if (path.includes("/tu")) t = "tu";
      }

      // =========================
      // PARAMETROS
      // =========================
      const rawId = (() => {
        const id = params.get("id");
        const pi = params.get("pi");

        if (id !== null && id.trim() !== "" && id !== "undefined" && id !== "null") {
          return id.trim();
        }
        if (pi !== null && pi.trim() !== "" && pi !== "undefined" && pi !== "null") {
          return pi.trim();
        }
        return "";
      })();

      const id = rawId;

      let loc = (
        params.get("l") ||
        params.get("localidad") ||
        ""
      ).trim().toLowerCase();

      const cat = (
        params.get("c") ||
        params.get("subcol") ||
        ""
      ).trim();

      // =========================
      // NORMALIZAR LOCALIDADES
      // =========================
      switch (loc) {
        case "ba":
        case "barranca": loc = "barranca"; break;
        case "par":
        case "paramonga": loc = "paramonga"; break;
        case "pat":
        case "pativilca": loc = "pativilca"; break;
        case "su":
        case "supe": loc = "supe"; break;
        case "pue":
        case "puerto supe":
        case "puertosupe": loc = "puerto supe"; break;
        default: loc = "barranca"; break;
      }

      console.table({ t, id, loc, cat });

      // =========================
      // VALIDAR
      // =========================
      if (!t) {
        console.error("❌ TIPO NO DETECTADO");
        return;
      }

      if (!id && t !== "scr" && t !== "prms" && t !== "promo") {
        console.error("❌ NO EXISTE ID");
        return;
      }

      let destino = "";

      // =====================================================
      // NEGOCIOS
      // =====================================================
      // =====================================================
      // NEGOCIOS + PROMOS INTERNAS
      // =====================================================
      if (t === "ti" || t === "p") {

        console.log("🏪 ENTRANDO A NEGOCIO");

        const promoIndex = (
          params.get("i") ||
          params.get("indice") ||
          ""
        ).trim();

        destino =
          `/perfil_negocio.html` +
          `?id=${encodeURIComponent(id)}` +
          `&localidad=${encodeURIComponent(loc)}` +
          `&subcol=${encodeURIComponent(cat || "")}`;

        // si existe promo interna la enviamos
        if (promoIndex) {
          destino += `&i=${encodeURIComponent(promoIndex)}`;
        }
      }

      // =====================================================
      // SERVICIOS / TURISMO / SALUD
      // =====================================================
      else if (t === "scr") {
        console.log("🛠️ ENTRANDO A SCR");
        if (id === "lgtr") { console.log("🌎 TURISMO"); destino = `/pantalla_turismo.html`; }
        else if (id === "nemg") { console.log("🚑 EMERGENCIA"); destino = `/emergencia.html`; }
        else if (id === "seyt") { console.log("🛠️ SERVICIOS"); destino = `/pantalla_servicios_geinz.html`; }
        else { console.error("❌ SCR ID DESCONOCIDO:", id); return; }
      }

      // =====================================================
      // TURISMO DIRECTO
      // =====================================================
      else if (t === "tu") {
        console.log("🌎 TURISMO DIRECTO");
        destino =
          `/turismo.html` +
          `?id=${encodeURIComponent(id)}` +
          `&localidad=${encodeURIComponent(loc)}`;
      }

      // =====================================================
      // PROMOS
      // =====================================================
      else if (t === "prms" || t === "promo") {
        console.log("🎁 PROMOS");
        destino =
          `/promociones.html` +
          `?localidad=${encodeURIComponent(loc)}` +
          `&id=${encodeURIComponent(id)}`;
      }

      else {
        console.error("❌ TIPO DESCONOCIDO:", t);
        return;
      }

      // =====================================================
      // REDIRECCION
      // =====================================================
      console.log("📍 DESTINO:", destino);

      if (!destino) {
        console.error("❌ DESTINO VACIO");
        return;
      }

      const finalUrl = window.location.origin + destino;
      console.log("🌐 URL FINAL:", finalUrl);

      window.location.replace(finalUrl);

    })();
  </script>
</body>

</html>
