    <script>
        function contactWhatsApp(phone, message, url) {
            if (!phone) return;
            const cleanPhone = phone.replace(/\s+/g, '');
            const textoCompleto = `${message}\n${url}`;
            window.open(`https://api.whatsapp.com/send?phone=51${cleanPhone}&text=${encodeURIComponent(textoCompleto)}`, '_blank');
        }

        function sharePromo(message, url) {
            const textoCompleto = `${message}\n${url}`;
            if (navigator.share) {
                navigator.share({ title: 'Geinz', text: textoCompleto, url: url }).catch(console.error);
            } else {
                navigator.clipboard.writeText(textoCompleto);
                alert("¡Copiado al portapapeles!");
            }
        }

        function abrirPromo(url) {
            window.open(url, '_blank');
        }
    </script>
