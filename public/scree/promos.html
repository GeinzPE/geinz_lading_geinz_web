<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geinz - Promociones de Barranca</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="icon" href="../img/icons/favicon.ico" sizes="any">
    <link rel="icon" type="image/png" sizes="32x32" href="../img/icons/favicon-96x96.png">
    <link rel="icon" type="image/png" sizes="16x16" href="../img/icons/favicon-16x16.png">
    <link rel="apple-touch-icon" href="../img/icons/apple-touch-icon.png">
    <link rel="manifest" href="../img/icons/site.webmanifest">
    <style>
        :root {
            --bg-color: #000000;
            --card-bg: #0b0b0c;
            --border-color: #1c1c1e;
            --text-primary: #ffffff;
            --text-secondary: #7c7c80;
            --accent-purple: #9d4edd;
            --accent-red: #ff3b30;
            --accent-green: #34c759;
            --skeleton-bg: #121214;
            --skeleton-anim: #1a1a1e;
        }

        * {
            -webkit-tap-highlight-color: transparent;
        }

        /* Quitar selección de texto accidental */
        * {
            -webkit-user-select: none;
            user-select: none;
        }

        /* Opcional: quitar contornos de enfoque táctil */
        button,
        a,
        input,
        textarea,
        select {
            outline: none;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: '-apple-system', BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            padding-bottom: 60px;
            overflow-x: hidden;
        }

        /* Cabecera Principal */
        .hero-header {
            text-align: center;
            padding: 50px 20px 20px 20px;
            max-width: 800px;
            margin: 0 auto;
            animation: fadeIn 0.8s ease-out;
        }

        .hero-header h1 {
            font-size: 2.4rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, #ffffff 40%, #a29bfe 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }

        .hero-header p {
            font-size: 15px;
            color: var(--text-secondary);
            line-height: 1.5;
        }

        /* Contenedor Principal de Promociones */
        main {
            max-width: 500px;
            margin: 0 auto;
            padding: 15px;
        }

        /* Tarjeta de Promoción Premium */
        .promo-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            margin-bottom: 35px;
            overflow: hidden;
            position: relative;
            opacity: 0;
            transform: translateY(20px);
            animation: cardAppear 0.6s cubic-bezier(0.25, 1, 0.5, 1) forwards;
            transition: transform 0.4s cubic-bezier(0.2, 0.8, 0.2, 1), box-shadow 0.4s ease, border-color 0.4s ease;
            cursor: pointer;
        }

        /* Contenedor Fijo para Imagen Única */
        .image-container-single {
            width: 100%;
            aspect-ratio: 4/5;
            background-color: #050505;
            overflow: hidden;
        }

        .image-container-single img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Detalles Inferiores */
        .promo-footer {
            padding: 18px;
            background: linear-gradient(to bottom, #0c0c0e, #0b0b0c);
        }

        .store-header-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 14px;
            gap: 12px;
        }

        .store-info {
            display: flex;
            align-items: center;
            gap: 12px;
            min-width: 0;
        }

        .store-logo {
            width: 46px;
            height: 46px;
            border-radius: 50%;
            object-fit: cover;
            border: 1px solid var(--border-color);
        }

        .store-text-details {
            display: flex;
            flex-direction: column;
            gap: 2px;
            min-width: 0;
        }

        .store-name {
            font-size: 15px;
            font-weight: 700;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .promo-title {
            font-size: 13px;
            color: var(--text-secondary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Fila de Estado, Expiración y Acciones */
        .store-actions-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-top: 1px solid rgba(255, 255, 255, 0.04);
            padding-top: 14px;
            gap: 10px;
        }

        /* Contenedor de badges de tiempo */
        .time-info-container {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .badge-days {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            font-weight: 600;
            padding: 6px 12px;
            border-radius: 12px;
            width: fit-content;
        }

        .badge-urgent {
            background-color: rgba(255, 59, 48, 0.12);
            color: #ff453a;
        }

        .badge-normal {
            background-color: rgba(157, 78, 221, 0.12);
            color: #d4bbff;
        }

        .expiration-date {
            font-size: 11px;
            color: var(--text-secondary);
            font-weight: 500;
            padding-left: 4px;
        }

        .action-buttons {
            display: flex;
            gap: 10px;
            flex-shrink: 0;
        }

        .action-btn {
            background: #1c1c1e;
            border: 1px solid rgba(255, 255, 255, 0.04);
            color: white;
            width: 42px;
            height: 42px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            cursor: pointer;
            transition: transform 0.2s cubic-bezier(0.2, 0.8, 0.2, 1), background-color 0.2s;
        }

        .action-btn:active {
            transform: scale(0.9);
        }

        .action-btn.share:hover {
            background-color: var(--accent-purple);
            border-color: transparent;
        }

        .action-btn.whatsapp:hover {
            background-color: var(--accent-green);
            border-color: transparent;
        }

        /* ── BANNER DE DESCARGA PREMIUM ── */
        .download-banner {
            background: linear-gradient(145deg, #0f0f14 0%, #070709 100%);
            border: 1px solid #1a1a22;
            border-radius: 28px;
            padding: 40px 24px;
            text-align: left;
            margin-top: 30px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.9);
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            opacity: 0;
            animation: fadeIn 0.8s ease-out 0.4s forwards;
        }

        .download-banner-content {
            max-width: 100%;
            z-index: 2;
        }

        .download-banner h3 {
            font-size: 24px;
            font-weight: 800;
            line-height: 1.25;
            margin-bottom: 14px;
            letter-spacing: -0.5px;
            background: linear-gradient(120deg, #ffffff, #e2d9ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .download-banner p {
            font-size: 13.5px;
            color: #8e8e93;
            margin-bottom: 28px;
            line-height: 1.6;
        }

        .download-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background-color: #ffffff;
            color: #000000;
            padding: 14px 28px;
            border-radius: 12px;
            font-weight: 700;
            text-decoration: none;
            font-size: 14px;
            transition: transform 0.2s cubic-bezier(0.2, 0.8, 0.2, 1), background-color 0.2s;
            box-shadow: 0 4px 15px rgba(255, 255, 255, 0.1);
            width: fit-content;
        }

        .download-btn:hover {
            background-color: #f2f2f7;
            transform: scale(1.02);
        }

        /* Logo Gigante Decorativo Integrado */
        .download-banner-icon {
            position: absolute;
            right: -20px;
            bottom: -20px;
            font-size: 160px;
            background: linear-gradient(135deg, #34c759, #007aff, #ff3b30, #ffcc00);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            opacity: 0.15;
            transform: rotate(-15deg);
            pointer-events: none;
            z-index: 1;
            transition: transform 0.5s ease;
        }

        .download-banner:hover .download-banner-icon {
            transform: rotate(-10deg) scale(1.05);
        }

        /* SKELETON SCREEN ANIMADO */
        .skeleton-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            margin-bottom: 35px;
            overflow: hidden;
        }

        .skeleton-image {
            width: 100%;
            aspect-ratio: 4/5;
            background: linear-gradient(90deg, var(--skeleton-bg) 25%, var(--skeleton-anim) 50%, var(--skeleton-bg) 75%);
            background-size: 200% 100%;
            animation: loading 1.5s infinite;
        }

        .skeleton-footer {
            padding: 18px;
        }

        .skeleton-row {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 15px;
        }

        .skeleton-avatar {
            width: 46px;
            height: 46px;
            border-radius: 50%;
            background: linear-gradient(90deg, var(--skeleton-bg) 25%, var(--skeleton-anim) 50%, var(--skeleton-bg) 75%);
            background-size: 200% 100%;
            animation: loading 1.5s infinite;
        }

        .skeleton-line {
            height: 12px;
            background: linear-gradient(90deg, var(--skeleton-bg) 25%, var(--skeleton-anim) 50%, var(--skeleton-bg) 75%);
            background-size: 200% 100%;
            animation: loading 1.5s infinite;
            border-radius: 4px;
        }

        .skeleton-line.w-70 {
            width: 70%;
        }

        .skeleton-line.w-40 {
            width: 40%;
        }

        @keyframes loading {
            0% {
                background-position: 200% 0;
            }

            100% {
                background-position: -200% 0;
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        @keyframes cardAppear {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* VISTA PC PREMIUM MULTICOLUMNA */
        @media (min-width: 850px) {
            .hero-header {
                padding: 70px 20px 40px 20px;
            }

            .hero-header h1 {
                font-size: 3.2rem;
            }

            main {
                max-width: 1200px;
                padding: 0 25px;
            }

            #promos-container {
                display: grid;
                grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
                gap: 30px;
            }

            .promo-card {
                margin-bottom: 0;
            }

            .promo-card:hover {
                transform: translateY(-8px);
                box-shadow: 0 20px 40px rgba(157, 78, 221, 0.12);
                border-color: rgba(157, 78, 221, 0.25);
            }

            /* Adaptación del Banner a Pantallas Grandes */
            .download-banner {
                grid-column: 1 / -1;
                margin-top: 40px;
                padding: 60px 80px;
                flex-direction: row;
                align-items: center;
                justify-content: space-between;
                gap: 50px;
            }

            .download-banner-content {
                max-width: 65%;
            }

            .download-banner h3 {
                font-size: 32px;
            }

            .download-banner p {
                font-size: 15px;
            }

            .download-banner-icon {
                position: relative;
                right: 0;
                bottom: 0;
                font-size: 180px;
                opacity: 0.85;
                transform: rotate(0deg);
                margin-right: 20px;
            }

            .download-banner:hover .download-banner-icon {
                transform: scale(1.05) rotate(3deg);
            }
        }
    </style>
</head>

<body>

    <header class="hero-header">
        <h1>Promociones Exclusivas</h1>
        <p>Explora las mejores ofertas, descuentos y novedades directo de los comercios de Barranca.</p>
    </header>

    <main>
        <div id="promos-container">
            <div class="skeleton-card">
                <div class="skeleton-image"></div>
                <div class="skeleton-footer">
                    <div class="skeleton-row">
                        <div class="skeleton-avatar"></div>
                        <div style="flex:1;">
                            <div class="skeleton-line w-70" style="margin-bottom:8px;"></div>
                            <div class="skeleton-line w-40"></div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="skeleton-card">
                <div class="skeleton-image"></div>
                <div class="skeleton-footer">
                    <div class="skeleton-row">
                        <div class="skeleton-avatar"></div>
                        <div style="flex:1;">
                            <div class="skeleton-line w-70" style="margin-bottom:8px;"></div>
                            <div class="skeleton-line w-40"></div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="skeleton-card">
                <div class="skeleton-image"></div>
                <div class="skeleton-footer">
                    <div class="skeleton-row">
                        <div class="skeleton-avatar"></div>
                        <div style="flex:1;">
                            <div class="skeleton-line w-70" style="margin-bottom:8px;"></div>
                            <div class="skeleton-line w-40"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getFirestore, collection, getDocs, query, limit, where } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBFV4SF7hMFifKz45GaBiu2xwTq7T_gxBQ",
            authDomain: "geinzworkapp.firebaseapp.com",
            projectId: "geinzworkapp",
            storageBucket: "geinzworkapp.appspot.com",
            messagingSenderId: "921389328767",
            appId: "1:921389328767:web:094e8a2a5fcd69395b524a",
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const promosContainer = document.getElementById('promos-container');

        async function init() {
            try {
                await fetchPromociones();
            } catch (error) {
                console.error("Error al extraer datos de Firestore: ", error);
                promosContainer.innerHTML = `<p style="text-align:center; color: #ff3b30; padding: 20px;">Error al conectar con la base de datos.</p>`;
            }
        }

        async function fetchPromociones() {
            const path = "Tiendas/barranca/promos_ofertas";
            const q = query(collection(db, path), where("estado", "==", "activo"), limit(20));
            const querySnapshot = await getDocs(q);

            let htmlContent = "";
            let delayIndex = 0;

            if (querySnapshot.empty) {
                promosContainer.innerHTML = `<p style="text-align:center; color: var(--text-secondary); padding: 40px;">No hay ofertas disponibles en este momento.</p>`;
                return;
            }

            querySnapshot.forEach((doc) => {
                const data = doc.data();
                if (data.activo !== true && data.estado !== "activo") return;

                // Filtrar expirados
                const dhf2 = data.datos_hora_fecha || {};
                const rawFecha2 = data.fecha_fin || dhf2.fecha_fin || "";
                let finDate2 = null;
                if (rawFecha2) {
                    if (/^\d{2}\/\d{2}\/\d{4}$/.test(rawFecha2)) {
                        const [d, m, y] = rawFecha2.split("/");
                        finDate2 = new Date(`${y}-${m}-${d}T23:59:59`);
                    } else if (/^\d{4}-\d{2}-\d{2}$/.test(rawFecha2)) {
                        finDate2 = new Date(rawFecha2 + "T23:59:59");
                    }
                }
                if (!finDate2 || isNaN(finDate2.getTime())) {
                    const ts = dhf2.timestamp_fin?.seconds;
                    if (ts) finDate2 = new Date(ts * 1000);
                }
                if (finDate2 && !isNaN(finDate2.getTime()) && finDate2 < new Date()) return;
                if (delayIndex >= 6) return;

                const info = data.informacion || {};
                const imgContainer = data.img_container || {};
                const listImg = imgContainer.lista_img || [];
                const logoImg = imgContainer.logo_img || "";

                // ── Obtener fecha_fin y construir badge de tiempo ──────────────
                let timeContainerHtml = "";
                const dhf = data.datos_hora_fecha || {};
                const tipoHora = data.tipo_hora_dias || dhf.tipo_hora_dias || "dias";
                let finDate = null;
                const rawFecha = data.fecha_fin || dhf.fecha_fin || "";

                if (rawFecha) {
                    if (/^\d{2}\/\d{2}\/\d{4}$/.test(rawFecha)) {
                        const [d, m, y] = rawFecha.split("/");
                        finDate = new Date(`${y}-${m}-${d}T23:59:59`);
                    } else if (/^\d{4}-\d{2}-\d{2}$/.test(rawFecha)) {
                        finDate = new Date(rawFecha + "T23:59:59");
                    }
                }

                if (!finDate || isNaN(finDate.getTime())) {
                    const tsFinSeconds = dhf.timestamp_fin?.seconds || data.timestamp_fin?.seconds;
                    if (tsFinSeconds) {
                        finDate = new Date(tsFinSeconds * 1000);
                    }
                }

                if (finDate && !isNaN(finDate.getTime())) {
                    const ahora = new Date();
                    const diffMs = finDate - ahora;
                    const opciones = { day: 'numeric', month: 'long' };
                    const fechaFormateada = finDate.toLocaleDateString('es-ES', opciones);
                    const horaFin = dhf.hora_fin || data.hora_fin || "23:59";

                    if (tipoHora === "horas") {
                        const diffHoras = Math.ceil(diffMs / (1000 * 60 * 60));
                        if (diffHoras > 3) {
                            timeContainerHtml = `
                        <div class="time-info-container">
                            <div class="badge-days" style="background:rgba(52,199,89,0.12); color:#30d158;">
                                <i class="fa-solid fa-clock"></i> ${diffHoras}h restantes
                            </div>
                            <span class="expiration-date">Vence hoy a las ${horaFin}</span>
                        </div>`;
                        } else if (diffHoras > 0) {
                            timeContainerHtml = `
                        <div class="time-info-container">
                            <div class="badge-days badge-urgent">
                                <i class="fa-solid fa-bolt"></i> ¡Solo ${diffHoras}h!
                            </div>
                            <span class="expiration-date">Vence a las ${horaFin}</span>
                        </div>`;
                        } else {
                            timeContainerHtml = `
                        <div class="time-info-container">
                            <div class="badge-days" style="background:#242426; color:var(--text-secondary);">
                                <i class="fa-solid fa-calendar-xmark"></i> Finalizado
                            </div>
                        </div>`;
                        }
                    } else {
                        const diffDays = Math.ceil(diffMs / (1000 * 60 * 60 * 24));
                        if (diffDays > 3) {
                            timeContainerHtml = `
                        <div class="time-info-container">
                            <div class="badge-days" style="background:rgba(52,199,89,0.12); color:#30d158;">
                                <i class="fa-solid fa-clock"></i> Quedan ${diffDays} días
                            </div>
                            <span class="expiration-date">Expira el ${fechaFormateada}</span>
                        </div>`;
                        } else if (diffDays >= 2) {
                            timeContainerHtml = `
                        <div class="time-info-container">
                            <div class="badge-days" style="background:rgba(255,159,10,0.12); color:#ff9f0a;">
                                <i class="fa-solid fa-triangle-exclamation"></i> Quedan ${diffDays} días
                            </div>
                            <span class="expiration-date">Expira el ${fechaFormateada}</span>
                        </div>`;
                        } else if (diffDays === 1) {
                            timeContainerHtml = `
                        <div class="time-info-container">
                            <div class="badge-days badge-urgent">
                                <i class="fa-solid fa-triangle-exclamation"></i> Último día
                            </div>
                            <span class="expiration-date">Vence mañana</span>
                        </div>`;
                        } else if (diffDays === 0) {
                            timeContainerHtml = `
                        <div class="time-info-container">
                            <div class="badge-days badge-urgent">
                                <i class="fa-solid fa-bolt"></i> Finaliza hoy
                            </div>
                            <span class="expiration-date">Vence hoy a las ${horaFin}</span>
                        </div>`;
                        } else {
                            timeContainerHtml = `
                        <div class="time-info-container">
                            <div class="badge-days" style="background:#242426; color:var(--text-secondary);">
                                <i class="fa-solid fa-calendar-xmark"></i> Finalizado
                            </div>
                        </div>`;
                        }
                    }
                } else {
                    const comodidades = data.comodidades || [];
                    const iconosComodidades = {
                        "wifi": "fa-wifi",
                        "estacionamiento": "fa-square-parking",
                        "delivery": "fa-motorcycle",
                        "reservas": "fa-calendar-check",
                        "aire acondicionado": "fa-snowflake",
                        "terraza": "fa-umbrella-beach",
                        "música en vivo": "fa-music",
                        "tv": "fa-tv"
                    };
                    if (comodidades.length > 0) {
                        const iconosHtml = comodidades.slice(0, 4).map(c => {
                            const icon = iconosComodidades[c.toLowerCase()] || "fa-circle-check";
                            return `<span title="${c}" style="font-size:13px; color:#a29bfe;"><i class="fa-solid ${icon}"></i></span>`;
                        }).join('');
                        timeContainerHtml = `
                    <div class="time-info-container">
                        <div class="badge-days badge-normal" style="gap:8px;">
                            ${iconosHtml}
                            <span style="font-size:11px; color:var(--text-secondary);">${comodidades[0]}${comodidades.length > 1 ? ` +${comodidades.length - 1}` : ''}</span>
                        </div>
                    </div>`;
                    } else {
                        timeContainerHtml = `
                    <div class="badge-days badge-normal">
                        <i class="fa-solid fa-tag"></i> Oferta disponible
                    </div>`;
                    }
                }

                // Obtener solo la primera imagen de la promo
                const singleImgUrl = listImg.length > 0 ? listImg[0] : (logoImg || 'https://via.placeholder.com/400x500?text=Geinz');

                // PON esto:
                const wsMessage = data.mensaje_predeterminado?.whatsapp?.msje_predermindo || "Hola, quiero esta oferta que vi en Geinz";
                const shareMessage = data.mensaje_predeterminado?.compartir?.msje_predermindo || "Mira esta promo en Geinz 🎁";
                const phoneNumber = info.numero || "";
                const localidad = data.ubicacion?.direccion?.toLowerCase().includes("barranca") ? "ba" : "ba";
                const promoId = info.id_promocion || "";
                const promoUrl = `https://geinzworkapp.web.app/api/share?t=prms&l=${localidad}&pi=${promoId}`;

                let buttonsHtml = "";
                if (info.compartir === true) {
                    buttonsHtml += `<button class="action-btn share" onclick="sharePromo('${shareMessage}', '${promoUrl}')"><i class="fa-solid fa-paper-plane"></i></button>`;
                }
                if (info.contactar === true) {
                    buttonsHtml += `<button class="action-btn whatsapp" onclick="contactWhatsApp('${phoneNumber}', '${wsMessage}', '${promoUrl}')"><i class="fa-brands fa-whatsapp"></i></button>`;
                }
                htmlContent += `
            <div class="promo-card" style="animation-delay: ${delayIndex * 0.1}s" onclick="abrirPromo('${promoUrl}')">
                <div class="image-container-single">
                    <img src="${singleImgUrl}" alt="Oferta" loading="lazy">
                </div>
                <div class="promo-footer">
                    <div class="store-header-row">
                        <div class="store-info">
                            <img class="store-logo" src="${logoImg}" alt="${info.nombre_tienda}">
                            <div class="store-text-details">
                                <span class="store-name">${info.nombre_tienda || 'Negocio Local'}</span>
                                <span class="promo-title">${info.titulo || 'Descuento'}</span>
                            </div>
                        </div>
                    </div>
                    <div class="store-actions-row">
                        ${timeContainerHtml}
                        <div class="action-buttons">
                            ${buttonsHtml}
                        </div>
                    </div>
                </div>
            </div>
        `;
                delayIndex++;
            });

            /* Rediseño del Banner Final (Fiel a la estructura de la captura) */
            htmlContent += `
        <div class="download-banner">
            <div class="download-banner-content">
                <h3>¿Listo para expandir tu flujo comercial?</h3>
                <p>Descarga la app nativa de Geinz y accede de manera centralizada a cientos de promociones de impacto, activaciones en tiempo real y el posicionamiento integral de las mejores marcas locales en Barranca.</p>
                <a href="https://play.google.com/store" target="_blank" class="download-btn">
                    Descargar Aplicación Nativa
                </a>
            </div>
            <i class="fa-brands fa-google-play download-banner-icon"></i>
        </div>
    `;
            promosContainer.innerHTML = htmlContent;
        }

        window.addEventListener('DOMContentLoaded', init);
    </script>

    <script>
        function contactWhatsApp(phone, message, url) {
            if (!phone) return;
            const cleanPhone = phone.replace(/\s+/g, '');
            const textoCompleto = `${message}\n${url}`;
            window.open(`https://api.whatsapp.com/send?phone=51${cleanPhone}&text=${encodeURIComponent(textoCompleto)}`, '_blank');
        }

        function sharePromo(message, url) {
            const textoCompleto = `${message}\n${url}`;
            if (navigator.share) {
                navigator.share({ title: 'Geinz', text: textoCompleto, url: url }).catch(console.error);
            } else {
                navigator.clipboard.writeText(textoCompleto);
                alert("¡Copiado al portapapeles!");
            }
        }

        function abrirPromo(url) {
            window.open(url, '_blank');
        }
    </script>
</body>

</html>
