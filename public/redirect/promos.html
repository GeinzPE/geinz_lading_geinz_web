<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
    <title>Promos compartidas · Geinz</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/photoswipe@5/dist/photoswipe.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
            background: #010101;
            color: #ffffff;
            overflow-x: hidden;
            position: relative;
        }

        /* fondo dinámico */
        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 20% 30%, rgba(168, 85, 247, 0.2), transparent 55%),
                radial-gradient(circle at 80% 70%, rgba(59, 130, 246, 0.12), transparent 55%),
                repeating-linear-gradient(45deg, rgba(255, 255, 255, .01) 0px, rgba(255, 255, 255, .01) 2px, transparent 2px, transparent 8px);
            pointer-events: none;
            z-index: 0;
            animation: slowPan 30s infinite alternate;
        }

        @keyframes slowPan {
            0% {
                background-position: 0% 0%;
            }

            100% {
                background-position: 100% 100%;
            }
        }

        /* header */
        .page-header {
            position: relative;
            z-index: 3;
            text-align: center;
            padding: 60px 24px 40px;
        }


        .header-title {
            font-size: clamp(34px, 6vw, 68px);
            font-weight: 800;
            letter-spacing: -0.03em;
            line-height: 1.1;
            background: linear-gradient(135deg, #FFFFFF 0%, #c4b5fd 70%, #a855f7 100%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 18px;
        }

        .header-sub {
            font-size: 16px;
            color: #9ca3af;
            font-weight: 500;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .header-sub span {
            color: #c084fc;
            font-weight: 700;
            background: rgba(168, 85, 247, 0.2);
            padding: 4px 12px;
            border-radius: 40px;
        }

        /* GRID: misma altura en todas las tarjetas */
        .promos-grid {
            position: relative;
            z-index: 2;
            display: grid;
            grid-template-columns: 1fr;
            gap: 28px;
            padding: 0 20px 70px;
            max-width: 1400px;
            margin: 0 auto;
            align-items: stretch;
        }

        @media (min-width: 640px) {
            .promos-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 30px;
                padding: 0 30px 70px;
            }
        }

        @media (min-width: 1100px) {
            .promos-grid {
                grid-template-columns: repeat(3, 1fr);
                gap: 32px;
            }
        }

        /* TARJETA PRINCIPAL - altura 100% para que todas midan igual */
        .promo-card {
            background: rgba(10, 10, 14, 0.85);
            backdrop-filter: blur(16px);
            border-radius: 36px;
            border: 1px solid rgba(168, 85, 247, 0.3);
            overflow: hidden;
            transition: all 0.4s cubic-bezier(0.2, 0.9, 0.4, 1.1);
            box-shadow: 0 25px 40px -12px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            height: 100%;
            /* forzamos altura completa dentro de la celda grid */
            animation: fadeUp 0.6s ease backwards;
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .promo-card:hover {
            transform: translateY(-8px);
            border-color: rgba(168, 85, 247, 0.7);
            box-shadow: 0 30px 50px -15px rgba(168, 85, 247, 0.3);
        }

        /* imagen */
        .card-img-wrap {
            position: relative;
            height: 240px;
            overflow: hidden;
            background: #0a0a0c;
            cursor: zoom-in;
            flex-shrink: 0;
        }

        .card-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.7s ease-out;
        }

        .promo-card:hover .card-img {
            transform: scale(1.05);
        }

        .card-img-wrap::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(to top, rgba(0, 0, 0, 0.8) 0%, transparent 45%);
            pointer-events: none;
        }



        /* navegador imágenes */
        .img-nav {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(12px);
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 60px;
            color: white;
            font-size: 24px;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            z-index: 20;
        }

        .img-nav:hover {
            background: #a855f7;
            transform: translateY(-50%) scale(1.05);
        }

        .img-nav.prev {
            left: 12px;
        }

        .img-nav.next {
            right: 12px;
        }

        .img-nav.hidden {
            display: none;
        }

        .img-counter {
            position: absolute;
            top: 18px;
            right: 18px;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(10px);
            padding: 5px 12px;
            border-radius: 40px;
            font-size: 12px;
            font-weight: 600;
            z-index: 15;
            color: #e2e8f0;
        }

        .img-dots {
            position: absolute;
            bottom: 18px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 8px;
            z-index: 15;
        }

        .img-dot {
            width: 6px;
            height: 6px;
            background: rgba(255, 255, 255, 0.5);
            border-radius: 10px;
            transition: all 0.2s;
        }

        .img-dot.active {
            width: 20px;
            background: #a855f7;
            box-shadow: 0 0 6px #c084fc;
        }

        /* BODY CARD: flexible para empujar botones al fondo */
        .card-body {
            padding: 26px 24px 28px;
            display: flex;
            flex-direction: column;
            flex: 1;
        }

        .biz-row {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 20px;
            cursor: pointer;
            flex-wrap: wrap;
        }

        .biz-avatar {
            width: 48px;
            height: 48px;
            background: linear-gradient(145deg, #a855f7, #6d28d9);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 20px;
            color: white;
            box-shadow: 0 8px 20px rgba(168, 85, 247, 0.3);
            overflow: hidden;
            flex-shrink: 0;
        }

        .biz-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .biz-info {
            flex: 1;
            min-width: 0;
        }

        .biz-name {
            font-weight: 800;
            font-size: 16px;
            letter-spacing: -0.3px;
            color: #f1f5f9;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .biz-meta {
            font-size: 11px;
            color: #7e8b9c;
            margin-top: 3px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .biz-verified {
            background: rgba(168, 85, 247, 0.12);
            border: 1px solid rgba(168, 85, 247, 0.3);
            border-radius: 60px;
            padding: 6px 12px;
            font-size: 10px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 6px;
            color: #c084fc;
            white-space: nowrap;
            flex-shrink: 0;
        }

        /* TÍTULO Y DESCRIPCIÓN con límite de líneas para mantener consistencia */
        .promo-title {
            font-size: 24px;
            font-weight: 800;
            letter-spacing: -0.02em;
            line-height: 1.25;
            margin-bottom: 12px;
            background: linear-gradient(145deg, #ffffff, #d9d9ff);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .promo-desc {
            font-size: 14px;
            line-height: 1.55;
            color: #cbd5e1;
            margin-bottom: 20px;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        /* días restantes */
        .days-row {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            width: fit-content;
            padding: 7px 18px;
            border-radius: 60px;
            background: rgba(168, 85, 247, 0.08);
            border: 1px solid rgba(168, 85, 247, 0.2);
            font-size: 12px;
            font-weight: 700;
            margin-bottom: 18px;
            backdrop-filter: blur(4px);
        }

        .days-dot {
            width: 9px;
            height: 9px;
            border-radius: 10px;
            background: #10b981;
            box-shadow: 0 0 5px #34d399;
        }

        .hr {
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(168, 85, 247, 0.5), transparent);
            margin: 12px 0 20px;
        }

        /* GRUPO DE BOTONES (siempre al fondo) */
        .buttons-group {
            margin-top: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .btn-wa {
            background: linear-gradient(105deg, #25D366, #128C7E);
            border-radius: 60px;
            height: 54px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            font-weight: 800;
            font-size: 15px;
            text-decoration: none;
            color: white;
            transition: all 0.25s;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .btn-wa:hover {
            transform: scale(1.02);
            box-shadow: 0 12px 28px rgba(37, 211, 102, 0.3);
        }

        .share-row {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .share-label {
            font-size: 11px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: #7e8b9c;
        }

        .share-divider {
            flex: 1;
            height: 1px;
            background: rgba(255, 255, 255, 0.08);
        }

        .btn-share-pill {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 60px;
            height: 42px;
            padding: 0 22px;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            font-weight: 600;
            color: #e2e8f0;
            cursor: pointer;
            transition: all 0.2s;
            backdrop-filter: blur(8px);
            white-space: nowrap;
        }

        .btn-share-pill:hover {
            background: rgba(168, 85, 247, 0.2);
            border-color: #a855f7;
            transform: translateY(-2px);
        }

        /* estado de promo vencida / error (también misma altura) */
        .state-card {
            background: rgba(8, 8, 12, 0.85);
            backdrop-filter: blur(20px);
            border-radius: 36px;
            border: 1px solid rgba(239, 68, 68, 0.3);
            padding: 44px 24px;
            text-align: center;
            animation: fadeUp 0.5s ease;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .state-icon {
            font-size: 46px;
            margin-bottom: 16px;
            filter: drop-shadow(0 6px 12px rgba(0, 0, 0, 0.5));
        }

        .state-badge {
            font-size: 11px;
            font-weight: 800;
            text-transform: uppercase;
            padding: 6px 16px;
            border-radius: 60px;
            display: inline-block;
            margin-bottom: 16px;
            width: fit-content;
            align-self: center;
        }

        .state-badge.expired {
            background: rgba(245, 158, 11, 0.15);
            border: 1px solid #f59e0b;
            color: #fbbf24;
        }

        .state-badge.deleted {
            background: rgba(239, 68, 68, 0.12);
            border: 1px solid #ef4444;
            color: #f87171;
        }

        .state-title {
            font-size: 22px;
            font-weight: 800;
            margin-bottom: 8px;
        }

        .state-sub {
            font-size: 14px;
            color: #9ca3af;
        }

        /* skeletons con misma estructura de altura */
        .sk-card {
            background: rgba(12, 12, 16, 0.7);
            backdrop-filter: blur(12px);
            border-radius: 36px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        .sk-img {
            height: 240px;
            background: linear-gradient(110deg, #15171c 20%, #20222a 50%, #15171c 80%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
            flex-shrink: 0;
        }

        @keyframes shimmer {
            0% {
                background-position: 200% 0;
            }

            100% {
                background-position: -200% 0;
            }
        }

        .sk-body {
            padding: 26px 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            flex: 1;
        }

        .sk-line {
            height: 14px;
            background: #20222b;
            border-radius: 40px;
        }

        .sk-line.short {
            width: 40%;
        }

        .sk-line.medium {
            width: 70%;
        }

        .sk-avatar {
            width: 48px;
            height: 48px;
            background: #20222b;
            border-radius: 20px;
        }

        /* toast */
        .toast {
            position: fixed;
            left: 50%;
            bottom: 30px;
            transform: translateX(-50%) translateY(100px);
            background: #1f1f2ed9;
            backdrop-filter: blur(24px);
            border: 1px solid rgba(168, 85, 247, 0.5);
            border-radius: 60px;
            padding: 12px 24px;
            color: white;
            font-weight: 600;
            z-index: 2000;
            transition: transform 0.4s ease;
            white-space: nowrap;
            font-size: 14px;
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
        }

        @media (max-width: 600px) {
            .page-header {
                padding: 40px 20px 30px;
            }

            .promo-title {
                font-size: 22px;
            }

            .card-img-wrap {
                height: 200px;
            }

            .card-body {
                padding: 18px 18px 22px;
            }

            .btn-share-pill {
                white-space: nowrap;
            }

            .biz-verified {
                white-space: nowrap;
            }
        }
    </style>
</head>

<body>

    <div class="page-header">
        <h1 class="header-title">Promociones <br>encontradas por <span
                style="background: none; -webkit-text-fill-color:#c084fc;" id="nombreUsuario">Daniel de Geinz</span>
        </h1>
        <p class="header-sub"><span id="countLabel">cargando promos...</span></p>
    </div>

    <div class="promos-grid" id="grid"></div>
    <div class="toast" id="toast">✓ Enlace copiado al portapapeles</div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBFV4SF7hMFifKz45GaBiu2xwTq7T_gxBQ",
            authDomain: "geinzworkapp.firebaseapp.com",
            databaseURL: "https://geinzworkapp-default-rtdb.firebaseio.com",
            projectId: "geinzworkapp",
            storageBucket: "geinzworkapp.appspot.com",
            messagingSenderId: "921389328767",
            appId: "1:921389328767:web:dc6fffc43a51444f5b524a",
            measurementId: "G-38J7RJP8HK"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const params = new URLSearchParams(window.location.search);
        const idsRaw = params.get("ids") || "";
        const ids = idsRaw.split(",").map(s => s.trim()).filter(Boolean);
        const localidad = params.get("localidad") || params.get("l") || "barranca";
        const nombreParam = params.get("n") || params.get("nombre") || "";

        if (nombreParam) document.getElementById("nombreUsuario").innerHTML = nombreParam;

        const grid = document.getElementById("grid");

        function showToast() {
            const toast = document.getElementById("toast");
            toast.classList.add("show");
            setTimeout(() => toast.classList.remove("show"), 2500);
        }

        function copyToClip(text) {
            navigator.clipboard.writeText(text).then(showToast).catch(() => {
                const ta = document.createElement("textarea");
                ta.value = text;
                ta.style.cssText = "position:fixed;opacity:0";
                document.body.appendChild(ta);
                ta.select();
                document.execCommand("copy");
                document.body.removeChild(ta);
                showToast();
            });
        }

        function calcDaysLeft(datos) {
            if (!datos?.timestamp_fin) return null;
            const fin = datos.timestamp_fin?.toDate ? datos.timestamp_fin.toDate() : new Date(datos.timestamp_fin);
            const diff = Math.ceil((fin - Date.now()) / 86400000);
            return diff > 0 ? diff : 0;
        }

        function isExpired(promo) {
            if (promo.estado === "vencido" || promo.estado === "expirado") return true;
            const fechaData = promo.datos_hora_fecha || {};
            if (fechaData.activo === false) return true;
            const tsFin = fechaData.timestamp_fin;
            if (tsFin) {
                const fin = tsFin?.toDate ? tsFin.toDate() : new Date(tsFin);
                if (!isNaN(fin) && fin < new Date()) return true;
            }
            return false;
        }

        // Galería mejorada
        function setupGallery(wrap, images) {
            if (!images.length) {
                wrap.innerHTML = `<div class="card-placeholder" style="display:flex;align-items:center;justify-content:center;height:100%;font-size:48px;background:#08080c;">🎁</div>`;
                return;
            }
            wrap.innerHTML = "";
            let current = 0;
            const imgEl = document.createElement("img");
            imgEl.className = "card-img";
            imgEl.src = images[0];
            wrap.appendChild(imgEl);

            if (images.length === 1) {
                imgEl.addEventListener("click", () => openPSWP(images, 0));
                return;
            }

            const counter = document.createElement("div");
            counter.className = "img-counter";
            counter.innerText = `1/${images.length}`;
            wrap.appendChild(counter);

            const dotsDiv = document.createElement("div");
            dotsDiv.className = "img-dots";
            images.forEach((_, i) => {
                const dot = document.createElement("div");
                dot.className = `img-dot ${i === 0 ? "active" : ""}`;
                dotsDiv.appendChild(dot);
            });
            wrap.appendChild(dotsDiv);

            const prevBtn = document.createElement("button");
            prevBtn.className = "img-nav prev hidden";
            prevBtn.innerHTML = "‹";
            wrap.appendChild(prevBtn);
            const nextBtn = document.createElement("button");
            nextBtn.className = "img-nav next";
            nextBtn.innerHTML = "›";
            wrap.appendChild(nextBtn);

            function updateView(index) {
                current = index;
                imgEl.src = images[current];
                counter.innerText = `${current + 1}/${images.length}`;
                const allDots = dotsDiv.querySelectorAll(".img-dot");
                allDots.forEach((d, i) => d.classList.toggle("active", i === current));
                prevBtn.classList.toggle("hidden", current === 0);
                nextBtn.classList.toggle("hidden", current === images.length - 1);
            }

            prevBtn.addEventListener("click", (e) => { e.stopPropagation(); if (current > 0) updateView(current - 1); });
            nextBtn.addEventListener("click", (e) => { e.stopPropagation(); if (current < images.length - 1) updateView(current + 1); });
            imgEl.addEventListener("click", () => openPSWP(images, current));

            let startX = 0;
            wrap.addEventListener("touchstart", (e) => { startX = e.changedTouches[0].screenX; }, { passive: true });
            wrap.addEventListener("touchend", (e) => {
                const endX = e.changedTouches[0].screenX;
                const diff = startX - endX;
                if (Math.abs(diff) > 45) {
                    if (diff > 0 && current < images.length - 1) updateView(current + 1);
                    else if (diff < 0 && current > 0) updateView(current - 1);
                }
            });
        }

        async function openPSWP(images, index) {
            const PhotoSwipe = (await import("https://cdn.jsdelivr.net/npm/photoswipe@5/dist/photoswipe.esm.js")).default;
            const dataSource = await Promise.all(images.map(src => new Promise(res => {
                const img = new Image();
                img.onload = () => res({ src, w: img.naturalWidth, h: img.naturalHeight });
                img.onerror = () => res({ src, w: 1200, h: 900 });
                img.src = src;
            })));
            new PhotoSwipe({ dataSource, index, bgOpacity: 0.96, showHideAnimationType: "zoom" }).init();
        }

        function renderDaysWidget(container, datos) {
            const days = calcDaysLeft(datos);
            if (days === null) { container.style.display = "none"; return; }
            if (days === 0) {
                container.innerHTML = `<div class="days-dot" style="background:#ef4444;box-shadow:0 0 6px #ef4444;"></div> 🧨 ¡Último día!`;
                container.style.background = "rgba(239,68,68,0.12)";
                container.style.borderColor = "rgba(239,68,68,0.5)";
                container.style.color = "#fca5a5";
            } else if (days <= 2) {
                container.innerHTML = `<div class="days-dot" style="background:#ef4444;animation:blink 1s infinite;"></div> ${days} día${days !== 1 ? "s" : ""} restante${days !== 1 ? "s" : ""}`;
                container.style.background = "rgba(239,68,68,0.1)";
                container.style.borderColor = "rgba(239,68,68,0.45)";
                container.style.color = "#fecaca";
            } else if (days <= 5) {
                container.innerHTML = `<div class="days-dot" style="background:#f59e0b;"></div> ⏳ ${days} días restantes`;
                container.style.background = "rgba(245,158,11,0.1)";
                container.style.borderColor = "rgba(245,158,11,0.4)";
                container.style.color = "#fde68a";
            } else {
                container.innerHTML = `<div class="days-dot" style="background:#10b981;"></div> 🟢 ${days} días vigente`;
                container.style.background = "rgba(16,185,129,0.08)";
                container.style.borderColor = "rgba(16,185,129,0.35)";
                container.style.color = "#a7f3d0";
            }
        }

        function buildCard(promo, id) {
            const info = promo.informacion || {};
            const imgC = promo.img_container || {};
            const msgs = promo.mensaje_predeterminado || {};
            const datos = promo.datos_hora_fecha || {};
            const images = imgC.lista_img || [];

            const card = document.createElement("div");
            card.className = "promo-card";

            const imgWrap = document.createElement("div");
            imgWrap.className = "card-img-wrap";
            setupGallery(imgWrap, images);
            if (promo.rango_establecido) {
                const badge = document.createElement("div");
                badge.textContent = `${promo.rango_establecido}% OFF`;
                imgWrap.appendChild(badge);
            }
            card.appendChild(imgWrap);

            const body = document.createElement("div");
            body.className = "card-body";

            // fila negocio
            const bizRow = document.createElement("div");
            bizRow.className = "biz-row";
            const avatarDiv = document.createElement("div");
            avatarDiv.className = "biz-avatar";
            if (imgC.logo_img) {
                const logoImg = document.createElement("img");
                logoImg.src = imgC.logo_img;
                avatarDiv.appendChild(logoImg);
            } else {
                avatarDiv.textContent = (info.nombre_tienda || "G")[0].toUpperCase();
            }
            const bizInfoDiv = document.createElement("div");
            bizInfoDiv.className = "biz-info";
            bizInfoDiv.innerHTML = `<div class="biz-name">${info.nombre_tienda || "Negocio destacado"}</div><div class="biz-meta">Ofertas verificadas</div>`;
            const verifiedBadge = document.createElement("div");
            verifiedBadge.className = "biz-verified";
            verifiedBadge.innerHTML = `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg> Confiable`;

            const tiendaId = info.id_tienda || promo.id_tienda || "";
            if (tiendaId) {
                bizRow.style.cursor = "pointer";
                bizRow.addEventListener("click", () => window.location.href = `https://geinzworkapp.web.app/api/share?t=ti&id=${tiendaId}&l=${localidad}&c=${info.categoria || "general"}`);
            }
            bizRow.append(avatarDiv, bizInfoDiv, verifiedBadge);
            body.appendChild(bizRow);

            // título
            const title = document.createElement("h2");
            title.className = "promo-title";
            title.textContent = info.titulo || "Oferta especial";
            body.appendChild(title);

            // descripción
            const desc = document.createElement("p");
            desc.className = "promo-desc";
            desc.textContent = info.descripcion || "Aprovecha esta oportunidad única 🔥";
            body.appendChild(desc);

            // días restantes
            const daysRow = document.createElement("div");
            daysRow.className = "days-row";
            renderDaysWidget(daysRow, datos);
            body.appendChild(daysRow);

            const hrDiv = document.createElement("div");
            hrDiv.className = "hr";
            body.appendChild(hrDiv);

            // Grupo de botones (siempre al fondo)
            const buttonsGroup = document.createElement("div");
            buttonsGroup.className = "buttons-group";

            const numero = info.numero?.replace(/\D/g, "");
            const shareLink = `https://geinzworkapp.web.app/api/share?t=prms&l=${localidad}&pi=${id}`;
            const waMsg = msgs.whatsapp?.msje_predermindo || "¡Hola! Vi esta promo en Geinz y me interesa:";

            if (info.contactar && numero) {
                const btnWa = document.createElement("a");
                btnWa.className = "btn-wa";
                btnWa.href = `https://wa.me/51${numero}?text=${encodeURIComponent(waMsg + " " + shareLink)}`;
                btnWa.target = "_blank";
                btnWa.innerHTML = `Contactar por WhatsApp`;
                buttonsGroup.appendChild(btnWa);
            }

            // fila compartir
            const shareRow = document.createElement("div");
            shareRow.className = "share-row";
            const shareText = msgs.compartir?.msje_predermindo || "Mira esta increíble promo en Geinz ✨";
            const shareBtn = document.createElement("button");
            shareBtn.className = "btn-share-pill";
            shareBtn.innerHTML = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg> Compartir promo`;
            shareBtn.addEventListener("click", () => {
                const fullMsg = `${shareText}\n${shareLink}`;
                if (navigator.share) navigator.share({ text: fullMsg }).catch(() => copyToClip(fullMsg));
                else copyToClip(fullMsg);
            });
            shareRow.innerHTML = `<span class="share-label">Difundir</span><div class="share-divider"></div>`;
            shareRow.appendChild(shareBtn);
            buttonsGroup.appendChild(shareRow);

            body.appendChild(buttonsGroup);
            card.appendChild(body);
            return card;
        }

        function buildSkeleton() {
            const frag = document.createDocumentFragment();
            for (let i = 0; i < ids.length; i++) {
                const sk = document.createElement("div");
                sk.className = "sk-card";
                sk.id = `sk-${i}`;
                sk.innerHTML = `
        <div class="sk-img"></div>
        <div class="sk-body">
          <div style="display:flex; gap:14px;"><div class="sk-avatar"></div><div style="flex:1"><div class="sk-line" style="width:70%"></div><div class="sk-line short" style="margin-top:8px"></div></div></div>
          <div class="sk-line medium"></div>
          <div class="sk-line"></div>
          <div class="sk-line short"></div>
          <div class="sk-line" style="width:40%"></div>
        </div>`;
                frag.appendChild(sk);
            }
            grid.appendChild(frag);
        }

        async function loadPromoById(id) {
            const ref = doc(db, "Tiendas", localidad, "promos_ofertas", id);
            const snap = await getDoc(ref);
            return snap.exists() ? { id: snap.id, ...snap.data() } : null;
        }

        async function init() {
            if (!ids.length) {
                grid.innerHTML = `<div class="state-card"><div class="state-icon">🔍</div><div class="state-badge deleted">Sin IDs</div><div class="state-title">No se encontraron promociones</div><div class="state-sub">Verifica el enlace compartido.</div></div>`;
                document.getElementById("countLabel").innerText = "0 promos";
                return;
            }
            buildSkeleton();
            let validCount = 0;
            for (let i = 0; i < ids.length; i++) {
                const skel = document.getElementById(`sk-${i}`);
                if (!skel) continue;
                try {
                    const promo = await loadPromoById(ids[i]);
                    if (!promo || isExpired(promo)) {
                        const expiredCard = document.createElement("div");
                        expiredCard.className = "state-card";
                        expiredCard.innerHTML = `<div class="state-icon">⏳</div><div class="state-badge expired">Promoción vencida</div><div class="state-title">Esta oferta ya expiró</div><div class="state-sub">El tiempo límite finalizó, pero hay más promos disponibles en Geinz.</div>`;
                        skel.replaceWith(expiredCard);
                        continue;
                    }
                    const cardElement = buildCard(promo, ids[i]);
                    skel.replaceWith(cardElement);
                    validCount++;
                } catch (error) {
                    const errorCard = document.createElement("div");
                    errorCard.className = "state-card";
                    errorCard.innerHTML = `<div class="state-icon">⚠️</div><div class="state-badge deleted">Error</div><div class="state-title">No se pudo cargar</div><div class="state-sub">Intenta nuevamente más tarde.</div>`;
                    skel.replaceWith(errorCard);
                }
            }
            document.getElementById("countLabel").innerHTML = `${validCount} promo${validCount !== 1 ? "s" : ""} activa${validCount !== 1 ? "s" : ""}`;
        }
        init();
    </script>
    <style>
        @keyframes blink {

            0%,
            100% {
                opacity: 1
            }

            50% {
                opacity: 0.4
            }
        }
    </style>
</body>

</html>
