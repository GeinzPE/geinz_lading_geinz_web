<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=yes" />

    <title>Geinz | Servicios Barranca</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">

    <script type="module" src="/js/share/pantalla_servicios.js"></script>

    <link rel="stylesheet" href="/style/shareStyle/pantalla_servicio.css" />

    <link rel="icon" href="/img/icons/favicon.ico" sizes="any">
    <link rel="icon" type="image/png" sizes="32x32" href="/img/icons/favicon-96x96.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/img/icons/favicon-16x16.png">
    <link rel="apple-touch-icon" href="/img/icons/apple-touch-icon.png">
    <link rel="manifest" href="/img/icons/site.webmanifest">

    <style>
        body {
            margin: 0;
        }

        #app {
            padding-top: 60px;
            /* altura del botón (42px) + margen de aire */
            box-sizing: border-box;
        }

        .back-btn {
            position: fixed;
            top: 16px;
            left: 16px;
            z-index: 9999;

            width: 42px;
            height: 42px;

            display: flex;
            align-items: center;
            justify-content: center;

            border: none;
            border-radius: 50%;

            background: rgba(20, 20, 20, 0.45);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);

            color: #fff;
            font-size: 16px;

            cursor: pointer;
            transition: background 0.2s ease, transform 0.15s ease;
        }

        .back-btn:hover {
            background: rgba(20, 20, 20, 0.65);
        }

        .back-btn:active {
            transform: scale(0.92);
        }
    </style>
</head>

<body>

    <button class="back-btn" onclick="window.location.href='/index.html'" aria-label="Volver al inicio">
        <i class="fa-solid fa-chevron-left"></i>
    </button>

    <div id="app"></div>

</body>

</html>
