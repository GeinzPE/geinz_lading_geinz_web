<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Turismo | Geinz</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">

    <script type="module" src="../js/share/pantalla_turismo.js"></script>
    <link rel="stylesheet" href="../style/shareStyle/pantalla_turismo.css" />

    <link rel="icon" href="../img/icons/favicon.ico" sizes="any">
    <link rel="icon" type="image/png" sizes="32x32" href="../img/icons/favicon-96x96.png">
    <link rel="icon" type="image/png" sizes="16x16" href="../img/icons/favicon-16x16.png">
    <link rel="apple-touch-icon" href="../img/icons/apple-touch-icon.png">
    <link rel="manifest" href="../img/icons/site.webmanifest">

</head>

<body>

    <!-- =========================
         FULLSCREEN SKELETON
    ========================== -->

    <div id="fullscreenSkeleton" class="fullscreen-skeleton">

        <div class="fs-header">

            <div class="fs-title shimmer-box"></div>

            <div class="fs-desc shimmer-box"></div>

            <div class="fs-filters">
                <div class="fs-filter shimmer-box"></div>
                <div class="fs-filter shimmer-box"></div>
                <div class="fs-filter shimmer-box"></div>
                <div class="fs-filter shimmer-box"></div>
            </div>

        </div>

        <div class="fs-grid">

            <div class="fs-card">
                <div class="fs-img shimmer-box"></div>
                <div class="fs-line shimmer-box"></div>
                <div class="fs-line short shimmer-box"></div>
            </div>

            <div class="fs-card">
                <div class="fs-img shimmer-box"></div>
                <div class="fs-line shimmer-box"></div>
                <div class="fs-line short shimmer-box"></div>
            </div>

            <div class="fs-card">
                <div class="fs-img shimmer-box"></div>
                <div class="fs-line shimmer-box"></div>
                <div class="fs-line short shimmer-box"></div>
            </div>

            <div class="fs-card">
                <div class="fs-img shimmer-box"></div>
                <div class="fs-line shimmer-box"></div>
                <div class="fs-line short shimmer-box"></div>
            </div>

        </div>

    </div>

    <!-- =========================
         APP CONTENT
    ========================== -->

    <div id="appContent" style="display:none;">

        <header class="sticky-header">

            <div class="container">

                <div class="top-nav">
                    <h1>Lugares OP de Barranca</h1>
                </div>

                <p class="hero-desc">
                    Descubre los mejores lugares turísticos en Barranca.
                </p>

                <div class="filter-scroll" id="filterContainer">
                    <button class="filter-btn active" data-filter="todos">
                        Explorar Todos
                    </button>
                </div>

            </div>

        </header>

        <main class="container">

            <div class="grid" id="placesGrid"></div>

        </main>

    </div>



</body>

</html>
