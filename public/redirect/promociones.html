          <div class="discover-content">

            <h3>Descubre más ofertas y descuentos en Geinz</h3>

              Ver más promociones

      </div>

  </div>

  <div class="toast" id="toast">✓ ¡Enlace copiado!</div>

  <script>
    /* ══════════════════════════════════════════
       COLOR DINÁMICO ESTILO YT MUSIC
       Se extrae del logo del negocio.
       El JS principal inyecta la img en .biz-avatar
       con appendChild(), así que usamos MutationObserver
       para detectar cuando aparece y extraer el color.
    ══════════════════════════════════════════ */

    function applyAccent(r, g, b) {
      const root = document.documentElement;
      root.style.setProperty('--accent',     `rgb(${r},${g},${b})`);
      root.style.setProperty('--accent2',    `rgba(${r},${g},${b},0.82)`);
      root.style.setProperty('--accentSoft', `rgba(${r},${g},${b},0.18)`);
    }

    function extractColorFromImg(img) {
      try {
        const SIZE = 80;
        const canvas = document.createElement('canvas');
        canvas.width  = SIZE;
        canvas.height = SIZE;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, SIZE, SIZE);

        const data = ctx.getImageData(0, 0, SIZE, SIZE).data;
        let r = 0, g = 0, b = 0, count = 0;

        for (let i = 0; i < data.length; i += 16) {
          const rr = data[i], gg = data[i+1], bb = data[i+2], aa = data[i+3];
          if (aa < 128) continue;
          const brightness = (rr + gg + bb) / 3;
          const isGray = Math.abs(rr - gg) < 20 && Math.abs(gg - bb) < 20;
          if (brightness > 35 && brightness < 230 && !isGray) {
            r += rr; g += gg; b += bb; count++;
          }
        }

        if (count < 50) return false; // imagen sin color útil
        applyAccent(Math.floor(r/count), Math.floor(g/count), Math.floor(b/count));
        return true;
      } catch(e) {
        return false; // CORS tainted → silencio
      }
    }

    function tryExtract(img) {
      if (!img) return;
      img.crossOrigin = 'anonymous';
      if (img.complete && img.naturalWidth > 0) {
        extractColorFromImg(img);
      } else {
        img.addEventListener('load', () => extractColorFromImg(img), { once: true });
      }
    }

    /* Observar .biz-avatar para cuando el JS inyecte el logo */
    const avatarObserver = new MutationObserver(() => {
      const img = document.querySelector('.biz-avatar img');
      if (img) {
        avatarObserver.disconnect();
        tryExtract(img);
      }
    });
    avatarObserver.observe(document.body, { childList: true, subtree: true });

    /* Observar .promo-img-wrap como fallback (la imagen de promo) */
    let accentApplied = false;
    const promoObserver = new MutationObserver(() => {
      const img = document.querySelector('.promo-img');
      if (img && !accentApplied) {
        promoObserver.disconnect();
        const logoImg = document.querySelector('.biz-avatar img');
        /* Solo usar promo si el logo ya no pudo */
        if (!logoImg) tryExtract(img);
      }
    });
    promoObserver.observe(document.body, { childList: true, subtree: true });
  </script>

</body>
</html>
