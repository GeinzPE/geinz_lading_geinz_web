<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Turismo Premium | Geinz</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">

    <style>
        :root {
            --primary: #8800F2;
            --bg: #000000;
            --card-bg: #0a0a0a;
            --text-white: #ffffff;
            --text-gray: #888888;
            --accent-green: #00ff88;
            --glass: rgba(255, 255, 255, 0.03);
            --border: rgba(255, 255, 255, 0.08);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background: var(--bg);
            color: white;
            overflow-x: hidden;
        }

        .container {
            max-width: 1200px;
            margin: auto;
            padding: 0 24px;
        }

        /* =========================
           FULLSCREEN SKELETON
        ========================== */

        .fullscreen-skeleton {
            position: fixed;
            inset: 0;
            background: #000;
            z-index: 99999;
            overflow-y: auto;
            padding: 24px;
        }

        .fs-header {
            max-width: 1200px;
            margin: auto;
            margin-bottom: 40px;
        }

        .fs-title {
            width: 320px;
            height: 42px;
            border-radius: 14px;
            margin-bottom: 16px;
        }

        .fs-desc {
            width: 500px;
            max-width: 100%;
            height: 18px;
            border-radius: 10px;
            margin-bottom: 30px;
        }

        .fs-filters {
            display: flex;
            gap: 12px;
            overflow: hidden;
        }

        .fs-filter {
            width: 130px;
            height: 44px;
            border-radius: 14px;
            flex-shrink: 0;
        }

        .fs-grid {
            max-width: 1200px;
            margin: auto;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 30px;
        }

        .fs-card {
            background: #0a0a0a;
            border-radius: 32px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, .05);
            padding-bottom: 20px;
        }

        .fs-img {
            width: 100%;
            aspect-ratio: 4/5;
        }

        .fs-line {
            height: 20px;
            border-radius: 10px;
            margin: 20px;
        }

        .fs-line.short {
            width: 40%;
            margin-top: -5px;
        }

        .shimmer-box {
            background: linear-gradient(90deg,
                    #111 0%,
                    #1d1d1d 50%,
                    #111 100%);
            background-size: 200% 100%;
            animation: shimmerFlow 1.2s infinite linear;
        }

        @keyframes shimmerFlow {
            0% {
                background-position: 200% 0;
            }

            100% {
                background-position: -200% 0;
            }
        }

        /* =========================
           HEADER
        ========================== */

        .sticky-header {
            position: sticky;
            top: 0;
            z-index: 1000;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(25px) saturate(200%);
            border-bottom: 1px solid var(--border);
            padding: 25px 0;
        }

        .top-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .top-nav h1 {
            font-size: 2.4rem;
            font-weight: 800;
            letter-spacing: -1.5px;
            background: linear-gradient(to right, #fff, #888);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .hero-desc {
            color: var(--text-gray);
            font-size: 1rem;
            max-width: 550px;
            margin-bottom: 25px;
            line-height: 1.6;
        }

        /* =========================
           FILTERS
        ========================== */

        .filter-scroll {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            scrollbar-width: none;
        }

        .filter-scroll::-webkit-scrollbar {
            display: none;
        }

        .filter-btn {
            background: var(--glass);
            border: 1px solid var(--border);
            color: var(--text-gray);
            padding: 12px 24px;
            border-radius: 14px;
            white-space: nowrap;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9rem;
            transition: .3s;
        }

        .filter-btn:hover {
            border-color: var(--primary);
            color: white;
        }

        .filter-btn.active {
            background: var(--primary);
            border-color: var(--primary);
            color: white;
            box-shadow: 0 10px 25px rgba(136, 0, 242, .3);
        }

        /* =========================
           GRID
        ========================== */

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 30px;
            padding: 40px 0;
            opacity: 0;
            transform: translateY(20px);
            transition: .6s ease;
        }

        .grid.loaded {
            opacity: 1;
            transform: translateY(0);
        }

        /* =========================
           CARD
        ========================== */

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 32px;
            overflow: hidden;
            cursor: pointer;
            position: relative;
            transition: .4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            animation: cardFadeUp .5s cubic-bezier(0.2, 0.9, 0.4, 1.1) backwards;
        }

        .card:hover {
            transform: translateY(-12px);
            border-color: var(--primary);
        }

        .card:active {
            transform: scale(.98);
        }

        @keyframes cardFadeUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .img-wrapper {
            width: 100%;
            aspect-ratio: 4/5;
            overflow: hidden;
            position: relative;
            background: linear-gradient(135deg, #1a1a2e, #0a0a15);
        }

        .img-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0;
            transform: scale(1.03);
            transition:
                transform .8s cubic-bezier(0.2, 0.9, 0.4, 1.1),
                opacity .5s ease;
        }

        .img-wrapper img.loaded {
            opacity: 1;
            transform: scale(1);
        }

        .card:hover .img-wrapper img.loaded {
            transform: scale(1.08);
        }

        .img-wrapper::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(90deg,
                    transparent,
                    rgba(136, 0, 242, 0.1),
                    transparent);
            animation: placeholderShimmer 1.2s infinite;
            opacity: 0;
            transition: .3s;
        }

        .img-wrapper.loading::before {
            opacity: 1;
        }

        @keyframes placeholderShimmer {
            0% {
                transform: translateX(-100%);
            }

            100% {
                transform: translateX(100%);
            }
        }

        .card-body {
            padding: 20px;
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: var(--accent-green);
            font-size: .8rem;
            font-weight: 700;
            margin-bottom: 15px;
            background: rgba(0, 255, 136, .05);
            padding: 4px 10px;
            border-radius: 8px;
        }

        .card-title {
            font-size: 1.25rem;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .tag-container {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .tag {
            background: rgba(255, 255, 255, .05);
            color: #bbb;
            padding: 6px 14px;
            border-radius: 10px;
            font-size: .7rem;
            font-weight: 600;
            text-transform: uppercase;
        }

        @media(max-width:600px) {

            .top-nav h1 {
                font-size: 1.8rem;
            }

            .grid,
            .fs-grid {
                grid-template-columns: 1fr;
                gap: 20px;
            }

            .hero-desc {
                font-size: .9rem;
            }

            .fs-title {
                width: 220px;
                height: 34px;
            }

            .fs-desc {
                width: 90%;
            }
        }
    </style>
</head>

<body>

    <!-- =========================
         FULLSCREEN SKELETON
    ========================== -->

    <div id="fullscreenSkeleton" class="fullscreen-skeleton">

        <div class="fs-header">

            <div class="fs-title shimmer-box"></div>

            <div class="fs-desc shimmer-box"></div>

            <div class="fs-filters">
                <div class="fs-filter shimmer-box"></div>
                <div class="fs-filter shimmer-box"></div>
                <div class="fs-filter shimmer-box"></div>
                <div class="fs-filter shimmer-box"></div>
            </div>

        </div>

        <div class="fs-grid">

            <div class="fs-card">
                <div class="fs-img shimmer-box"></div>
                <div class="fs-line shimmer-box"></div>
                <div class="fs-line short shimmer-box"></div>
            </div>

            <div class="fs-card">
                <div class="fs-img shimmer-box"></div>
                <div class="fs-line shimmer-box"></div>
                <div class="fs-line short shimmer-box"></div>
            </div>

            <div class="fs-card">
                <div class="fs-img shimmer-box"></div>
                <div class="fs-line shimmer-box"></div>
                <div class="fs-line short shimmer-box"></div>
            </div>

            <div class="fs-card">
                <div class="fs-img shimmer-box"></div>
                <div class="fs-line shimmer-box"></div>
                <div class="fs-line short shimmer-box"></div>
            </div>

        </div>

    </div>

    <!-- =========================
         APP CONTENT
    ========================== -->

    <div id="appContent" style="display:none;">

        <header class="sticky-header">

            <div class="container">

                <div class="top-nav">
                    <h1>Lugares OP de Barranca</h1>
                </div>

                <p class="hero-desc">
                    Descubre los mejores lugares turísticos en Barranca.
                </p>

                <div class="filter-scroll" id="filterContainer">
                    <button class="filter-btn active" data-filter="todos">
                        Explorar Todos
                    </button>
                </div>

            </div>

        </header>

        <main class="container">

            <div class="grid" id="placesGrid"></div>

        </main>

    </div>

    <script type="module">

        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";

        import {
            getFirestore,
            collection,
            getDocs,
            doc,
            getDoc
        } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBFV4SF7hMFifKz45GaBiu2xwTq7T_gxBQ",
            authDomain: "geinzworkapp.firebaseapp.com",
            projectId: "geinzworkapp",
            storageBucket: "geinzworkapp.appspot.com",
            messagingSenderId: "921389328767",
            appId: "1:921389328767:web:dc6fffc43a51444f5b524a"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let allPlaces = [];

        async function renderWithSmoothImages(data) {

            const grid = document.getElementById("placesGrid");

            if (data.length === 0) {

                grid.innerHTML = `
                    <p style="
                        grid-column:1/-1;
                        text-align:center;
                        color:#888;
                        padding:50px;
                    ">
                        No se encontraron lugares.
                    </p>
                `;

                return;
            }

            grid.innerHTML = data.map((item, idx) => {

                const imgUrl =
                    item.img?.principal ||
                    item.img ||
                    "https://placehold.co/600x500/1a1a2e/8800F2?text=Geinz";

                return `
                
                <div 
                    class="card"
                    data-id="${item.id}"
                    onclick="window.location.href='turismo.html?id=${item.id}&l=barranca'"
                    style="animation-delay:${Math.min(idx * .04, .5)}s"
                >

                    <div class="img-wrapper loading" id="img-wrapper-${item.id}">
                        
                        <img
                            data-src="${imgUrl}"
                            alt="${item.titulo || 'Lugar'}"
                            id="img-${item.id}"
                        >

                    </div>

                    <div class="card-body">

                        <div class="status-badge">
                            <i class="fas fa-clock"></i>
                            Abierto 24 h
                        </div>

                        <h3 class="card-title">
                            ${item.titulo || "Lugar turístico"}
                        </h3>

                        <div class="tag-container">

                            ${(Array.isArray(item.categoria)
                        ? item.categoria
                        : [item.categoria])
                        .filter(c => c)
                        .map(c => `<span class="tag">${c}</span>`)
                        .join("")}

                        </div>

                    </div>

                </div>

                `;

            }).join("");

            for (const item of data) {

                const imgElement = document.getElementById(`img-${item.id}`);

                const wrapperElement =
                    document.getElementById(`img-wrapper-${item.id}`);

                if (!imgElement) continue;

                const src = imgElement.getAttribute("data-src");

                const tempImg = new Image();

                tempImg.onload = () => {

                    imgElement.src = src;

                    imgElement.classList.add("loaded");

                    wrapperElement?.classList.remove("loading");

                };

                tempImg.onerror = () => {

                    imgElement.src =
                        "https://placehold.co/600x500/1a1a2e/8800F2?text=Geinz";

                    imgElement.classList.add("loaded");

                    wrapperElement?.classList.remove("loading");

                };

                tempImg.src = src;

            }
        }

        async function startApp() {

            try {

                const [filterSnap, placesSnap] = await Promise.all([

                    getDoc(
                        doc(
                            db,
                            "Tiendas",
                            "categorias",
                            "categorias",
                            "turismo"
                        )
                    ),

                    getDocs(
                        collection(
                            db,
                            "Tiendas",
                            "barranca",
                            "lugares_turisticos"
                        )
                    )

                ]);

                if (filterSnap.exists()) {

                    const subcats =
                        filterSnap.data().subcategorias || [];

                    const container =
                        document.getElementById("filterContainer");

                    subcats.forEach(cat => {

                        const btn = document.createElement("button");

                        btn.className = "filter-btn";

                        btn.textContent = cat;

                        btn.setAttribute(
                            "data-filter",
                            cat.toLowerCase()
                        );

                        btn.onclick = e => filterAction(e.target);

                        container.appendChild(btn);

                    });

                }

                allPlaces = placesSnap.docs.map(doc => ({
                    id: doc.id,
                    ...doc.data()
                }));

                await renderWithSmoothImages(allPlaces);

                document
                    .getElementById("fullscreenSkeleton")
                    .style.display = "none";

                document
                    .getElementById("appContent")
                    .style.display = "block";

                document
                    .getElementById("placesGrid")
                    .classList.add("loaded");

            } catch (error) {

                console.error(error);

                document.getElementById("fullscreenSkeleton").innerHTML = `
                
                    <div style="
                        display:flex;
                        align-items:center;
                        justify-content:center;
                        flex-direction:column;
                        min-height:100vh;
                        text-align:center;
                        padding:30px;
                    ">

                        <i class="fas fa-exclamation-triangle"
                            style="
                                font-size:3rem;
                                color:#8800F2;
                                margin-bottom:20px;
                            ">
                        </i>

                        <h2 style="margin-bottom:10px;">
                            Error al cargar
                        </h2>

                        <p style="color:#888;">
                            ${error.message}
                        </p>

                        <button
                            onclick="location.reload()"
                            style="
                                margin-top:25px;
                                background:#8800F2;
                                border:none;
                                padding:14px 26px;
                                border-radius:16px;
                                color:white;
                                cursor:pointer;
                                font-weight:700;
                            "
                        >
                            Reintentar
                        </button>

                    </div>

                `;
            }
        }

        async function filterAction(btn) {

            document
                .querySelectorAll(".filter-btn")
                .forEach(b => b.classList.remove("active"));

            btn.classList.add("active");

            const filterValue =
                btn.getAttribute("data-filter");

            const grid =
                document.getElementById("placesGrid");

            grid.style.opacity = "0";

            setTimeout(async () => {

                let filteredData;

                if (filterValue === "todos") {

                    filteredData = allPlaces;

                } else {

                    filteredData = allPlaces.filter(p => {

                        if (!p.categoria) return false;

                        const categories = Array.isArray(p.categoria)
                            ? p.categoria.map(c => c.toLowerCase())
                            : [p.categoria.toLowerCase()];

                        return categories.includes(filterValue);

                    });

                }

                await renderWithSmoothImages(filteredData);

                grid.style.opacity = "1";

            }, 150);

            window.scrollTo({
                top: 0,
                behavior: "smooth"
            });
        }

        startApp();

    </script>

</body>

</html>
