<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0a0a0b">
  <meta name="color-scheme" content="dark">
  <meta name="robots" content="noindex, nofollow">
  <meta name="description" content="Sigue el estado de tu pedido en tiempo real.">
  <title>Seguimiento de pedido</title>

  <!-- Preconnect a los orígenes que realmente usamos: reduce el handshake TLS en redes lentas -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://firestore.googleapis.com">
  <link rel="dns-prefetch" href="https://firestore.googleapis.com">



  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;600&family=JetBrains+Mono:wght@400&display=swap"
    rel="stylesheet">

  <style>
    :root {
      --accent: #c2703d;
      --accent-dark: #8f4e28;
      --accent-soft: #2a1f18;
      --accent-glow: rgba(194, 112, 61, .35);
      --bg: #0a0a0b;
      --card: #131315;
      --card-border: #232326;
      --text-primary: #f4f3f1;
      --text-secondary: #8f8d8a;
      --text-muted: #5c5a58;
      --radius-lg: 1rem;
      --radius-xl: 1.25rem;
      --space: clamp(0.9rem, 2vw, 1.5rem);

      /* Colores de estado — cálidos y suaves, nada estridente */
      --state-pendiente: #c2703d;
      --state-en_proceso: #d9a441;
      --state-entregado: #5fae7a;
      --state-rechazado: #c25b5b;

      /* Curva de movimiento "elegante": entra rápido, se asienta suave */
      --ease-silk: cubic-bezier(.22, 1, .36, 1);
      --ease-soft: cubic-bezier(.16, .84, .44, 1);
    }

    * {
      box-sizing: border-box;
    }

    html {
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
    }

    body {
      margin: 0;
      font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text-primary);
      min-height: 100vh;
      min-height: 100svh;
      line-height: 1.45;
      /* respeta el "notch"/isla dinámica en móviles */
      padding-left: env(safe-area-inset-left);
      padding-right: env(safe-area-inset-right);
    }

    img {
      max-width: 100%;
      display: block;
    }

    button {
      font: inherit;
    }

    .font-display {
      font-family: 'Fraunces', Georgia, serif;
    }

    .font-mono {
      font-family: 'JetBrains Mono', ui-monospace, 'SFMono-Regular', Consolas, monospace;
    }

    .accent-bg {
      background-color: var(--accent);
    }

    .accent-text {
      color: var(--accent);
    }

    .bg-card {
      background-color: var(--card);
    }

    .border-card {
      border: 1px solid var(--card-border);
    }

    .text-primary {
      color: var(--text-primary);
    }

    .text-secondary {
      color: var(--text-secondary);
    }

    .text-muted {
      color: var(--text-muted);
    }

    .hidden {
      display: none !important;
    }

    .truncate {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    /* ---------- Layout ---------- */
    #app {
      max-width: 42rem;
      margin: 0 auto;
      padding: clamp(1.25rem, 4vw, 3rem) clamp(1rem, 4vw, 1.5rem);
    }

    .stack {
      display: flex;
      flex-direction: column;
      gap: var(--space);
    }

    .card {
      border-radius: var(--radius-xl);
      background-color: var(--card);
      border: 1px solid var(--card-border);
      padding: clamp(1.1rem, 3vw, 1.6rem);
      /* Se pinta bajo demanda: menos trabajo de layout/paint inicial en pantallas pequeñas */
      content-visibility: auto;
      contain-intrinsic-size: auto 200px;
      transition: border-color .5s var(--ease-soft), box-shadow .5s var(--ease-soft);
    }

    header.top {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .logo {
      width: 4rem;
      height: 4rem;
      border-radius: 1.1rem;
      object-fit: cover;
      border: 1px solid var(--card-border);
      background-color: var(--card);
      flex-shrink: 0;
      transition: border-color .4s var(--ease-soft);
    }

    h1 {
      margin: 0;
      font-size: clamp(1.1rem, 3.5vw, 1.3rem);
      font-weight: 600;
      line-height: 1.2;
    }

    .eyebrow {
      font-size: 0.7rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--text-secondary);
      font-weight: 600;
    }

    .row-between {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      flex-wrap: wrap;
    }

    /* ---------- Estado / pulso ---------- */
    .status-row {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin: 1.1rem 0 1.4rem;
    }

    .status-dot {
      position: relative;
      width: 0.75rem;
      height: 0.75rem;
      border-radius: 50%;
      background-color: var(--accent);
      flex-shrink: 0;
      transition: background-color .55s var(--ease-soft), box-shadow .55s var(--ease-soft);
      box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 12%, transparent);
    }

    /* Estados por atributo (si el JS lo setea vía data-status en #status-dot),
       y también por clase (por si se manejan como .is-pendiente, etc.) —
       ambos caminos quedan cubiertos sin romper nada si no se usan. */
    .status-dot[data-status="pendiente"],
    .status-dot.is-pendiente {
      background-color: var(--state-pendiente);
      box-shadow: 0 0 0 4px color-mix(in srgb, var(--state-pendiente) 14%, transparent);
    }

    .status-dot[data-status="en_proceso"],
    .status-dot.is-en_proceso {
      background-color: var(--state-en_proceso);
      box-shadow: 0 0 0 4px color-mix(in srgb, var(--state-en_proceso) 14%, transparent);
    }

    .status-dot[data-status="entregado"],
    .status-dot.is-entregado {
      background-color: var(--state-entregado);
      box-shadow: 0 0 0 4px color-mix(in srgb, var(--state-entregado) 14%, transparent);
    }

    .status-dot[data-status="rechazado"],
    .status-dot.is-rechazado {
      background-color: var(--state-rechazado);
      box-shadow: 0 0 0 4px color-mix(in srgb, var(--state-rechazado) 14%, transparent);
    }

    .status-dot.pulse::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: 50%;
      box-shadow: 0 0 0 0 color-mix(in srgb, var(--accent) 45%, transparent);
      animation: pulse-ring 2.2s var(--ease-soft) infinite;
    }

    @keyframes pulse-ring {
      0% {
        box-shadow: 0 0 0 0 color-mix(in srgb, var(--accent) 40%, transparent);
      }

      70% {
        box-shadow: 0 0 0 12px transparent;
      }

      100% {
        box-shadow: 0 0 0 0 transparent;
      }
    }

    /* Pequeño "respiro" del punto mientras está activo — sutil, no ansioso */
    .status-dot.pulse {
      animation: dot-breathe 2.6s var(--ease-soft) infinite;
    }

    @keyframes dot-breathe {

      0%,
      100% {
        transform: scale(1);
      }

      50% {
        transform: scale(1.12);
      }
    }

    .status-label {
      font-size: clamp(1rem, 3vw, 1.15rem);
      font-weight: 600;
      display: inline-block;
      transition: color .5s var(--ease-soft);
    }

    /* Truco sin JS extra: cada vez que cambie el texto dentro de #status-label,
       si el propio script le vuelve a asignar la misma clase "status-label",
       el navegador puede reiniciar esta animación (se agrega también una variante
       manual .refresh que el JS puede togglear si se desea un respiro extra). */
    .status-label,
    .status-label.refresh {
      animation: label-in .5s var(--ease-silk) both;
    }

    @keyframes label-in {
      from {
        opacity: 0;
        transform: translateY(4px);
        filter: blur(2px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
        filter: blur(0);
      }
    }

    /* ---------- Timeline ---------- */
    .tl-item {
      display: flex;
      gap: 0.75rem;
    }

    .tl-marker {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .tl-dot {
      width: 0.65rem;
      height: 0.65rem;
      border-radius: 50%;
      margin-top: 0.35rem;
      background-color: var(--card-border);
      flex-shrink: 0;
      transition: background-color .5s var(--ease-soft), box-shadow .5s var(--ease-soft), transform .45s var(--ease-silk);
    }

    .tl-dot.active {
      background-color: var(--accent);
      box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 18%, transparent);
      animation: tl-dot-pop .5s var(--ease-silk) both;
    }

    @keyframes tl-dot-pop {
      0% {
        transform: scale(.4);
        box-shadow: 0 0 0 0 color-mix(in srgb, var(--accent) 50%, transparent);
      }

      60% {
        transform: scale(1.35);
      }

      100% {
        transform: scale(1);
        box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 18%, transparent);
      }
    }

    .tl-line {
      width: 1px;
      flex: 1;
      margin: 0.25rem 0;
      background-color: var(--card-border);
      min-height: 1.25rem;
      position: relative;
      overflow: hidden;
    }

    /* La línea "se llena" de arriba hacia abajo en vez de cambiar de color de golpe */
    .tl-line::after {
      content: "";
      position: absolute;
      inset: 0;
      background-color: var(--accent);
      transform: scaleY(0);
      transform-origin: top;
      transition: transform .6s var(--ease-silk);
    }

    .tl-line.active::after {
      transform: scaleY(1);
    }

    .tl-text {
      padding-bottom: 1.1rem;
      margin-top: -0.1rem;
      font-size: 0.9rem;
      color: var(--text-muted);
      transition: color .5s var(--ease-soft), transform .5s var(--ease-silk);
    }

    .tl-text.active {
      color: var(--text-primary);
      font-weight: 600;
    }

    /* ---------- Grid cliente ---------- */
    .grid2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.9rem 1rem;
      font-size: 0.9rem;
    }

    .grid2 .full {
      grid-column: 1 / -1;
    }

    .field-label {
      font-size: 0.72rem;
      color: var(--text-muted);
      margin: 0 0 0.15rem;
    }

    .field-value {
      font-weight: 600;
      margin: 0;
      word-break: break-word;
      transition: color .4s var(--ease-soft);
    }

    .divider-top {
      border-top: 1px solid var(--card-border);
      margin-top: 1rem;
      padding-top: 1rem;
    }

    /* ---------- Productos ---------- */
    .producto {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0.75rem 0;
      border-bottom: 1px solid var(--card-border);
    }

    .producto:last-child {
      border-bottom: none;
    }

    .producto img {
      width: 3rem;
      height: 3rem;
      border-radius: 0.6rem;
      object-fit: cover;
      background: #000;
      flex-shrink: 0;
    }

    .producto .info {
      flex: 1;
      min-width: 0;
    }

    .producto .nombre {
      font-size: 0.9rem;
      font-weight: 600;
      margin: 0;
    }

    .producto .detalle {
      font-size: 0.78rem;
      color: var(--text-muted);
      margin: 0.15rem 0 0;
    }

    .producto .subtotal {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.85rem;
      color: var(--text-secondary);
      white-space: nowrap;
    }

    .total {
      font-family: 'Fraunces', serif;
      font-size: clamp(1.1rem, 3.5vw, 1.35rem);
      font-weight: 600;
      color: var(--accent);
      transition: color .4s var(--ease-soft);
    }

    /* ---------- Skeleton ---------- */
    .skel {
      border-radius: var(--radius-xl);
      background: linear-gradient(90deg, #151517 25%, #1c1c1f 37%, #151517 63%);
      background-size: 800px 100%;
      animation: shimmer 1.4s linear infinite;
    }

    @keyframes shimmer {
      0% {
        background-position: -400px 0;
      }

      100% {
        background-position: 400px 0;
      }
    }

    /* Transición suave entre skeleton → contenido real */
    #skeleton {
      transition: opacity .35s var(--ease-soft);
    }

    #content {
      animation: content-in .55s var(--ease-silk) both;
    }

    @keyframes content-in {
      from {
        opacity: 0;
        transform: translateY(10px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* ---------- Estado vacío ---------- */
    .empty {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 5rem 1rem;
    }

    .empty-icon {
      width: 3.2rem;
      height: 3.2rem;
      border-radius: 50%;
      background-color: var(--card);
      border: 1px solid var(--card-border);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 1.1rem;
    }

    /* ---------- Banner de conexión ---------- */
    .conn-banner {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.8rem;
      color: var(--text-secondary);
      background-color: var(--card);
      border: 1px solid var(--card-border);
      border-radius: 0.7rem;
      padding: 0.55rem 0.85rem;
      transition: opacity .4s var(--ease-soft), transform .4s var(--ease-soft);
    }

    .conn-dot {
      width: 0.5rem;
      height: 0.5rem;
      border-radius: 50%;
      background-color: #e5484d;
      flex-shrink: 0;
      animation: dot-breathe 1.8s var(--ease-soft) infinite;
    }

    .foot-note {
      text-align: center;
      font-size: 0.75rem;
      color: var(--text-muted);
      padding-top: 0.4rem;
    }

    .fade-in {
      animation: fadeIn .55s var(--ease-silk) both;
    }

    /* Cascada muy sutil entre tarjetas para que la carga se sienta orquestada, no golpeada */
    header.top.fade-in {
      animation-delay: .02s;
    }

    section.card.fade-in:nth-of-type(1) {
      animation-delay: .07s;
    }

    section.card.fade-in:nth-of-type(2) {
      animation-delay: .13s;
    }

    section.card.fade-in:nth-of-type(3) {
      animation-delay: .19s;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(8px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Pantallas muy pequeñas (gama baja / pantallas de 320px) */
    @media (max-width:360px) {
      .grid2 {
        grid-template-columns: 1fr;
      }

      .logo {
        width: 3.2rem;
        height: 3.2rem;
      }
    }

    /* Respeta la preferencia del sistema de reducir movimiento: menos CPU/GPU, más batería */
    @media (prefers-reduced-motion: reduce) {

      .status-dot.pulse::after,
      .status-dot.pulse,
      .skel,
      .fade-in,
      #content,
      .status-label,
      .tl-dot.active,
      .conn-dot {
        animation: none !important;
      }

      .tl-line::after {
        transition: none !important;
      }
    }

    /* Foco visible por teclado, accesibilidad básica */
    a:focus-visible,
    button:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }
  </style>

  <script type="module" src="/js/dasboardjs/estado_pedidos.js"></script>

</head>

<body>

  <div id="app">

    <!-- SKELETON STATE -->
    <div id="skeleton" class="stack" aria-busy="true" aria-live="polite">
      <div class="row-between" style="gap:1rem;">
        <div class="skel" style="width:4rem;height:4rem;border-radius:1.1rem;"></div>
        <div class="stack" style="gap:0.5rem;flex:1;">
          <div class="skel" style="height:1rem;width:60%;border-radius:0.4rem;"></div>
          <div class="skel" style="height:0.75rem;width:35%;border-radius:0.4rem;"></div>
        </div>
      </div>
      <div class="skel" style="height:8rem;"></div>
      <div class="skel" style="height:12rem;"></div>
      <div class="skel" style="height:10rem;"></div>
    </div>

    <!-- EMPTY / NOT FOUND STATE -->
    <div id="empty-state" class="hidden fade-in empty" role="status">
      <div class="empty-icon">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="1.5" style="color:var(--text-secondary)">
          <path stroke-linecap="round" stroke-linejoin="round"
            d="M9.75 9.75l4.5 4.5m0-4.5l-4.5 4.5M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
        </svg>
      </div>
      <p class="font-display" style="font-size:1.1rem;margin:0;">No encontramos este pedido</p>
      <p class="text-muted" style="font-size:0.9rem;margin:0.35rem 0 0;">Revisa el enlace o vuelve a intentarlo más
        tarde.</p>
    </div>

    <!-- CONTENT STATE -->
    <div id="content" class="hidden stack">

      <!-- Banner de conexión (solo aparece si se pierde el enlace en tiempo real) -->
      <div id="conn-banner" class="conn-banner hidden fade-in" role="status" aria-live="polite">
        <span class="conn-dot"></span>
        <span>Sin conexión. Mostrando la última información disponible.</span>
      </div>

      <!-- Header -->
      <header class="top fade-in">
        <img id="logo-img" class="logo" src="" alt="" width="64" height="64" loading="eager">
        <div>
          <h1 id="negocio-nombre" class="font-display"></h1>
          <p class="eyebrow font-mono" id="negocio-localidad" style="margin:0.15rem 0 0;"></p>
        </div>
      </header>

      <!-- Status card -->
      <section class="card fade-in" aria-label="Estado del pedido">
        <div class="row-between">
          <span class="eyebrow">Estado del pedido</span>
          <span class="font-mono text-muted" id="pedido-fecha-hora" style="font-size:0.72rem;"></span>
        </div>

        <div class="status-row" aria-live="polite">
          <span id="status-dot" class="status-dot pulse"></span>
          <span id="status-label" class="font-display status-label"></span>
        </div>

        <div id="timeline"></div>
      </section>

      <!-- Cliente / entrega -->
      <section class="card fade-in" aria-label="Datos del cliente">
        <span class="eyebrow">Cliente</span>
        <div class="grid2" style="margin-top:0.9rem;">
          <div>
            <p class="field-label">Nombre</p>
            <p id="cliente-nombre" class="field-value text-primary"></p>
          </div>
          <div>
            <p class="field-label">Entrega</p>
            <p id="cliente-entrega" class="field-value text-primary"></p>
          </div>
          <div id="cliente-mesa-wrap" class="hidden">
            <p class="field-label">Mesa</p>
            <p id="cliente-mesa" class="field-value text-primary"></p>
          </div>
          <div id="cliente-direccion-wrap" class="hidden full">
            <p class="field-label">Dirección</p>
            <p id="cliente-direccion" class="field-value text-primary"></p>
          </div>
        </div>
        <div id="nota-wrap" class="hidden divider-top">
          <p class="field-label">Nota</p>
          <p id="nota-texto" class="text-secondary" style="font-style:italic;font-size:0.9rem;margin:0;"></p>
        </div>
      </section>

      <!-- Productos -->
      <section class="card fade-in" aria-label="Productos del pedido">
        <span class="eyebrow">Productos</span>
        <div id="productos-list" style="margin-top:0.9rem;"></div>

        <div class="row-between divider-top">
          <span class="text-secondary" style="font-size:0.9rem;">Método de pago: <span id="pago-metodo"
              class="field-value text-primary" style="display:inline;"></span></span>
          <span class="total font-display">S/ <span id="pedido-total"></span></span>
        </div>
      </section>

      <p class="foot-note">Actualiza automáticamente en tiempo real</p>
    </div>
  </div>

</body>

</html>
