<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0a0a0b">
  <meta name="color-scheme" content="dark">
  <meta name="robots" content="noindex, nofollow">
  <meta name="description" content="Sigue el estado de tu pedido en tiempo real.">
  <title>Seguimiento de pedido</title>

  <!-- Preconnect a los orígenes que realmente usamos: reduce el handshake TLS en redes lentas -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://firestore.googleapis.com">
  <link rel="dns-prefetch" href="https://firestore.googleapis.com">

  <!--
  Solo 2 pesos por familia (los que realmente usa el CSS de abajo).
  Menos pesos = menos bytes = primer pintado más rápido en redes 3G/4G y equipos gama baja.
-->
  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;600&family=JetBrains+Mono:wght@400&display=swap"
    rel="stylesheet">

  <style>
    :root {
      --accent: #c2703d;
      --accent-dark: #8f4e28;
      --accent-soft: #2a1f18;
      --bg: #0a0a0b;
      --card: #131315;
      --card-border: #232326;
      --text-primary: #f4f3f1;
      --text-secondary: #8f8d8a;
      --text-muted: #5c5a58;
      --radius-lg: 1rem;
      --radius-xl: 1.25rem;
      --space: clamp(0.9rem, 2vw, 1.5rem);
    }

    * {
      box-sizing: border-box;
    }

    html {
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
    }

    body {
      margin: 0;
      font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text-primary);
      min-height: 100vh;
      min-height: 100svh;
      line-height: 1.45;
      /* respeta el "notch"/isla dinámica en móviles */
      padding-left: env(safe-area-inset-left);
      padding-right: env(safe-area-inset-right);
    }

    img {
      max-width: 100%;
      display: block;
    }

    button {
      font: inherit;
    }

    .font-display {
      font-family: 'Fraunces', Georgia, serif;
    }

    .font-mono {
      font-family: 'JetBrains Mono', ui-monospace, 'SFMono-Regular', Consolas, monospace;
    }

    .accent-bg {
      background-color: var(--accent);
    }

    .accent-text {
      color: var(--accent);
    }

    .bg-card {
      background-color: var(--card);
    }

    .border-card {
      border: 1px solid var(--card-border);
    }

    .text-primary {
      color: var(--text-primary);
    }

    .text-secondary {
      color: var(--text-secondary);
    }

    .text-muted {
      color: var(--text-muted);
    }

    .hidden {
      display: none !important;
    }

    .truncate {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    /* ---------- Layout ---------- */
    #app {
      max-width: 42rem;
      margin: 0 auto;
      padding: clamp(1.25rem, 4vw, 3rem) clamp(1rem, 4vw, 1.5rem);
    }

    .stack {
      display: flex;
      flex-direction: column;
      gap: var(--space);
    }

    .card {
      border-radius: var(--radius-xl);
      background-color: var(--card);
      border: 1px solid var(--card-border);
      padding: clamp(1.1rem, 3vw, 1.6rem);
      /* Se pinta bajo demanda: menos trabajo de layout/paint inicial en pantallas pequeñas */
      content-visibility: auto;
      contain-intrinsic-size: auto 200px;
    }

    header.top {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .logo {
      width: 4rem;
      height: 4rem;
      border-radius: 1.1rem;
      object-fit: cover;
      border: 1px solid var(--card-border);
      background-color: var(--card);
      flex-shrink: 0;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.1rem, 3.5vw, 1.3rem);
      font-weight: 600;
      line-height: 1.2;
    }

    .eyebrow {
      font-size: 0.7rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--text-secondary);
      font-weight: 600;
    }

    .row-between {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      flex-wrap: wrap;
    }

    /* ---------- Estado / pulso ---------- */
    .status-row {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin: 1.1rem 0 1.4rem;
    }

    .status-dot {
      position: relative;
      width: 0.75rem;
      height: 0.75rem;
      border-radius: 50%;
      background-color: var(--accent);
      flex-shrink: 0;
    }

    .status-dot.pulse::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: 50%;
      box-shadow: 0 0 0 0 color-mix(in srgb, var(--accent) 45%, transparent);
      animation: pulse-ring 1.8s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    }

    @keyframes pulse-ring {
      0% {
        box-shadow: 0 0 0 0 color-mix(in srgb, var(--accent) 45%, transparent);
      }

      70% {
        box-shadow: 0 0 0 10px transparent;
      }

      100% {
        box-shadow: 0 0 0 0 transparent;
      }
    }

    .status-label {
      font-size: clamp(1rem, 3vw, 1.15rem);
      font-weight: 600;
    }

    /* ---------- Timeline ---------- */
    .tl-item {
      display: flex;
      gap: 0.75rem;
    }

    .tl-marker {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .tl-dot {
      width: 0.65rem;
      height: 0.65rem;
      border-radius: 50%;
      margin-top: 0.35rem;
      background-color: var(--card-border);
      flex-shrink: 0;
    }

    .tl-dot.active {
      background-color: var(--accent);
    }

    .tl-line {
      width: 1px;
      flex: 1;
      margin: 0.25rem 0;
      background-color: var(--card-border);
      min-height: 1.25rem;
    }

    .tl-line.active {
      background-color: var(--accent);
    }

    .tl-text {
      padding-bottom: 1.1rem;
      margin-top: -0.1rem;
      font-size: 0.9rem;
      color: var(--text-muted);
    }

    .tl-text.active {
      color: var(--text-primary);
      font-weight: 600;
    }

    /* ---------- Grid cliente ---------- */
    .grid2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.9rem 1rem;
      font-size: 0.9rem;
    }

    .grid2 .full {
      grid-column: 1 / -1;
    }

    .field-label {
      font-size: 0.72rem;
      color: var(--text-muted);
      margin: 0 0 0.15rem;
    }

    .field-value {
      font-weight: 600;
      margin: 0;
      word-break: break-word;
    }

    .divider-top {
      border-top: 1px solid var(--card-border);
      margin-top: 1rem;
      padding-top: 1rem;
    }

    /* ---------- Productos ---------- */
    .producto {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0.75rem 0;
      border-bottom: 1px solid var(--card-border);
    }

    .producto:last-child {
      border-bottom: none;
    }

    .producto img {
      width: 3rem;
      height: 3rem;
      border-radius: 0.6rem;
      object-fit: cover;
      background: #000;
      flex-shrink: 0;
    }

    .producto .info {
      flex: 1;
      min-width: 0;
    }

    .producto .nombre {
      font-size: 0.9rem;
      font-weight: 600;
      margin: 0;
    }

    .producto .detalle {
      font-size: 0.78rem;
      color: var(--text-muted);
      margin: 0.15rem 0 0;
    }

    .producto .subtotal {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.85rem;
      color: var(--text-secondary);
      white-space: nowrap;
    }

    .total {
      font-family: 'Fraunces', serif;
      font-size: clamp(1.1rem, 3.5vw, 1.35rem);
      font-weight: 600;
      color: var(--accent);
    }

    /* ---------- Skeleton ---------- */
    .skel {
      border-radius: var(--radius-xl);
      background: linear-gradient(90deg, #151517 25%, #1c1c1f 37%, #151517 63%);
      background-size: 800px 100%;
      animation: shimmer 1.4s linear infinite;
    }

    @keyframes shimmer {
      0% {
        background-position: -400px 0;
      }

      100% {
        background-position: 400px 0;
      }
    }

    /* ---------- Estado vacío ---------- */
    .empty {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 5rem 1rem;
    }

    .empty-icon {
      width: 3.2rem;
      height: 3.2rem;
      border-radius: 50%;
      background-color: var(--card);
      border: 1px solid var(--card-border);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 1.1rem;
    }

    /* ---------- Banner de conexión ---------- */
    .conn-banner {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.8rem;
      color: var(--text-secondary);
      background-color: var(--card);
      border: 1px solid var(--card-border);
      border-radius: 0.7rem;
      padding: 0.55rem 0.85rem;
    }

    .conn-dot {
      width: 0.5rem;
      height: 0.5rem;
      border-radius: 50%;
      background-color: #e5484d;
      flex-shrink: 0;
    }

    .foot-note {
      text-align: center;
      font-size: 0.75rem;
      color: var(--text-muted);
      padding-top: 0.4rem;
    }

    .fade-in {
      animation: fadeIn .45s ease both;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(6px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Pantallas muy pequeñas (gama baja / pantallas de 320px) */
    @media (max-width:360px) {
      .grid2 {
        grid-template-columns: 1fr;
      }

      .logo {
        width: 3.2rem;
        height: 3.2rem;
      }
    }

    /* Respeta la preferencia del sistema de reducir movimiento: menos CPU/GPU, más batería */
    @media (prefers-reduced-motion: reduce) {

      .status-dot.pulse::after,
      .skel,
      .fade-in {
        animation: none !important;
      }
    }

    /* Foco visible por teclado, accesibilidad básica */
    a:focus-visible,
    button:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }
  </style>
</head>

<body>

  <div id="app">

    <!-- SKELETON STATE -->
    <div id="skeleton" class="stack" aria-busy="true" aria-live="polite">
      <div class="row-between" style="gap:1rem;">
        <div class="skel" style="width:4rem;height:4rem;border-radius:1.1rem;"></div>
        <div class="stack" style="gap:0.5rem;flex:1;">
          <div class="skel" style="height:1rem;width:60%;border-radius:0.4rem;"></div>
          <div class="skel" style="height:0.75rem;width:35%;border-radius:0.4rem;"></div>
        </div>
      </div>
      <div class="skel" style="height:8rem;"></div>
      <div class="skel" style="height:12rem;"></div>
      <div class="skel" style="height:10rem;"></div>
    </div>

    <!-- EMPTY / NOT FOUND STATE -->
    <div id="empty-state" class="hidden fade-in empty" role="status">
      <div class="empty-icon">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="1.5" style="color:var(--text-secondary)">
          <path stroke-linecap="round" stroke-linejoin="round"
            d="M9.75 9.75l4.5 4.5m0-4.5l-4.5 4.5M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
        </svg>
      </div>
      <p class="font-display" style="font-size:1.1rem;margin:0;">No encontramos este pedido</p>
      <p class="text-muted" style="font-size:0.9rem;margin:0.35rem 0 0;">Revisa el enlace o vuelve a intentarlo más
        tarde.</p>
    </div>

    <!-- CONTENT STATE -->
    <div id="content" class="hidden stack">

      <!-- Banner de conexión (solo aparece si se pierde el enlace en tiempo real) -->
      <div id="conn-banner" class="conn-banner hidden fade-in" role="status" aria-live="polite">
        <span class="conn-dot"></span>
        <span>Sin conexión. Mostrando la última información disponible.</span>
      </div>

      <!-- Header -->
      <header class="top fade-in">
        <img id="logo-img" class="logo" src="" alt="" width="64" height="64" loading="eager">
        <div>
          <h1 id="negocio-nombre" class="font-display"></h1>
          <p class="eyebrow font-mono" id="negocio-localidad" style="margin:0.15rem 0 0;"></p>
        </div>
      </header>

      <!-- Status card -->
      <section class="card fade-in" aria-label="Estado del pedido">
        <div class="row-between">
          <span class="eyebrow">Estado del pedido</span>
          <span class="font-mono text-muted" id="pedido-fecha-hora" style="font-size:0.72rem;"></span>
        </div>

        <div class="status-row" aria-live="polite">
          <span id="status-dot" class="status-dot pulse"></span>
          <span id="status-label" class="font-display status-label"></span>
        </div>

        <div id="timeline"></div>
      </section>

      <!-- Cliente / entrega -->
      <section class="card fade-in" aria-label="Datos del cliente">
        <span class="eyebrow">Cliente</span>
        <div class="grid2" style="margin-top:0.9rem;">
          <div>
            <p class="field-label">Nombre</p>
            <p id="cliente-nombre" class="field-value text-primary"></p>
          </div>
          <div>
            <p class="field-label">Entrega</p>
            <p id="cliente-entrega" class="field-value text-primary"></p>
          </div>
          <div id="cliente-mesa-wrap" class="hidden">
            <p class="field-label">Mesa</p>
            <p id="cliente-mesa" class="field-value text-primary"></p>
          </div>
          <div id="cliente-direccion-wrap" class="hidden full">
            <p class="field-label">Dirección</p>
            <p id="cliente-direccion" class="field-value text-primary"></p>
          </div>
        </div>
        <div id="nota-wrap" class="hidden divider-top">
          <p class="field-label">Nota</p>
          <p id="nota-texto" class="text-secondary" style="font-style:italic;font-size:0.9rem;margin:0;"></p>
        </div>
      </section>

      <!-- Productos -->
      <section class="card fade-in" aria-label="Productos del pedido">
        <span class="eyebrow">Productos</span>
        <div id="productos-list" style="margin-top:0.9rem;"></div>

        <div class="row-between divider-top">
          <span class="text-secondary" style="font-size:0.9rem;">Método de pago: <span id="pago-metodo"
              class="field-value text-primary" style="display:inline;"></span></span>
          <span class="total font-display">S/ <span id="pedido-total"></span></span>
        </div>
      </section>

      <p class="foot-note">Actualiza automáticamente en tiempo real</p>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import {
      getFirestore, doc, onSnapshot, enableIndexedDbPersistence
    } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBFV4SF7hMFifKz45GaBiu2xwTq7T_gxBQ",
      authDomain: "geinzworkapp.firebaseapp.com",
      projectId: "geinzworkapp",
      storageBucket: "geinzworkapp.firebasestorage.app",
      messagingSenderId: "921389328767",
      appId: "1:921389328767:web:dc6fffc43a51444f5b524a",
    };
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // Cache local: si el pedido se vuelve a abrir (o hay un corte de red breve),
    // se sirve desde disco al instante en vez de esperar a la red.
    // Reduce lecturas repetidas a Firestore -> importante para escalar a miles de pedidos/negocios.
    try {
      enableIndexedDbPersistence(db).catch((err) => {
        console.warn("[pedidos] Persistencia local no disponible:", err.code);
      });
    } catch (e) {
      console.warn("[pedidos] No se pudo activar la persistencia local:", e);
    }

    // ---- Config: ajustar si la localidad varía por negocio ----
    const LOCALIDAD_FIJA = "barranca";

    // ---- Parseo de ruta: /pedidos/{negocioId}/{pedidoId} (o /dashboard/... como alias) ----
    function parseRuta() {
      const params = new URLSearchParams(window.location.search);
      if (params.get("negocioId") && params.get("pedidoId")) {
        return { negocioId: params.get("negocioId"), pedidoId: params.get("pedidoId") };
      }
      const partes = window.location.pathname.split("/").filter(Boolean);
      const idx = partes.findIndex((p) => p === "pedidos" || p === "dashboard");
      if (idx === -1 || partes.length < idx + 3) {
        console.warn("[pedidos] No se pudo extraer negocioId/pedidoId de la ruta");
        return null;
      }
      return { negocioId: partes[idx + 1], pedidoId: partes[idx + 2] };
    }

    const ids = parseRuta();

    const el = (id) => document.getElementById(id);
    const showSkeleton = () => { el("skeleton").classList.remove("hidden"); el("empty-state").classList.add("hidden"); el("content").classList.add("hidden"); };
    const showEmpty = () => { el("skeleton").classList.add("hidden"); el("empty-state").classList.remove("hidden"); el("content").classList.add("hidden"); };
    const showContent = () => { el("skeleton").classList.add("hidden"); el("empty-state").classList.add("hidden"); el("content").classList.remove("hidden"); };

    // Ejecuta una función en un momento ocioso del navegador (o con un pequeño retraso
    // como respaldo). Evita que trabajo no crítico -como leer los píxeles del logo-
    // bloquee el primer pintado en equipos de gama baja.
    const enIdle = (fn) => {
      if ("requestIdleCallback" in window) window.requestIdleCallback(fn, { timeout: 1500 });
      else setTimeout(fn, 200);
    };

    let unsubNegocio = null;
    let unsubPedido = null;

    if (!ids) {
      showEmpty();
    } else {
      init(ids.negocioId, ids.pedidoId);
    }

    // Limpia los listeners activos de Firestore si la pestaña se cierra o el
    // usuario navega fuera. Evita fugas de memoria/lecturas fantasma a escala.
    window.addEventListener("beforeunload", () => {
      if (unsubNegocio) unsubNegocio();
      if (unsubPedido) unsubPedido();
    });

    function init(negocioId, pedidoId) {
      showSkeleton();

      // --- Datos del negocio (logo, nombre) ---
      try {
        const negocioRef = doc(db, "Tiendas", LOCALIDAD_FIJA, LOCALIDAD_FIJA, negocioId);
        unsubNegocio = onSnapshot(negocioRef, (snap) => {
          if (!snap.exists()) {
            console.warn("[pedidos] El documento del NEGOCIO no existe");
            return;
          }
          const data = snap.data();
          const nombre = data.nombre || "Negocio";
          const logoUrl = data.img_tienda?.logo_tienda || "";
          el("negocio-nombre").textContent = nombre;
          el("negocio-localidad").textContent = LOCALIDAD_FIJA;
          el("negocio-nombre").closest("header") && (document.title = `Pedido · ${nombre}`);
          if (logoUrl) {
            el("logo-img").alt = nombre;
            el("logo-img").src = logoUrl;
            enIdle(() => extraerColorDominante(logoUrl));
          }
        }, (error) => {
          console.error("[pedidos] Error de Firestore leyendo NEGOCIO:", error.code, error.message);
          mostrarBannerConexion(true);
        });
      } catch (e) {
        console.error("[pedidos] Error cargando negocio:", e);
      }

      // --- Pedido en tiempo real ---
      const pedidoRef = doc(db, "Tiendas", LOCALIDAD_FIJA, LOCALIDAD_FIJA, negocioId, "pedidos", pedidoId);

      unsubPedido = onSnapshot(
        pedidoRef,
        { includeMetadataChanges: true },
        (snap) => {
          if (!snap.exists()) {
            console.warn("[pedidos] El documento del PEDIDO no existe");
            showEmpty();
            return;
          }
          renderPedido(snap.data());
          showContent();
          // fromCache=true mientras no hay red: el dato mostrado es el último conocido.
          mostrarBannerConexion(snap.metadata.fromCache);
        },
        (error) => {
          console.error("[pedidos] Error de Firestore leyendo PEDIDO:", error.code, error.message);
          showEmpty();
        }
      );
    }

    function mostrarBannerConexion(sinConexion) {
      el("conn-banner").classList.toggle("hidden", !sinConexion);
    }

    // ---- Estados del pedido ----
    const ESTADOS = ["pendiente", "en_proceso", "entregado"];
    const ESTADOS_LABEL = {
      pendiente: "Pendiente",
      en_proceso: "En proceso",
      entregado: "Entregado",
      rechazado: "Rechazado",
    };

    function normalizarEstado(estado) {
      const e = (estado || "").toLowerCase().trim();
      if (e === "rechazado" || e.includes("rechaz")) return "rechazado";
      if (e === "entregado" || e.includes("entreg")) return "entregado";
      if (e === "en_proceso" || e.includes("proceso")) return "en_proceso";
      return "pendiente";
    }

    function renderPedido(data) {
      const estadoActual = normalizarEstado(data.estado);
      const esRechazado = estadoActual === "rechazado";

      el("status-label").textContent = ESTADOS_LABEL[estadoActual] || data.estado || "—";
      el("pedido-fecha-hora").textContent = [data.fecha, data.hora].filter(Boolean).join(" · ");

      const dot = el("status-dot");
      dot.classList.remove("pulse");
      dot.style.backgroundColor = "";
      if (esRechazado) {
        dot.style.backgroundColor = "#e5484d";
      } else if (estadoActual !== "entregado") {
        dot.classList.add("pulse");
      }

      renderTimeline(estadoActual, esRechazado);

      // Cliente
      const cliente = data.cliente || {};
      el("cliente-nombre").textContent = cliente.nombre || "—";
      el("cliente-entrega").textContent = cliente.tipo_entrega || "—";

      el("cliente-mesa-wrap").classList.toggle("hidden", !cliente.mesa);
      if (cliente.mesa) el("cliente-mesa").textContent = cliente.mesa;

      el("cliente-direccion-wrap").classList.toggle("hidden", !cliente.direccion);
      if (cliente.direccion) el("cliente-direccion").textContent = cliente.direccion;

      el("nota-wrap").classList.toggle("hidden", !data.nota);
      if (data.nota) el("nota-texto").textContent = data.nota;

      // Pago
      el("pago-metodo").textContent = data.pago?.metodo || "—";
      el("pedido-total").textContent = Number(data.total || 0).toFixed(2);

      // Productos (se reconstruye con nodos DOM en vez de innerHTML con datos
      // dinámicos: evita problemas de escape/XSS si un nombre trae caracteres especiales)
      const cont = el("productos-list");
      cont.innerHTML = "";
      const frag = document.createDocumentFragment();
      (data.productos || []).forEach((p) => {
        const row = document.createElement("div");
        row.className = "producto";

        const img = document.createElement("img");
        img.src = p.imagen || "";
        img.alt = "";
        img.loading = "lazy";
        img.width = 48;
        img.height = 48;
        img.onerror = () => { img.style.visibility = "hidden"; };

        const info = document.createElement("div");
        info.className = "info";
        const nombre = document.createElement("p");
        nombre.className = "nombre truncate";
        nombre.textContent = p.nombre || "";
        const detalle = document.createElement("p");
        detalle.className = "detalle";
        detalle.textContent = `${p.cantidad || 1} × S/ ${Number(p.precio_unitario || 0).toFixed(2)}`;
        info.append(nombre, detalle);

        // Muestra las opciones elegidas (ej. "Temperatura: Helado" · "Tamaño: Grande")
        if (p.opciones && Object.keys(p.opciones).length) {
          const opcionesTxt = Object.entries(p.opciones).map(([k, v]) => `${k}: ${v}`).join(" · ");
          const opcionesEl = document.createElement("p");
          opcionesEl.className = "detalle";
          opcionesEl.style.color = "var(--accent)";
          opcionesEl.style.fontStyle = "italic";
          opcionesEl.textContent = opcionesTxt;
          info.append(opcionesEl);
        }

        const subtotal = document.createElement("span");
        subtotal.className = "subtotal font-mono";
        subtotal.textContent = `S/ ${Number(p.subtotal || 0).toFixed(2)}`;

        row.append(img, info, subtotal);
        frag.appendChild(row);
      });
      cont.appendChild(frag);
    }

    function renderTimeline(estadoActual, esRechazado) {
      const cont = el("timeline");
      cont.innerHTML = "";

      if (esRechazado) {
        const div = document.createElement("div");
        div.style.color = "#e5484d";
        div.style.fontWeight = "600";
        div.style.fontSize = "0.9rem";
        div.textContent = "Este pedido fue rechazado.";
        cont.appendChild(div);
        return;
      }

      const idxActual = ESTADOS.indexOf(estadoActual);
      const frag = document.createDocumentFragment();

      ESTADOS.forEach((estado, i) => {
        const activo = i <= idxActual;
        const esActual = i === idxActual;
        const isLast = i === ESTADOS.length - 1;

        const item = document.createElement("div");
        item.className = "tl-item";

        const marker = document.createElement("div");
        marker.className = "tl-marker";
        const tlDot = document.createElement("div");
        tlDot.className = "tl-dot" + (activo ? " active" : "");
        marker.appendChild(tlDot);
        if (!isLast) {
          const line = document.createElement("div");
          line.className = "tl-line" + (activo && i < idxActual ? " active" : "");
          marker.appendChild(line);
        }

        const text = document.createElement("div");
        text.className = "tl-text" + (activo ? " active" : "");
        text.textContent = ESTADOS_LABEL[estado];

        item.append(marker, text);
        frag.appendChild(item);
      });
      cont.appendChild(frag);
    }

    // ---- Color dominante del logo → variables CSS de acento ----
    function extraerColorDominante(url) {
      const img = new Image();
      img.crossOrigin = "anonymous";
      img.onload = () => {
        try {
          const canvas = document.createElement("canvas");
          const size = 32; // suficiente para estimar el color y más barato de procesar
          canvas.width = size;
          canvas.height = size;
          const ctx = canvas.getContext("2d", { willReadFrequently: true });
          ctx.drawImage(img, 0, 0, size, size);
          const data = ctx.getImageData(0, 0, size, size).data;

          const buckets = {};
          for (let i = 0; i < data.length; i += 4) {
            const alpha = data[i + 3];
            if (alpha < 100) continue;
            const r = data[i], g = data[i + 1], b = data[i + 2];

            const max = Math.max(r, g, b), min = Math.min(r, g, b);
            const lightness = (max + min) / 2;
            const sat = max === min ? 0 : (max - min) / (255 - Math.abs(2 * lightness - 255));

            if (lightness > 235 || lightness < 18 || sat < 0.15) continue;

            const key = `${Math.round(r / 24)}-${Math.round(g / 24)}-${Math.round(b / 24)}`;
            if (!buckets[key]) buckets[key] = { r: 0, g: 0, b: 0, count: 0, sat: 0 };
            buckets[key].r += r;
            buckets[key].g += g;
            buckets[key].b += b;
            buckets[key].count += 1;
            buckets[key].sat += sat;
          }

          const bucketList = Object.values(buckets);
          let chosen = null;
          if (bucketList.length > 0) {
            chosen = bucketList
              .map((bk) => ({ ...bk, score: bk.count * (bk.sat / bk.count) }))
              .sort((a, b) => b.score - a.score)[0];
          }

          let r, g, b;
          if (chosen) {
            r = Math.round(chosen.r / chosen.count);
            g = Math.round(chosen.g / chosen.count);
            b = Math.round(chosen.b / chosen.count);
          } else {
            r = 194; g = 112; b = 61; // naranja tostado por defecto
          }

          const brightness = (r + g + b) / 3;
          if (brightness < 90) {
            const boost = 90 / Math.max(brightness, 1);
            r = Math.min(255, Math.round(r * boost));
            g = Math.min(255, Math.round(g * boost));
            b = Math.min(255, Math.round(b * boost));
          }

          const toHex = (n) => Math.max(0, Math.min(255, n)).toString(16).padStart(2, "0");
          const hex = `#${toHex(r)}${toHex(g)}${toHex(b)}`;
          const dark = `#${toHex(Math.round(r * 0.65))}${toHex(Math.round(g * 0.65))}${toHex(Math.round(b * 0.65))}`;
          const soft = `#${toHex(Math.round(r * 0.18))}${toHex(Math.round(g * 0.18))}${toHex(Math.round(b * 0.18))}`;

          document.documentElement.style.setProperty("--accent", hex);
          document.documentElement.style.setProperty("--accent-dark", dark);
          document.documentElement.style.setProperty("--accent-soft", soft);
        } catch (e) {
          console.warn("[pedidos] No se pudo extraer color del logo (posible CORS):", e);
        }
      };
      img.onerror = () => console.warn("[pedidos] No se pudo cargar el logo para extraer color");
      img.src = url;
    }
  </script>
