<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dominios de clientes · Geinz Tech</title>
<style>
  :root {
    --bg: #f5f6f4; --panel: #ffffff; --ink: #1c2420; --muted: #66726b;
    --line: #dfe3df; --accent: #0f6b4f; --accent-ink: #ffffff;
    --warn: #a4400f; --warn-bg: #fbeee6; --ok-bg: #e4f2ec; --danger: #a31f2b;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#121513; --panel:#1b201d; --ink:#e8ede9; --muted:#97a39b; --line:#2c342f;
            --accent:#3fb88c; --accent-ink:#06120d; --warn:#f0a778; --warn-bg:#33231a; --ok-bg:#16302a; --danger:#ff7a86; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink);
         font: 15px/1.5 "Segoe UI", system-ui, -apple-system, sans-serif; }
  main { max-width: 760px; margin: 0 auto; padding: 32px 20px 64px; }
  h1 { font-size: 24px; margin: 0 0 4px; letter-spacing: -0.01em; }
  .sub { color: var(--muted); margin: 0 0 24px; }
  section { background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
            padding: 18px 20px; margin-bottom: 16px; }
  h2 { font-size: 16px; margin: 0 0 12px; }
  label { display:block; font-size: 13px; color: var(--muted); margin: 10px 0 4px; }
  input[type=text], input[type=password] {
    width:100%; padding: 9px 11px; border:1px solid var(--line); border-radius:7px;
    background: var(--bg); color: var(--ink); font: inherit; }
  input:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .check { display:flex; gap:8px; align-items:center; color: var(--ink); font-size:14px; margin: 10px 0 0; }
  .check input { width:auto; }
  .row { display:flex; gap:10px; flex-wrap:wrap; align-items:flex-end; }
  .row > div { flex:1 1 220px; }
  button { font: inherit; padding: 9px 16px; border-radius: 7px; border: 1px solid var(--line);
           background: var(--panel); color: var(--ink); cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
  button.danger { color: var(--danger); border-color: var(--danger); }
  button:disabled { opacity: .55; cursor: wait; }
  .actions { display:flex; gap:8px; flex-wrap:wrap; margin-top:14px; }
  #result { display:none; }
  .status { display:inline-block; padding:2px 10px; border-radius:99px; font-size:13px; font-weight:600;
            background: var(--warn-bg); color: var(--warn); }
  .status.active { background: var(--ok-bg); color: var(--accent); }
  .next { margin: 12px 0; padding: 10px 12px; border-left: 3px solid var(--accent); background: var(--bg); }
  .ns { display:flex; gap:8px; align-items:center; margin: 6px 0; }
  .ns code { flex:1; padding: 8px 10px; background: var(--bg); border:1px solid var(--line); border-radius:7px;
             font-family: Consolas, monospace; font-size: 14px; }
  table { width:100%; border-collapse: collapse; font-size: 14px; margin-top: 8px; }
  th, td { text-align:left; padding: 6px 8px; border-bottom: 1px solid var(--line); }
  th { color: var(--muted); font-weight: 500; }
  details { margin-top: 12px; }
  pre { overflow:auto; background: var(--bg); padding: 10px; border-radius:7px; font-size:12.5px; }
  .error { color: var(--danger); font-weight: 600; }
  .hint { color: var(--muted); font-size: 13px; margin-top: 6px; }
  .listhead { display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:6px; }
  .listhead h2 { margin:0; }
  .listhead .tools { display:flex; gap:12px; align-items:center; }
  .listhead .check { margin:0; }
  #list td button { padding:4px 10px; font-size:13px; }
  #list tr.pick { cursor:pointer; }
  #list tr.pick:hover td { background: var(--bg); }
  .empty { color: var(--muted); padding: 10px 0; }
</style>
</head>
<body>
<main>
  <h1>Dominios de clientes</h1>
  <p class="sub">Alta, revisión y baja de dominios en Cloudflare for SaaS.</p>

  <section>
    <h2>Conexión</h2>
    <label for="base">URL base de las funciones</label>
    <input type="text" id="base" value="https://us-central1-geinzworkapp.cloudfunctions.net">
    <label for="key">Clave de administrador (ADMIN_API_KEY)</label>
    <input type="password" id="key" autocomplete="off">
    <label class="check"><input type="checkbox" id="remember"> Recordar la clave en este navegador</label>
  </section>

  <section>
    <h2>Dominio</h2>
    <div class="row">
      <div>
        <label for="domain">Dominio del cliente</label>
        <input type="text" id="domain" placeholder="dominiodelcliente.com">
      </div>
      <div>
        <label for="tenant">ID del cliente (opcional)</label>
        <input type="text" id="tenant" placeholder="cliente123">
      </div>
    </div>
    <label class="check"><input type="checkbox" id="www" checked> Incluir también www</label>
    <label class="check"><input type="checkbox" id="delzone"> Al quitar, borrar también la zona de Cloudflare</label>
    <div class="actions">
      <button class="primary" data-act="addDomain">Agregar dominio</button>
      <button data-act="checkDomain">Revisar estado</button>
      <button data-act="getDomain">Ver datos guardados</button>
      <button class="danger" data-act="removeDomain">Quitar dominio</button>
    </div>
    <p class="hint">Después de agregar, cambia los nameservers en Hostinger. El resto se hace solo y se revisa cada 10 minutos.</p>
  </section>

  <section>
    <div class="listhead">
      <h2>Mis dominios <span id="count" class="hint"></span></h2>
      <div class="tools">
        <label class="check"><input type="checkbox" id="showReleased"> Mostrar liberados</label>
        <button id="import">Importar desde Cloudflare</button>
        <button id="reload">Actualizar lista</button>
      </div>
    </div>
    <div id="list"><p class="empty">Pega tu clave y haz click en Actualizar lista.</p></div>
  </section>

  <section id="result" aria-live="polite"></section>
</main>

<script>
const $ = (id) => document.getElementById(id);
const result = $("result");

// Recordar clave (opcional)
try {
  const saved = localStorage.getItem("geinz_admin_key");
  if (saved) { $("key").value = saved; $("remember").checked = true; }
} catch (e) {}

const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c]));

const STATUS = {
  pending_nameservers: "Esperando cambio de nameservers",
  pending_validation: "Validando certificado",
  active: "Activo",
  released: "Liberado",
};

function render(action, data) {
  const d = data.domain;
  let html = "";
  if (!d) {
    html += `<h2>Listo</h2>`;
  } else {
    const label = STATUS[d.status] || d.status;
    html += `<h2>${esc(d.domain)} <span class="status ${d.status === "active" ? "active" : ""}">${esc(label)}</span></h2>`;
    if (d.nextStep) html += `<div class="next">${esc(d.nextStep)}</div>`;
    if (d.status === "pending_nameservers" && d.nameservers && d.nameservers.length) {
      html += `<p>Nameservers para poner en tu proveedor:</p>`;
      d.nameservers.forEach((n) => {
        html += `<div class="ns"><code>${esc(n)}</code><button data-copy="${esc(n)}">Copiar</button></div>`;
      });
    }
    if (d.hostnames && d.hostnames.length) {
      html += `<table><tr><th>Hostname</th><th>Estado</th><th>Certificado</th></tr>`;
      d.hostnames.forEach((h) => {
        html += `<tr><td>${esc(h.hostname)}</td><td>${esc(h.status)}</td><td>${esc(h.sslStatus)}</td></tr>`;
      });
      html += `</table>`;
    }
  }
  if (data.log && data.log.length) {
    html += `<details open><summary>Qué se hizo</summary><ul>${data.log.map((l) => `<li>${esc(l)}</li>`).join("")}</ul></details>`;
  }
  if (data.note) html += `<p class="hint">${esc(data.note)}</p>`;
  html += `<details><summary>Respuesta completa</summary><pre>${esc(JSON.stringify(data, null, 2))}</pre></details>`;
  result.innerHTML = html;
}

async function call(action) {
  const key = $("key").value.trim();
  const domain = $("domain").value.trim();
  if (!key) return show("Falta la clave de administrador.");
  if (!domain) return show("Escribe el dominio del cliente.");
  if (action === "removeDomain" &&
      !confirm(`¿Quitar ${domain} de tu plataforma?${$("delzone").checked ? "\nTambién se borrará la zona en Cloudflare." : ""}`)) return;

  try {
    if ($("remember").checked) localStorage.setItem("geinz_admin_key", key);
    else localStorage.removeItem("geinz_admin_key");
  } catch (e) {}

  const body = { domain };
  if (action === "addDomain") { body.includeWww = $("www").checked; if ($("tenant").value.trim()) body.tenantId = $("tenant").value.trim(); }
  if (action === "removeDomain") body.deleteZone = $("delzone").checked;

  const buttons = document.querySelectorAll("button[data-act]");
  buttons.forEach((b) => (b.disabled = true));
  result.style.display = "block";
  result.innerHTML = "<p>Trabajando…</p>";
  try {
    const res = await fetch(`${$("base").value.replace(/\/+$/, "")}/domains-${action}`, {
      method: "POST",
      headers: { "Content-Type": "application/json", "x-api-key": key },
      body: JSON.stringify(body),
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok || data.ok === false) return show(data.error || `Error ${res.status}`);
    render(action, data);
    if (action !== "getDomain") loadList();
  } catch (e) {
    show("No se pudo conectar con la función. Revisa la URL base y tu internet. (" + e.message + ")");
  } finally {
    buttons.forEach((b) => (b.disabled = false));
  }
}

function show(msg) {
  result.style.display = "block";
  result.innerHTML = `<p class="error">${esc(msg)}</p>`;
}

let ALL = [];
function renderList() {
  const showReleased = $("showReleased").checked;
  const rows = ALL.filter((d) => showReleased || d.status !== "released");
  $("count").textContent = rows.length ? `(${rows.length})` : "";
  if (!rows.length) { $("list").innerHTML = '<p class="empty">Todavía no hay dominios. Agrega el primero arriba.</p>'; return; }
  let h = '<table><tr><th>Dominio</th><th>Cliente</th><th>Estado</th><th>Certificado</th><th></th></tr>';
  rows.forEach((d) => {
    const ssl = (d.hostnames || []).map((x) => x.sslStatus || "-").join(" / ");
    const label = STATUS[d.status] || d.status;
    h += `<tr class="pick" data-domain="${esc(d.domain)}"><td>${esc(d.domain)}</td><td>${esc(d.tenantId || "-")}</td>` +
         `<td><span class="status ${d.status === "active" ? "active" : ""}">${esc(label)}</span></td>` +
         `<td>${esc(ssl)}</td><td><button data-pick="${esc(d.domain)}">Ver</button></td></tr>`;
  });
  $("list").innerHTML = h + "</table>";
}

async function loadList() {
  const key = $("key").value.trim();
  if (!key) { $("list").innerHTML = '<p class="empty">Falta la clave de administrador.</p>'; return; }
  $("list").innerHTML = '<p class="empty">Cargando…</p>';
  try {
    const res = await fetch(`${$("base").value.replace(/\/+$/, "")}/domains-listDomains`, {
      method: "POST",
      headers: { "Content-Type": "application/json", "x-api-key": key },
      body: "{}",
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok || data.ok === false) { $("list").innerHTML = `<p class="error">${esc(data.error || "Error " + res.status)}</p>`; return; }
    ALL = data.domains || [];
    renderList();
  } catch (e) {
    $("list").innerHTML = `<p class="error">No se pudo conectar: ${esc(e.message)}</p>`;
  }
}

$("reload").addEventListener("click", loadList);
$("import").addEventListener("click", async () => {
  const key = $("key").value.trim();
  if (!key) return show("Falta la clave de administrador.");
  $("list").innerHTML = '<p class="empty">Importando desde Cloudflare…</p>';
  try {
    const res = await fetch(`${$("base").value.replace(/\/+$/, "")}/domains-importFromCloudflare`, {
      method: "POST", headers: { "Content-Type": "application/json", "x-api-key": key }, body: "{}" });
    const data = await res.json().catch(() => ({}));
    if (!res.ok || data.ok === false) return show(data.error || "Error " + res.status);
    result.style.display = "block";
    result.innerHTML = `<h2>Importación lista</h2><p>Encontrados en Cloudflare: ${data.found}. Importados: ${data.imported.length}. Ya estaban: ${data.skipped.length}.</p>` +
      (data.imported.length ? `<ul>${data.imported.map((d) => `<li>${esc(d)}</li>`).join("")}</ul>` : "");
    loadList();
  } catch (e) { show("No se pudo conectar: " + e.message); }
});
$("showReleased").addEventListener("change", renderList);
if ($("key").value) loadList();

document.addEventListener("click", (e) => {
  const pick = e.target.closest("[data-domain]");
  if (pick && !e.target.closest("button[data-act]")) {
    $("domain").value = pick.dataset.domain;
    call("getDomain");
    window.scrollTo({ top: 0, behavior: "smooth" });
    return;
  }
  const act = e.target.closest("button[data-act]");
  if (act) return call(act.dataset.act);
  const cp = e.target.closest("button[data-copy]");
  if (cp) { navigator.clipboard.writeText(cp.dataset.copy); cp.textContent = "Copiado"; setTimeout(() => (cp.textContent = "Copiar"), 1200); }
});
</script>
</body>
</html>
