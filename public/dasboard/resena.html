<!DOCTYPE html>

  <!-- Fondo negro + skeleton EN LÍNEA: se pinta al instante, sin esperar fuentes ni scripts -->
  <style>
    html, body { margin: 0; background: #030305; }
    #skel {
      position: fixed; inset: 0; z-index: 200; overflow-y: auto; overflow-x: hidden;
      background: #030305; color: #f4f4f5;
      font-family: "Plus Jakarta Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
      transition: opacity .35s ease;
    }
    #skel.out { opacity: 0; pointer-events: none; }
    #skel * { box-sizing: border-box; }
    #skel .hd {
      border-bottom: 1px solid rgba(255,255,255,.08);
      background: rgba(3,3,5,.9);
    }
    /* Alineado a la izquierda, pegado al borde (sin centrar) */
    #skel .hd-in {
      max-width: none; margin: 0; padding: 18px 32px;
      display: flex; align-items: center; gap: 12px;
    }
    #skel .w { max-width: none; margin: 0; padding: 28px 32px 80px; }
    #skel .g2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 28px; }
    #skel .cd {
      background: #0e0e14; border: 1px solid rgba(255,255,255,.08);
      border-radius: 16px; padding: 18px;
    }
    #skel .pills {
      display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 24px;
      padding: 12px; border-radius: 16px;
      background: rgba(24,24,27,.4); border: 1px solid rgba(39,39,42,.8);
    }
    #skel .rv { display: flex; gap: 12px; margin-bottom: 16px; }
    #skel .col { flex: 1; min-width: 0; }
    #skel .sk {
      position: relative; overflow: hidden;
      background: #101014; border: 1px solid #1a1a22; border-radius: 8px;
    }
    #skel .sk::after {
      content: ""; position: absolute; inset: 0; transform: translateX(-100%);
      background: linear-gradient(90deg, transparent, rgba(168,85,247,.18), transparent);
      animation: skm 1.6s infinite;
    }
    @keyframes skm { 100% { transform: translateX(100%); } }
    @media (max-width: 600px) {
      #skel .hd-in { padding: 14px 16px; }
      #skel .w { padding: 24px 16px 60px; }
    }
    @media (prefers-reduced-motion: reduce) { #skel .sk::after { animation: none; } }
  </style>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
    rel="stylesheet">

  <!-- ============================================================
       CAPTURADOR DE DATOS: solo se muestra si en el plan existe
       cliente_y_fidelizacion.review.capturador_datos === true
       Si no existe o está en false, se oculta (pestaña y panel).
       El plan llega desde el padre (SERVICIOS_UPDATE) con el mismo
       formato que envía inicio.js.
       ============================================================ -->
  <style>
    .cap-off { display: none !important; }
  </style>
  <script>
    (function () {
      var KEY = "geinz_capturador_datos";
      var permitido = false;
      try { permitido = sessionStorage.getItem(KEY) === "1"; } catch (e) {}

      // Lee el flag desde cualquier forma razonable del mensaje
      function leerFlag(d) {
        if (!d || typeof d !== "object") return null;
        var plan = d.servicios || d.plan || d;
        var cf = plan && plan.cliente_y_fidelizacion;
        if (!cf) return null;                       // este mensaje no trae el plan
        return !!(cf.review && cf.review.capturador_datos === true);
      }

      var RE_TXT = /capturador\s+de\s+datos/i;
      var RE_ID = /captur/i;

      function esCapturador(el) {
        var attrs = [el.id, el.getAttribute("data-tab"), el.getAttribute("data-panel"),
                     el.getAttribute("data-view"), el.getAttribute("data-target"),
                     el.getAttribute("aria-controls")].join(" ");
        if (RE_ID.test(attrs)) return true;
        // botones/pestañas cuyo texto propio es "Capturador de datos"
        if (/^(BUTTON|A|LI)$/.test(el.tagName) || el.getAttribute("role") === "tab") {
          return RE_TXT.test(el.textContent || "") && (el.textContent || "").length < 40;
        }
        return false;
      }

      function aplicar() {
        var root = document.body || document.documentElement;
        if (!root) return;
        var nodos = root.querySelectorAll("button, a, li, [role=tab], [id], [data-tab], [data-panel], [data-view], [data-target]");
        var tocados = [];
        nodos.forEach(function (el) {
          if (el.closest("#skel")) return;
          if (!esCapturador(el)) return;
          el.classList.toggle("cap-off", !permitido);
          tocados.push(el);
        });
        // Si solo queda una pestaña visible, la barra de pestañas no hace falta
        tocados.forEach(function (el) {
          var barra = el.parentElement;
          if (!barra || barra === root) return;
          if (!/^(BUTTON|A|LI)$/.test(el.tagName) && el.getAttribute("role") !== "tab") return;
          var visibles = Array.prototype.filter.call(barra.children, function (h) {
            return !h.classList.contains("cap-off");
          });
          barra.classList.toggle("cap-off", !permitido && visibles.length <= 1);
        });
        document.documentElement.setAttribute("data-capturador", permitido ? "on" : "off");
      }

      function setPermitido(v) {
        permitido = !!v;
        try { sessionStorage.setItem(KEY, permitido ? "1" : "0"); } catch (e) {}
        aplicar();
        window.dispatchEvent(new CustomEvent("capturador-permitido", { detail: permitido }));
      }

      // API para resena.js: window.CapturadorPlan.permitido()
      window.CapturadorPlan = { permitido: function () { return permitido; } };

      window.addEventListener("message", function (e) {
        if (e.origin !== window.location.origin) return;
        var v = leerFlag(e.data);
        if (v !== null) setPermitido(v);
      });

      // Pide el plan al padre por si ya lo tenía cargado
      try { window.parent.postMessage({ tipo: "PEDIR_SERVICIOS" }, window.location.origin); } catch (e) {}

      // Reaplica cuando resena.js dibuja/oculta pestañas y paneles
      function iniciarObserver() {
        aplicar();
        if (!("MutationObserver" in window)) return;
        var pend = false;
        new MutationObserver(function () {
          if (pend) return;
          pend = true;
          requestAnimationFrame(function () { pend = false; aplicar(); });
        }).observe(document.body, { childList: true, subtree: true });
      }
      if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", iniciarObserver);
      else iniciarObserver();
    })();
  </script>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script type="module" src="../js/dasboardjs/resena.js"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'ui-sans-serif', 'system-ui', 'sans-serif'],
            mono: ['"Plus Jakarta Sans"', 'ui-sans-serif', 'system-ui', 'sans-serif'],
          },
          colors: {
            dark: {
              bg: '#030305',
              surface: '#09090d',
              card: '#0f0f15',
              border: 'rgba(255, 255, 255, 0.07)',
            }
          }
        },
      },
    };
  </script>

  <style>
    :root {
      --bg: #030305;
      --surface: #09090d;
      --card-bg: #0e0e14;
      --card-border: rgba(255, 255, 255, 0.08);
      --font: "Plus Jakarta Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
    }

    /* Todo en sans serif (nada de mono ni serif), peso normal por defecto */
    html, body, button, input, textarea, select, .font-mono, .font-sans {
      font-family: var(--font) !important;
    }
    body { font-weight: 400; }

    body {
      background-color: var(--bg);
      color: #f4f4f5;
      font-feature-settings: "cv02", "cv03", "cv04", "cv11";
    }

    /* Solo lo que debe ir en negrita */
    h1, h2, h3, h4,
    .font-bold, .font-extrabold, .font-black, .font-semibold,
    .btn-primary, .btn-ghost,
    .filter-pill[data-active="true"] { font-weight: 700; }
    h1 { font-weight: 800; }

    /* Textos secundarios y descripciones: peso normal */
    p.text-zinc-500, p.text-zinc-400:not(.font-bold), .review-text, .reply-input { font-weight: 400; }

    * {
      scrollbar-width: thin;
      scrollbar-color: #27272a transparent;
    }

    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #27272a; border-radius: 99px; }
    ::-webkit-scrollbar-thumb:hover { background: #3f3f46; }

    /* Glass Effect UI */
    .glass-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      transition: all 0.22s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .glass-card:hover {
      border-color: rgba(168, 85, 247, 0.3);
      box-shadow: 0 12px 30px -10px rgba(0, 0, 0, 0.8);
    }

    /* Filter Pills */
    .filter-pill { transition: all 0.18s ease; font-weight: 600; }

    .filter-pill[data-active="true"] {
      background: #ffffff;
      color: #000000;
      font-weight: 700;
      box-shadow: 0 4px 14px rgba(255, 255, 255, 0.15);
    }

    .filter-pill[data-active="false"] {
      background: rgba(255, 255, 255, 0.03);
      color: #a1a1aa;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .filter-pill[data-active="false"]:hover {
      background: rgba(255, 255, 255, 0.07);
      color: #ffffff;
    }

    /* Estrellas */
    .stars { color: #fbbf24; letter-spacing: 1px; font-size: 13px; }
    .stars .off { color: #3f3f46; }

    /* Card de review */
    .review-card {
      transition: transform 0.18s ease, border-color 0.18s ease;
    }

    .review-card.card-enter {
      animation: cardIn 0.28s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes cardIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .avatar-fallback {
      width: 38px; height: 38px; border-radius: 999px;
      background: linear-gradient(135deg, #a855f7, #6d28d9);
      display: flex; align-items: center; justify-content: center;
      font-weight: 800; font-size: 14px; color: #fff; flex-shrink: 0;
    }

    .respuesta-box {
      background: rgba(168, 85, 247, 0.06);
      border: 1px solid rgba(168, 85, 247, 0.18);
      border-radius: 12px;
    }

    textarea.reply-input {
      width: 100%;
      background: #101018;
      border: 1px solid rgba(255,255,255,.1);
      border-radius: 10px;
      padding: 10px 12px;
      color: #fff;
      font-size: 13px;
      resize: vertical;
      min-height: 60px;
    }
    textarea.reply-input:focus { outline: none; border-color: #a855f7; }

    .btn-primary {
      background: #a855f7; color: #fff; font-weight: 700; font-size: 12px;
      padding: 8px 16px; border-radius: 10px; border: none; cursor: pointer;
      transition: background .18s ease;
    }
    .btn-primary:hover { background: #9333ea; }
    .btn-primary:disabled { opacity: .5; cursor: not-allowed; }

    .btn-ghost {
      background: rgba(255,255,255,.04); color: #d4d4d8; font-weight: 600; font-size: 12px;
      padding: 8px 16px; border-radius: 10px; border: 1px solid rgba(255,255,255,.08); cursor: pointer;
    }
    .btn-ghost:hover { background: rgba(255,255,255,.08); }

    #btn-cargar-mas:disabled { opacity: .5; cursor: not-allowed; }

    .skeleton-line {
      background: linear-gradient(90deg, #101014 0%, #1c1c22 50%, #101014 100%);
      background-size: 200% 100%;
      animation: skeletonShine 1.3s ease infinite;
      border-radius: 6px;
    }
    @keyframes skeletonShine {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    /* ===== Layout: contenido alineado a la izquierda, pegado al menú ===== */
    .page-wrap { max-width: none; margin: 0; padding-left: 2rem; padding-right: 2rem; }
    @media (min-width: 1536px) { .page-wrap { padding-left: 2.5rem; padding-right: 2.5rem; } }

    /* ===== Pantalla grande: columna lateral (resumen + filtros) y reseñas al lado ===== */
    .layout > * { grid-column: 1 / -1; }
    .layout { display: block; }
    @media (min-width: 1100px) {
      .layout {
        display: grid;
        grid-template-columns: 340px minmax(0, 1fr);
        column-gap: 28px; row-gap: 20px; align-items: start;
      }
      .layout > .side { grid-column: 1; grid-row: 2; position: sticky; top: 92px; }
      .layout > .feed { grid-column: 2; grid-row: 2; min-width: 0; }
      .side .stats { grid-template-columns: 1fr !important; margin-bottom: 16px !important; }
      .side .filtros { margin-bottom: 0 !important; }
    }
    /* Reseñas en 2 columnas cuando hay espacio de sobra */
    @media (min-width: 1700px) {
      #reviews-list, #reviews-skeleton {
        display: grid !important;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        align-items: start;
      }
    }
    @media (max-width: 600px) {
      .page-wrap { padding-left: 1rem; padding-right: 1rem; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
    }
  </style>
</head>

  <!-- Cierra el skeleton SOLO, sin tocar resena.js:
       se desvanece cuando la primera carga termina (el skeleton interno se oculta,
       aparecen reseñas o aparece el estado vacío).
       Respaldo: a los 10 s se cierra igual para que nunca quede pegado. -->
  <script>
    (function () {
      var skel = document.getElementById("skel");
      var lista = document.getElementById("reviews-list");
      var inner = document.getElementById("reviews-skeleton");
      var vacio = document.getElementById("empty-state");
      if (!skel) return;
      var cerrado = false, mo = null;

      function cerrar() {
        if (cerrado) return;
        cerrado = true;
        if (mo) mo.disconnect();
        skel.classList.add("out");
        skel.setAttribute("aria-busy", "false");
        setTimeout(function () { skel.style.display = "none"; }, 400);
      }

      function listo() {
        if (lista && lista.children.length) return true;
        if (vacio && !vacio.classList.contains("hidden")) return true;
        if (inner && inner.classList.contains("hidden")) return true;
        return false;
      }

      if ("MutationObserver" in window) {
        mo = new MutationObserver(function () { if (listo()) cerrar(); });
        if (lista) mo.observe(lista, { childList: true });
        if (vacio) mo.observe(vacio, { attributes: true, attributeFilter: ["class"] });
        if (inner) mo.observe(inner, { attributes: true, attributeFilter: ["class"] });
      }
      if (listo()) cerrar();
      setTimeout(cerrar, 10000);
    })();
  </script>

</body>

</html>
