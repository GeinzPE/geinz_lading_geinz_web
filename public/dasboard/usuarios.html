<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Mis usuarios</title>
<style>
  body{margin:0;padding:24px;background:#0a0a0a;color:#fff;font-family:system-ui,sans-serif}
  h2{margin:0 0 4px} p.sub{margin:0 0 20px;color:#8b8b94;font-size:14px}
  .card{background:#111113;border:1px solid rgba(255,255,255,.07);border-radius:16px;padding:6px 16px;margin-bottom:24px;max-width:640px}
  .row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 0;border-bottom:1px solid rgba(255,255,255,.05)}
  .row:last-child{border-bottom:0}
  .row small{display:block;color:#8b8b94;margin-top:2px}
  .sw{position:relative;width:46px;height:26px;flex:none}
  .sw input{opacity:0;position:absolute;inset:0;margin:0;cursor:pointer;z-index:2}
  .sw i{position:absolute;inset:0;background:#2a2a30;border-radius:26px;transition:.2s}
  .sw i::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;background:#fff;border-radius:50%;transition:.2s}
  .sw input:checked+i{background:#8b5cf6}
  .sw input:checked+i::after{transform:translateX(20px)}
  .sw input:disabled{cursor:not-allowed} .sw input:disabled+i{opacity:.5}
  #toast{position:fixed;bottom:20px;right:20px;background:#1c1c20;padding:10px 16px;border-radius:10px;font-size:13px;opacity:0;transition:.25s}
  #toast.show{opacity:1}
  table{width:100%;border-collapse:collapse;font-size:13px}
  td,th{padding:8px 6px;text-align:left;border-bottom:1px solid rgba(255,255,255,.05)}
  th{color:#8b8b94;font-weight:600}
</style>
<script type="module" src="../js/dasboardjs/usuarios.js"></script>
</head>
<body>
  <h2>Mis usuarios</h2>
  <p class="sub">Elige qué datos se piden cuando un cliente crea su cuenta en tu negocio.</p>
  <div class="card" id="lista"></div>

  <h2 style="font-size:17px">Usuarios registrados</h2>
  <div class="card" style="padding:12px 16px">
    <table><thead><tr><th>Nombre</th><th>Correo</th><th>Registro</th></tr></thead>
    <tbody id="registrados"><tr><td colspan="3">Cargando…</td></tr></tbody></table>
  </div>
  <div id="toast"></div>
</body>
</html>
