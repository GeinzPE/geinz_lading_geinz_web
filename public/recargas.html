<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Recarga de Créditos - Geinz</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style/recargas.css">
</head>

<body>

    <header>
        <h1>Potencia tu negocio con GEINZ Ads</h1>
        <p>Toma el control de tus promociones, notificaciones y beneficios.</p>
    </header>

    <div class="culqi-banner">
        <div class="culqi-banner-text">
            <h2>Recarga tus créditos de forma segura</h2>
            <p>Procesado con pasarela Culqi + respaldo BCP</p>
        </div>
        <div class="culqi-logo-space">
            <img class="culqi-img" src="img/respaldo_culqui.webp" alt="Culqi BCP">
        </div>
    </div>

    <main class="planes-container" id="planes-wrapper">
        <div class="plan-card skeleton"></div>
        <div class="plan-card skeleton"></div>
        <div class="plan-card skeleton"></div>
        <div class="plan-card skeleton"></div>
    </main>

    <footer>
        <p>Procesado de forma segura vía <span class="bold-white">Culqi</span> • Con el respaldo de <span
                class="bold-white">BCP</span></p>
    </footer>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const appPlanes = initializeApp({
            apiKey: "AIzaSyA47YFtXgzUQe8w_Wb6AlfDcQSjOB5rT_U",
            authDomain: "proyectolista-95172.firebaseapp.com",
            projectId: "proyectolista-95172",
            storageBucket: "proyectolista-95172.firebasestorage.app",
            messagingSenderId: "250365546182",
            appId: "1:250365546182:web:732f2342d416eb909111c7",
        }, "planes");

        const dbPlanes = getFirestore(appPlanes);
        const wrapper = document.getElementById('planes-wrapper');

        const ordenPlanes = ["basico", "avanzado", "primium", "busness"];

        async function cargarPlanes() {
            try {
                const querySnapshot = await getDocs(collection(dbPlanes, "precios_planes_geinz"));
                const planesData = {};

                querySnapshot.forEach((doc) => {
                    planesData[doc.id] = doc.data();
                });

                wrapper.innerHTML = "";

                ordenPlanes.forEach((idPlan) => {
                    const plan = planesData[idPlan];
                    if (!plan) return;

                    const precioFormateado = new Intl.NumberFormat('es-PE', { style: 'currency', currency: 'PEN' }).format(plan.precio_soles);
                    const monedasFormateadas = new Intl.NumberFormat('es-PE').format(plan.monedas_inicial || plan.monedas);

                    let bonoHTML = "";
                    let claseExtraPadding = "no-gift-padding";

                    if (plan.monedas_agregadas && plan.monedas_agregadas > 0) {
                        bonoHTML = `
                            <div class="gift-badge">
                                🎁 +${plan.monedas_agregadas} de regalo
                            </div>
                        `;
                        claseExtraPadding = "";
                    }

                    let accesosHTML = "";
                    if (Array.isArray(plan.accesos)) {
                        plan.accesos.forEach((acceso) => {
                            accesosHTML += `<li>${acceso}</li>`;
                        });
                    }

                    const esAvanzado = idPlan === "avanzado" ? "avanzado-destacado" : "";

                    const card = document.createElement('div');
                    card.className = `plan-card ${esAvanzado}`;
                    card.innerHTML = `
                        <div class="plan-name">
                            ${plan.nombre || plan.nombre_plan}
                        </div>
                        <div class="plan-coins-wrapper">
                            <span class="plan-coins">${monedasFormateadas}</span>
                            <img class="coin-icon" src="img/icon_monedas_3d.webp" alt="coin" />
                        </div>
                        
                        ${bonoHTML}

                        <ul class="benefits-list ${claseExtraPadding}">
                            ${accesosHTML}
                        </ul>

                        <button class="btn-price" onclick="iniciarPago('${plan.idplan}', ${plan.precio_soles})">
                            Adquirir por ${precioFormateado}
                        </button>
                    `;

                    wrapper.appendChild(card);
                });

            } catch (error) {
                console.error("Error sincronizando base de datos:", error);
                wrapper.innerHTML = `<p style="color: #ff4a4a; text-align: center; width: 100%;">Error al sincronizar tarifas actuales.</p>`;
            }
        }

        window.iniciarPago = function (idPlan, precio) {
            console.log(`Checkout iniciado para el plan: ${idPlan} por S/. ${precio}`);
        };

        cargarPlanes();
    </script>
</body>

</html>
