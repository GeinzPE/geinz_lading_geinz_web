<!-- Requiere modales-base.css en la página (una sola vez). Mantiene los mismos id que usa productos.js -->
<div class="overlay dlg" id="overlay-categoria">
  <div class="modal dlg-box sm" role="dialog" aria-modal="true">
    <form id="form-categoria" class="dlg-form" novalidate>
      <div class="dlg-head"><h3>Nueva categoría</h3><p id="cat-ejemplo-text">Ejemplo: Jaleas, Chaufas, Bebidas, Promociones.</p></div>
      <div class="dlg-body"><label class="dlg-label" for="input-cat-nombre">Nombre de la categoría</label>
        <input type="text" id="input-cat-nombre" class="dlg-input" placeholder="Ej. Platos Marinos" required maxlength="40" autocomplete="off"></div>
      <div class="dlg-foot"><button type="button" class="dlg-btn ghost" data-close="overlay-categoria">Cancelar</button>
        <button type="submit" id="btn-guardar-categoria" class="dlg-btn main"><span id="btn-guardar-categoria-label">Crear categoría</span></button></div>
    </form>
  </div>
</div>
