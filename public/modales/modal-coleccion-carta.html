<!-- Requiere modales-base.css en la página (una sola vez). Mantiene los mismos id que usa productos.js -->
<div class="overlay dlg amber" id="overlay-carta">
  <div class="modal dlg-box sm" role="dialog" aria-modal="true">
    <form id="form-carta" class="dlg-form" novalidate>
      <div class="dlg-head"><h3>Nueva colección</h3><p>Ejemplo: Platos fuertes, Bebidas, Combos, Postres.</p></div>
      <div class="dlg-body"><label class="dlg-label" for="input-carta-nombre">Nombre de la colección</label>
        <input type="text" id="input-carta-nombre" class="dlg-input" placeholder="Ej. Platos fuertes" required maxlength="40" autocomplete="off"></div>
      <div class="dlg-foot"><button type="button" class="dlg-btn ghost" data-close="overlay-carta">Cancelar</button>
        <button type="submit" id="btn-guardar-carta" class="dlg-btn main"><span id="btn-guardar-carta-label">Crear colección</span></button></div>
    </form>
  </div>
</div>
