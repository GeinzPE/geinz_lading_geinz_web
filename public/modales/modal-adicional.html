<!-- Requiere modales-base.css en la página (una sola vez). Mantiene los mismos id que usa productos.js -->
<div class="overlay dlg amber" id="overlay-adicional">
  <div class="modal dlg-box sm" role="dialog" aria-modal="true">
    <form id="form-adicional" class="dlg-form" novalidate>
      <div class="dlg-head"><h3 id="adic-modal-titulo">Nuevo adicional</h3><p>Ejemplo: Taper S/ 1.00, Bolsa S/ 0.30.</p></div>
      <div class="dlg-body">
        <div class="dlg-field"><label class="dlg-label" for="input-adic-nombre">Nombre</label>
          <input type="text" id="input-adic-nombre" class="dlg-input" maxlength="40" placeholder="Ej. Taper" autocomplete="off"></div>
        <div class="dlg-field"><label class="dlg-label" for="input-adic-precio">Precio (S/)</label>
          <input type="number" id="input-adic-precio" class="dlg-input mono" inputmode="decimal" step="0.10" min="0" placeholder="0.00"></div>
        <div class="dlg-field"><span class="dlg-label">Foto <em>(opcional)</em></span>
          <div style="display:flex;align-items:center;gap:14px">
            <div id="adic-foto-prev" class="dlg-foto">+</div>
            <button type="button" id="btn-adic-quitar-foto" class="dlg-link hidden" style="color:#fda4af">Quitar foto</button>
            <input type="file" id="input-adic-foto" accept="image/*" style="display:none"></div></div>
      </div>
      <div class="dlg-foot"><button type="button" class="dlg-btn ghost" data-close="overlay-adicional">Cancelar</button>
        <button type="submit" id="btn-guardar-adicional" class="dlg-btn main"><span id="btn-guardar-adicional-label">Guardar</span></button></div>
    </form>
  </div>
</div>
