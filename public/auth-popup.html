<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Iniciar sesión</title>
  <script type="module" src="./js/share/auth-popup.js"></script>
  <style>
    body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
      background:#0b0b0d;color:#fff;font-family:Inter,system-ui,sans-serif;}
    .box{width:100%;max-width:340px;padding:32px 26px;text-align:center;}
    h1{font-size:20px;margin:0 0 8px;}
    p{font-size:13.5px;color:#9c9ca3;margin:0 0 22px;line-height:1.5;}
    button{width:100%;padding:13px;border:none;border-radius:12px;font-weight:700;
      font-size:14px;color:#111;background:#fff;cursor:pointer;}
    button:disabled{opacity:.6;cursor:default;}
  </style>
</head>
<body>
  <div class="box">
    <h1>Iniciar sesión</h1>
    <p id="msg">Continúa con tu cuenta de Google.</p>
    <button id="btnGoogle">Continuar con Google</button>
  </div>
 

</body>
</html>
