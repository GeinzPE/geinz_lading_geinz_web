<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="dark" />
  <meta name="theme-color" content="#000000" />
  <title>Iniciar sesión</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet" />

  <script type="module" src="./js/share/auth-popup.js"></script>

  <style>
    :root {
      --rgb: 139, 92, 246;
      /* color de texto sobre el botón principal (lo ajusta el JS según el brillo del color) */
      --on: #fff;
      --bg: #000;
      --card: #09090b;
      --line: rgba(255, 255, 255, .07);
      --muted: #8b8b94;
    }

    [hidden] {
      display: none !important;
    }

    * {
      box-sizing: border-box;
    }

    html {
      background: var(--bg);
      color-scheme: dark;
    }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      padding: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      color: #fff;
      font-family: Manrope, Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    /* ───────── Tarjeta ───────── */
    .box {
      position: relative;
      overflow: hidden;
      width: 100%;
      max-width: 380px;
      padding: 40px 26px 22px;
      text-align: center;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 28px;
      box-shadow: 0 30px 80px -20px rgba(0, 0, 0, .9);
      animation: enter .55s cubic-bezier(.2, .7, .2, 1) both;
    }

    /* Cuando la tarjeta muestra el registro completo, se permite crecer y scrollear */
    .box.is-wide {
      max-width: 420px;
      max-height: 92vh;
      max-height: 92dvh;
      overflow-y: auto;
      text-align: left;
    }

    .box.is-wide::-webkit-scrollbar { width: 6px; }
    .box.is-wide::-webkit-scrollbar-thumb { background: rgba(255,255,255,.12); border-radius: 6px; }

    /* línea fina con el color del negocio en el borde superior */
    .box::before {
      content: "";
      position: absolute;
      inset: 0 0 auto 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(var(--rgb), .75), transparent);
      z-index: 1;
    }

    /* ───────── Logo + glow detrás ───────── */
    .hero {
      position: relative;
      isolation: isolate;
      width: 92px;
      height: 92px;
      margin: 0 auto 24px;
    }

    .glow {
      position: absolute;
      left: 50%;
      top: 50%;
      z-index: -1;
      width: 230px;
      height: 230px;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      pointer-events: none;
      background: radial-gradient(circle,
          rgba(var(--rgb), .42) 0%,
          rgba(var(--rgb), .16) 38%,
          transparent 70%);
      filter: blur(14px);
    }

    .avatar {
      position: relative;
      width: 92px;
      height: 92px;
      border-radius: 50%;
      overflow: hidden;
      background: #0d0d0f;
      box-shadow: 0 0 0 1px rgba(255, 255, 255, .06);
    }

    .avatar .logo {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0;
      transition: opacity .5s ease;
    }

    .avatar .logo.in {
      opacity: 1;
    }

    /* Blindaje: si un JS viejo agrega el <img> directo en .hero, igual queda dentro del círculo */
    .hero>img.logo {
      position: absolute;
      inset: 0;
      z-index: 1;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      background: #0d0d0f;
    }

    .avatar .letter {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.1rem;
      font-weight: 800;
      color: rgba(var(--rgb), 1);
      background: rgba(var(--rgb), .14);
      box-shadow: inset 0 0 0 1.5px rgba(var(--rgb), .55);
    }

    /* ───────── Textos ───────── */
    h1 {
      margin: 0 0 8px;
      font-size: 21px;
      font-weight: 800;
      letter-spacing: -.015em;
      text-align: center;
    }

    .desc {
      margin: 0 0 26px;
      font-size: 14px;
      line-height: 1.55;
      color: var(--muted);
      text-align: center;
    }

    .desc b {
      color: #f4f4f5;
      font-weight: 700;
    }

    /* ───────── Layout de vistas ───────── */
    .actions,
    form {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    /* ───────── Botones ───────── */
    button,
    input,
    select {
      font-family: inherit;
    }

    button {
      width: 100%;
      height: 50px;
      padding: 0 16px;
      border: 0;
      border-radius: 14px;
      font-size: 14.5px;
      font-weight: 700;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      transition: transform .15s ease, filter .2s ease, background .2s ease, border-color .2s ease, color .2s ease;
    }

    button:active {
      transform: scale(.985);
    }

    button:focus-visible {
      outline: 2px solid rgba(var(--rgb), .95);
      outline-offset: 3px;
    }

    button:disabled {
      opacity: .6;
      cursor: default;
    }

    .btn-google {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      background: #fff;
      color: #111;
    }

    .btn-google:hover {
      background: #f0f0f1;
    }

    .btn-primary {
      color: var(--on);
      background: linear-gradient(135deg, rgb(var(--rgb)), rgba(var(--rgb), .72));
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, .16), 0 10px 26px -10px rgba(var(--rgb), .65);
    }

    .btn-primary:hover {
      filter: brightness(1.1);
    }

    .btn-secondary {
      color: #d4d4d8;
      font-weight: 600;
      background: rgba(255, 255, 255, .035);
      border: 1px solid rgba(255, 255, 255, .09);
    }

    .btn-secondary:hover {
      background: rgba(255, 255, 255, .06);
      border-color: rgba(255, 255, 255, .14);
    }

    .btn-link {
      height: auto;
      padding: 10px;
      background: none;
      color: var(--muted);
      font-size: 13px;
      font-weight: 600;
    }

    .btn-link:hover {
      color: #d4d4d8;
    }

    .btn-link-inline {
      display: inline;
      width: auto;
      height: auto;
      padding: 0;
      margin-left: 4px;
      background: none;
      border: 0;
      color: rgb(var(--rgb));
      font-size: inherit;
      font-weight: 700;
      text-decoration: underline;
      cursor: pointer;
    }

    .sep {
      display: flex;
      align-items: center;
      gap: 14px;
      margin: 4px 0;
      font-size: 12px;
      color: #5c5c65;
    }

    .sep::before,
    .sep::after {
      content: "";
      flex: 1;
      height: 1px;
      background: var(--line);
    }

    /* ───────── Inputs / Selects ───────── */
    input,
    select {
      width: 100%;
      height: 50px;
      padding: 0 16px;
      font-size: 16px;
      color: #fff;
      background: rgba(255, 255, 255, .03);
      border: 1px solid rgba(255, 255, 255, .09);
      border-radius: 14px;
      transition: border-color .2s ease, box-shadow .2s ease, background .2s ease;
      appearance: none;
      -webkit-appearance: none;
    }

    select {
      background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%238b8b94' stroke-width='2.4'%3e%3cpath d='m6 9 6 6 6-6'/%3e%3c/svg%3e");
      background-repeat: no-repeat;
      background-position: right 14px center;
      background-size: 16px;
      padding-right: 40px;
    }

    select:disabled {
      opacity: .45;
      cursor: not-allowed;
    }

    select option {
      background: #111113;
      color: #fff;
    }

    input::placeholder {
      color: #5f5f68;
    }

    input:focus,
    select:focus {
      outline: none;
      background: rgba(255, 255, 255, .045);
      border-color: rgba(var(--rgb), .7);
      box-shadow: 0 0 0 4px rgba(var(--rgb), .14);
    }

    /* que el autocompletado del navegador no pinte blanco/azul */
    input:-webkit-autofill,
    input:-webkit-autofill:hover,
    input:-webkit-autofill:focus {
      -webkit-text-fill-color: #fff;
      caret-color: #fff;
      -webkit-box-shadow: 0 0 0 100px #111113 inset;
      box-shadow: 0 0 0 100px #111113 inset;
      transition: background-color 9999s ease-in-out 0s;
    }

    /* ───────── Grupos de campo ───────── */
    .field-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .field-label {
      font-size: 12.5px;
      font-weight: 700;
      color: #b6b6bd;
      padding-left: 2px;
    }

    .field-error {
      margin: 0;
      font-size: 12px;
      line-height: 1.45;
      color: #ff9a9a;
    }

    .field-error:empty {
      display: none;
    }

    .row-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .phone-row {
      display: flex;
      gap: 8px;
    }

    .phone-prefix {
      display: flex;
      align-items: center;
      gap: 6px;
      flex: 0 0 auto;
      height: 50px;
      padding: 0 12px;
      border-radius: 14px;
      border: 1px solid rgba(255, 255, 255, .09);
      background: rgba(255, 255, 255, .03);
      font-weight: 700;
      font-size: 13.5px;
      color: #d4d4d8;
      white-space: nowrap;
    }

    .phone-row input {
      flex: 1;
    }

    .checkbox-row {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 4px 2px;
    }

    .checkbox-row input[type="checkbox"] {
      width: 18px;
      height: 18px;
      min-width: 18px;
      margin-top: 2px;
      accent-color: rgb(var(--rgb));
    }

    .checkbox-row label {
      font-size: 12.5px;
      line-height: 1.5;
      color: var(--muted);
    }

    /* Chip del correo confirmado en el login de 2 pasos */
    .chip {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 10px 14px;
      border-radius: 12px;
      background: rgba(var(--rgb), .1);
      border: 1px solid rgba(var(--rgb), .3);
      font-size: 13.5px;
      font-weight: 700;
      color: #e8e8ea;
    }

    .chip button {
      width: auto;
      height: auto;
      padding: 4px 8px;
      background: rgba(255, 255, 255, .07);
      border-radius: 8px;
      font-size: 11.5px;
      font-weight: 700;
      color: var(--muted);
    }

    .section-title {
      margin: 6px 0 -2px;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: .03em;
      text-transform: uppercase;
      color: #6b6b74;
    }

    /* ───────── Error general ───────── */
    .error {
      margin: 14px 0 0;
      padding: 10px 12px;
      font-size: 12.5px;
      line-height: 1.45;
      color: #ff9a9a;
      background: rgba(255, 90, 90, .07);
      border: 1px solid rgba(255, 90, 90, .18);
      border-radius: 12px;
      animation: fade .25s ease both;
      text-align: left;
    }

    .error:empty {
      display: none;
    }

    .back {
      display: block;
      margin-top: 16px;
      font-size: 12.5px;
      color: #6b6b74;
      text-decoration: none;
      transition: color .2s ease;
      text-align: center;
    }

    .back:hover {
      color: #b4b4bc;
    }

    /* ───────── Estado de carga (skeleton) ───────── */
    .loading {
      display: flex;
      flex-direction: column;
      gap: 10px;
      animation: fade .3s ease both;
    }

    .loading-msg {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin: 0 0 12px;
      font-size: 13.5px;
      font-weight: 600;
      color: #a1a1aa;
    }

    .pulse {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: rgb(var(--rgb));
      animation: ping 1.5s ease-out infinite;
    }

    .skel,
    .avatar.is-loading {
      position: relative;
      overflow: hidden;
      background: rgba(255, 255, 255, .04);
    }

    .skel {
      height: 50px;
      border-radius: 14px;
    }

    .skel.s2 {
      opacity: .7;
    }

    .skel.s3 {
      height: 14px;
      width: 52%;
      margin: 8px auto 0;
      border-radius: 8px;
      opacity: .5;
    }

    .skel::after,
    .avatar.is-loading::after {
      content: "";
      position: absolute;
      inset: 0;
      transform: translateX(-100%);
      background: linear-gradient(90deg, transparent, rgba(var(--rgb), .16), transparent);
      animation: shimmer 1.7s ease-in-out infinite;
    }

    /* ───────── Animaciones ───────── */
    @keyframes enter {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
    }

    @keyframes fade {
      from {
        opacity: 0;
      }
    }

    @keyframes shimmer {
      to {
        transform: translateX(100%);
      }
    }

    @keyframes ping {
      0% {
        box-shadow: 0 0 0 0 rgba(var(--rgb), .55);
      }

      70%,
      100% {
        box-shadow: 0 0 0 9px rgba(var(--rgb), 0);
      }
    }

    @media (prefers-reduced-motion: reduce) {

      *,
      *::before,
      *::after {
        animation: none !important;
        transition: none !important;
      }
    }
  </style>
</head>

<body>
  <main class="box" id="box">
    <div class="hero" id="logoWrap">
      <span class="glow" aria-hidden="true"></span>
      <div class="avatar is-loading" id="avatar"></div>
    </div>

    <h1 id="title">Inicia sesión</h1>
    <p class="desc" id="msg">Para continuar en <b id="bizName">este negocio</b>, elige cómo entrar.</p>

    <!-- Vista principal -->
    <div id="viewMain" class="actions">
      <button id="btnGoogle" class="btn-google" type="button">
        <svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true">
          <path fill="#EA4335"
            d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.8 2.4 30.3 0 24 0 14.6 0 6.5 5.4 2.6 13.2l7.9 6.1C12.4 13.6 17.7 9.5 24 9.5z" />
          <path fill="#4285F4"
            d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.7c-.6 3-2.3 5.5-4.8 7.2l7.5 5.8c4.4-4.1 7.1-10.1 7.1-17.5z" />
          <path fill="#FBBC05"
            d="M10.5 28.7c-.5-1.4-.8-3-.8-4.7s.3-3.2.8-4.7l-7.9-6.1C.9 16.5 0 20.1 0 24s.9 7.5 2.6 10.8l7.9-6.1z" />
          <path fill="#34A853"
            d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.5-5.8c-2.1 1.4-4.9 2.3-8.4 2.3-6.3 0-11.6-4.1-13.5-9.8l-7.9 6.1C6.5 42.6 14.6 48 24 48z" />
        </svg>
        Continuar con Google
      </button>
      <div class="sep">o</div>
      <button id="btnGoLogin" class="btn-primary" type="button">Iniciar sesión con cuenta</button>
      <button id="btnGoRegister" class="btn-secondary" type="button">Crear cuenta</button>
    </div>

    <!-- Vista: iniciar sesión con correo (2 pasos, igual a login.js) -->
    <form id="viewLogin" hidden>

      <!-- Paso 1: correo -->
      <div id="loginStepEmail">
        <div class="field-group">
          <label class="field-label" for="loginEmail">Correo electrónico</label>
          <input id="loginEmail" type="email" placeholder="tucorreo@ejemplo.com" autocomplete="email" />
        </div>
        <p class="field-error" id="loginEmailError"></p>
        <button id="btnCheckEmail" class="btn-primary" type="button">Continuar</button>
      </div>

      <!-- Paso 2: contraseña -->
      <div id="loginStepPassword" hidden>
        <div class="chip" id="loginEmailChip">
          <span id="loginEmailChipText"></span>
          <button type="button" id="btnChangeEmail">Cambiar</button>
        </div>
        <div class="field-group" style="margin-top:14px;">
          <label class="field-label" for="loginPass">Contraseña</label>
          <input id="loginPass" type="password" placeholder="••••••••" autocomplete="current-password" />
        </div>
        <p class="field-error" id="loginPassError"></p>
        <button id="btnLoginSubmit" class="btn-primary" type="submit">Entrar</button>
      </div>

      <button class="btn-link" type="button" data-back>← Volver</button>
    </form>

    <!-- Vista: crear cuenta (mismos campos y misma base que login.js) -->
    <form id="viewRegister" hidden>

      <div class="row-2">
        <div class="field-group">
          <label class="field-label" for="regNombre">Nombre</label>
          <input id="regNombre" type="text" placeholder="Nombre" autocomplete="given-name" />
        </div>
        <div class="field-group">
          <label class="field-label" for="regApellido">Apellido</label>
          <input id="regApellido" type="text" placeholder="Apellido" autocomplete="family-name" />
        </div>
      </div>
      <p class="field-error" id="errRegNombre"></p>

      <div class="field-group">
        <label class="field-label" for="regUsername">Nombre de usuario</label>
        <input id="regUsername" type="text" placeholder="mi_usuario" autocomplete="username" />
      </div>
      <p class="field-error" id="errRegUsername"></p>

      <div class="field-group">
        <label class="field-label">País (teléfono)</label>
        <select id="regPaisTel">
          <option value="" disabled selected hidden>Seleccionar país</option>
        </select>
      </div>

      <div class="field-group">
        <label class="field-label" for="regTelefono">Número de teléfono</label>
        <div class="phone-row">
          <div class="phone-prefix" id="regPrefixBox">
            <span id="regPrefixFlag">🇵🇪</span>
            <span id="regPrefixCode">+51</span>
          </div>
          <input id="regTelefono" type="tel" placeholder="987 654 321" autocomplete="tel-national" maxlength="12" />
        </div>
      </div>
      <p class="field-error" id="errRegTelefono"></p>

      <div class="field-group">
        <label class="field-label" for="regGenero">Género</label>
        <select id="regGenero">
          <option value="" disabled selected hidden>Seleccionar</option>
          <option value="Masculino">Masculino</option>
          <option value="Femenino">Femenino</option>
          <option value="Otro">Otro</option>
        </select>
      </div>
      <p class="field-error" id="errRegGenero"></p>

      <p class="section-title">Ubicación</p>
      <div class="field-group">
        <label class="field-label">Departamento</label>
        <select id="regDepartamento">
          <option value="" disabled selected hidden>Selecciona</option>
        </select>
      </div>
      <div class="field-group">
        <label class="field-label">Provincia</label>
        <select id="regProvincia" disabled>
          <option value="" disabled selected hidden>Elige depto.</option>
        </select>
      </div>
      <div class="field-group">
        <label class="field-label">Distrito</label>
        <select id="regDistrito" disabled>
          <option value="" disabled selected hidden>Elige provincia</option>
        </select>
      </div>
      <p class="field-error" id="errRegUbicacion"></p>

      <div class="field-group">
        <label class="field-label" for="regFechaNac">Fecha de nacimiento</label>
        <input id="regFechaNac" type="date" autocomplete="bday" />
      </div>
      <p class="field-error" id="errRegFecha"></p>

      <div class="field-group">
        <label class="field-label">Nacionalidad</label>
        <select id="regNacionalidad">
          <option value="" disabled selected hidden>Seleccionar país</option>
        </select>
        <input type="hidden" id="regCodPais" />
        <input type="hidden" id="regNombrePais" />
      </div>
      <p class="field-error" id="errRegNacionalidad"></p>

      <div class="field-group">
        <label class="field-label" for="regEmail">Correo electrónico</label>
        <input id="regEmail" type="email" placeholder="tucorreo@gmail.com" autocomplete="email" />
      </div>
      <p class="field-error" id="errRegEmail"></p>

      <div class="row-2">
        <div class="field-group">
          <label class="field-label" for="regPass">Contraseña</label>
          <input id="regPass" type="password" placeholder="Mín. 8 caracteres" autocomplete="new-password" />
        </div>
        <div class="field-group">
          <label class="field-label" for="regPass2">Confirmar</label>
          <input id="regPass2" type="password" placeholder="Repite" autocomplete="new-password" />
        </div>
      </div>
      <p class="field-error" id="errRegPass"></p>

      <div class="checkbox-row">
        <input type="checkbox" id="regTerms" />
        <label for="regTerms">Acepto los términos de servicio y la política de privacidad.</label>
      </div>
      <p class="field-error" id="errRegTerms"></p>

      <button id="btnRegSubmit" class="btn-primary" type="submit">Crear cuenta</button>
      <button class="btn-link" type="button" data-back>← Volver</button>
    </form>

    <!-- Vista: cargando (skeleton) -->
    <div id="viewLoading" class="loading" role="status" aria-live="polite" hidden>
      <p class="loading-msg"><span class="pulse"></span><span id="loadingText">Verificando tu cuenta</span></p>
      <div class="skel"></div>
      <div class="skel s2"></div>
      <div class="skel s3"></div>
    </div>

    <p class="error" id="error" role="alert"></p>
    <a class="back" id="backToBiz" href="#" hidden>Cancelar y volver al negocio</a>
  </main>
</body>

</html>
