<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Tarjeta de Fidelización</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Tipografías: Sora, Inter, IBM Plex Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600;700&display=swap"
    rel="stylesheet">

  <!-- QR con estilo de puntos (defer: no bloquea el primer render en redes lentas) -->
  <script defer src="https://cdn.jsdelivr.net/npm/qr-code-styling@1.6.0-rc.1/lib/qr-code-styling.js"></script>

  <script type="module" src="/js/fidelizacion.js/fidelizacion.js"></script>
  <style>
    :root {
      --brand-vivid: #6b7280;
      /* gris neutro mientras carga, no morado */
      --brand-glow: #4b5563;
      --brand-dark: #101114;
      --bg-base: #050505;
    }

    * {
      -webkit-tap-highlight-color: transparent;
      box-sizing: border-box;
    }

    html {
      -webkit-text-size-adjust: 100%;
      overflow-x: hidden;
    }

    /* ---------- Scrollbar oscuro en toda la página (nunca blanco) ---------- */
    * {
      scrollbar-width: thin;
      scrollbar-color: rgba(255, 255, 255, 0.18) rgba(255, 255, 255, 0.03);
    }

    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }

    ::-webkit-scrollbar-track {
      background: rgba(255, 255, 255, 0.03);
    }

    ::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.18);
      border-radius: 999px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: rgba(255, 255, 255, 0.3);
    }

    body {
      background:
        radial-gradient(1000px 600px at 50% -10%, color-mix(in srgb, var(--brand-vivid) 10%, transparent) 0%, transparent 65%),
        radial-gradient(800px 500px at 50% 110%, color-mix(in srgb, var(--brand-glow) 8%, transparent) 0%, transparent 70%),
        var(--bg-base);
      font-family: 'Inter', sans-serif;
      padding-left: max(1rem, env(safe-area-inset-left));
      padding-right: max(1rem, env(safe-area-inset-right));
      padding-top: max(1.5rem, env(safe-area-inset-top));
      padding-bottom: max(2rem, env(safe-area-inset-bottom));
      min-height: 100dvh;
      overflow-x: hidden;
      transition: background 0.5s ease;
    }

    @media (max-width: 360px) {
      body {
        padding-left: 0.75rem;
        padding-right: 0.75rem;
      }
    }

    .font-display {
      font-family: 'Sora', sans-serif;
    }

    .font-mono-card {
      font-family: 'IBM Plex Mono', monospace;
    }

    /* ---------- Escena 3D + Tilt + Flip ---------- */
    .card-scene {
      perspective: 1200px;
    }

    .card-tilt {
      transform-style: preserve-3d;
      transition: transform 0.15s cubic-bezier(0.2, 0, 0, 1);
      will-change: transform;
    }

    .card-flipper {
      position: relative;
      display: grid;
      transform-style: preserve-3d;
      transition: transform .62s cubic-bezier(.34, 1.56, .64, 1);
      cursor: pointer;
      will-change: transform;
    }

    .card-flipper.is-flipped {
      transform: rotateY(180deg);
    }

    .card-face {
      grid-area: 1 / 1;
      width: 100%;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
    }

    .card-face.card-back {
      transform: rotateY(180deg);
    }

    .card {
      position: relative;
      border-radius: clamp(20px, 4.5vw, 24px);
      background:
        radial-gradient(130% 90% at 50% 0%, color-mix(in srgb, var(--brand-vivid) 28%, transparent) 0%, transparent 65%),
        linear-gradient(170deg, #12141a 0%, #0a0b0e 60%, #060709 100%);
      box-shadow:
        0 0 0 1px color-mix(in srgb, var(--brand-vivid) 38%, rgba(255, 255, 255, 0.12)),
        0 20px 50px -15px color-mix(in srgb, var(--brand-vivid) 25%, transparent),
        0 30px 70px -20px rgba(0, 0, 0, 0.95);
      overflow: hidden;
    }

    .card::before {
      content: "";
      position: absolute;
      inset: 0;
      background-image: repeating-linear-gradient(45deg,
          rgba(255, 255, 255, 0.02) 0px,
          rgba(255, 255, 255, 0.02) 1px,
          transparent 1px,
          transparent 7px);
      pointer-events: none;
    }

    .card::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: clamp(20px, 4.5vw, 24px);
      padding: 1.5px;
      background: linear-gradient(135deg,
          color-mix(in srgb, var(--brand-vivid) 80%, white 20%) 0%,
          rgba(255, 255, 255, 0.1) 40%,
          transparent 60%,
          color-mix(in srgb, var(--brand-vivid) 50%, transparent) 100%);
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      pointer-events: none;
    }

    .card-sheen {
      position: absolute;
      inset: 0;
      border-radius: clamp(20px, 4.5vw, 24px);
      background: radial-gradient(circle 280px at var(--mx, 50%) var(--my, 20%), rgba(255, 255, 255, 0.12), transparent 70%);
      opacity: 0;
      transition: opacity 0.3s ease;
      pointer-events: none;
    }

    .card-scene:hover .card-sheen,
    .card-scene.is-active .card-sheen {
      opacity: 1;
    }

    @media (hover: none) {
      .card-sheen {
        opacity: 0.3;
      }
    }

    .fluid-eyebrow {
      font-size: clamp(8.5px, 2.2vw, 9.5px);
      letter-spacing: 0.28em;
    }

    .fluid-store {
      font-size: clamp(17px, 4.5vw, 20px);
      letter-spacing: 0.02em;
    }

    .fluid-name {
      font-size: clamp(15px, 4.2vw, 18px);
      letter-spacing: 0.06em;
    }

    .fluid-points {
      font-size: clamp(42px, 12vw, 58px);
    }

    .fluid-code {
      font-size: clamp(10px, 2.6vw, 11px);
    }

    .logo-avatar {
      width: clamp(66px, 18vw, 78px);
      height: clamp(66px, 18vw, 78px);
      border-radius: 9999px;
      padding: 2.5px;
      background: linear-gradient(135deg, color-mix(in srgb, var(--brand-vivid) 100%, white 20%), color-mix(in srgb, var(--brand-dark) 40%, transparent));
      box-shadow:
        0 0 20px color-mix(in srgb, var(--brand-vivid) 45%, transparent),
        0 10px 20px rgba(0, 0, 0, 0.8);
    }

    .logo-avatar-inner {
      width: 100%;
      height: 100%;
      border-radius: 9999px;
      overflow: hidden;
      background: #08090b;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .perforation {
      position: relative;
      height: 1px;
      background-image: repeating-linear-gradient(90deg, color-mix(in srgb, var(--brand-vivid) 30%, rgba(255, 255, 255, 0.15)) 0 6px, transparent 6px 14px);
    }

    .perforation::before,
    .perforation::after {
      content: "";
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 20px;
      height: 20px;
      border-radius: 9999px;
      background: var(--bg-base);
      box-shadow: inset 0 0 5px rgba(0, 0, 0, 0.9);
    }

    .perforation::before {
      left: -11px;
    }

    .perforation::after {
      right: -11px;
    }

    .points-glow {
      background: linear-gradient(180deg, #ffffff 30%, color-mix(in srgb, var(--brand-vivid) 80%, white 20%) 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      letter-spacing: -0.03em;
      filter: drop-shadow(0 4px 15px color-mix(in srgb, var(--brand-vivid) 35%, transparent));
    }

    .chip-tier {
      /* Antes usaba backdrop-filter: blur(); es de las propiedades más
         caras para GPUs de gama baja, así que se reemplaza por un fondo
         sólido semitransparente que da el mismo look sin el costo. */
      background: color-mix(in srgb, var(--brand-vivid) 22%, rgba(10, 10, 12, 0.92));
      border: 1px solid color-mix(in srgb, var(--brand-vivid) 50%, transparent);
      color: color-mix(in srgb, var(--brand-vivid) 90%, white 10%);
      box-shadow: 0 0 12px color-mix(in srgb, var(--brand-vivid) 20%, transparent);
      letter-spacing: 0.2em;
    }

    .barcode-svg {
      color: color-mix(in srgb, var(--brand-vivid) 60%, rgba(255, 255, 255, 0.4));
      width: 100%;
      max-width: 220px;
      height: 28px;
    }

    @keyframes shimmer {
      0% {
        background-position: -400px 0
      }

      100% {
        background-position: 400px 0
      }
    }

    .skeleton {
      background: linear-gradient(90deg, #121418 25%, #1c1f26 37%, #121418 63%);
      background-size: 800px 100%;
      animation: shimmer 1.6s infinite linear;
    }

    .flip-hint-icon {
      position: absolute;
      top: 16px;
      right: 16px;
      width: 24px;
      height: 24px;
      color: rgba(255, 255, 255, .45);
      z-index: 5;
      animation: flipPulse 2.4s ease-in-out infinite;
      pointer-events: none;
    }

    .flip-hint-icon svg {
      width: 100%;
      height: 100%;
    }

    @keyframes flipPulse {

      0%,
      100% {
        opacity: .35;
        transform: scale(1);
      }

      50% {
        opacity: .85;
        transform: scale(1.1) rotate(20deg);
      }
    }

    .flip-hint-text {
      letter-spacing: 0.2em;
    }

    /* ---------- Reverso: QR estilo puntos (IG) ---------- */
    .qr-frame {
      background: #ffffff;
      border-radius: 18px;
      padding: clamp(12px, 4%, 20px);
      box-shadow:
        0 0 0 1px color-mix(in srgb, var(--brand-vivid) 45%, transparent),
        0 20px 45px -15px color-mix(in srgb, var(--brand-vivid) 45%, transparent);
      /* Proporcional al ancho de la tarjeta (no del viewport), pero
         con un tope más generoso para que en PC no se vea diminuto. */
      width: clamp(180px, 58%, 260px);
      aspect-ratio: 1 / 1;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #qrCanvas {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #qrCanvas canvas {
      display: block;
      width: 100%;
      height: 100%;
      border-radius: 10px;
    }

    #qrFallbackImg {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }

    .qr-skeleton-box {
      width: 100%;
      height: 100%;
      border-radius: 10px;
    }

    /* ---------- Tarjetas de Recompensa ---------- */
    .reward-card {
      position: relative;
      /* Antes llevaba backdrop-filter: blur(); se quita por rendimiento
         en equipos de gama baja y se compensa con un fondo un poco más
         opaco para mantener la profundidad visual. */
      background: linear-gradient(180deg, rgba(20, 22, 28, 0.92) 0%, rgba(9, 10, 13, 0.98) 100%);
      border: 1px solid rgba(255, 255, 255, 0.08);
      transition: transform 0.2s cubic-bezier(0.16, 1, 0.3, 1), border-color 0.2s ease, box-shadow 0.2s ease;
      overflow: hidden;
      min-width: 0;
    }

    .reward-card::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 2px;
      background: linear-gradient(90deg, transparent, color-mix(in srgb, var(--brand-vivid) 80%, transparent), transparent);
    }

    .reward-card:hover {
      transform: translateY(-3px);
      border-color: color-mix(in srgb, var(--brand-vivid) 45%, transparent);
      box-shadow: 0 12px 25px -8px color-mix(in srgb, var(--brand-vivid) 20%, transparent);
    }

    /* Evita que los nombres largos ("Arroz chuafa") se partan en
       columnas angostas: se recortan con puntos suspensivos en vez
       de romperse letra a letra. */
    .reward-card p,
    .reward-card span,
    .reward-card h3 {
      overflow-wrap: normal;
      word-break: normal;
      hyphens: none;
    }

    .reward-icon {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: color-mix(in srgb, var(--brand-vivid) 12%, rgba(255, 255, 255, 0.03));
      border: 1px solid color-mix(in srgb, var(--brand-vivid) 25%, transparent);
    }

    .btn-redeem {
      background: linear-gradient(135deg, var(--brand-vivid) 0%, color-mix(in srgb, var(--brand-vivid) 80%, black 20%) 100%);
      color: #ffffff;
      box-shadow: 0 4px 15px color-mix(in srgb, var(--brand-vivid) 35%, transparent);
      transition: all 0.2s ease;
    }

    .btn-redeem:not(:disabled):hover {
      filter: brightness(1.15);
      box-shadow: 0 6px 20px color-mix(in srgb, var(--brand-vivid) 50%, transparent);
      transform: translateY(-1px);
    }

    .btn-redeem:disabled {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.05);
      color: rgba(255, 255, 255, 0.25);
      box-shadow: none;
      cursor: not-allowed;
    }

    .hp-section {
      border-radius: 20px;
      background: linear-gradient(180deg, rgba(18, 20, 26, .55) 0%, rgba(10, 11, 14, .55) 100%);
      border: 1px solid rgba(255, 255, 255, .07);
      overflow: hidden;
    }

    .hp-toggle-btn {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 16px;
      background: none;
      border: none;
      cursor: pointer;
    }

    .hp-count-badge {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 11px;
      font-weight: 700;
      color: color-mix(in srgb, var(--brand-vivid) 90%, white 10%);
      background: color-mix(in srgb, var(--brand-vivid) 15%, transparent);
      border: 1px solid color-mix(in srgb, var(--brand-vivid) 40%, transparent);
      padding: 2px 8px;
      border-radius: 999px;
      min-width: 22px;
      text-align: center;
    }

    .hp-chevron {
      width: 16px;
      height: 16px;
      color: rgba(255, 255, 255, .4);
      transition: transform .28s cubic-bezier(.34, 1.56, .64, 1);
    }

    .hp-section.open .hp-chevron {
      transform: rotate(180deg);
    }

    /* Técnica de grid-template-rows en vez de max-height: anima al
       tamaño real del contenido (no a un valor arbitrario como 2000px),
       así se siente instantáneo y fluido incluso en equipos lentos. */
    .hp-body {
      display: grid;
      grid-template-rows: 0fr;
      transition: grid-template-rows .32s cubic-bezier(.4, 0, .2, 1), padding .32s ease;
      padding: 0 14px;
    }

    .hp-body-inner {
      overflow: hidden;
      min-height: 0;
    }

    .hp-section.open .hp-body {
      grid-template-rows: 1fr;
      padding: 0 14px 14px;
    }

    .hp-filtros {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 10px;
      margin-bottom: 4px;
      scroll-behavior: smooth;
      -webkit-overflow-scrolling: touch;
      /* Se puede seguir deslizando, pero sin barra visible */
      scrollbar-width: none;
      -ms-overflow-style: none;
    }

    .hp-filtros::-webkit-scrollbar {
      display: none;
    }

    .hp-chip {
      flex-shrink: 0;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 10.5px;
      font-weight: 700;
      padding: 6px 11px;
      border-radius: 999px;
      background: rgba(255, 255, 255, .04);
      border: 1px solid rgba(255, 255, 255, .08);
      color: rgba(255, 255, 255, .5);
      cursor: pointer;
      transition: all .15s ease;
      white-space: nowrap;
    }

    .hp-chip.active {
      background: color-mix(in srgb, var(--brand-vivid) 22%, transparent);
      border-color: color-mix(in srgb, var(--brand-vivid) 55%, transparent);
      color: #fff;
    }

    .hp-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 11px 14px;
      border-radius: 14px;
      background: rgba(18, 20, 26, .7);
      border: 1px solid rgba(255, 255, 255, .06);
    }

    .hp-concepto {
      font-size: 12.5px;
      color: #fff;
      font-weight: 600;
    }

    .hp-fecha {
      font-size: 10.5px;
      color: rgba(255, 255, 255, .35);
      font-family: 'IBM Plex Mono', monospace;
      margin-top: 2px;
    }

    .hp-puntos {
      font-family: 'IBM Plex Mono', monospace;
      font-weight: 700;
      font-size: 13px;
      white-space: nowrap;
    }

    .hp-puntos.positivo {
      color: #4ade80;
    }

    .hp-puntos.negativo {
      color: #fbbf24;
    }

    .hp-vermas-btn {
      width: 100%;
      margin-top: 10px;
      padding: 9px 0;
      border-radius: 12px;
      background: rgba(255, 255, 255, .04);
      border: 1px solid rgba(255, 255, 255, .09);
      color: rgba(255, 255, 255, .6);
      font-family: 'IBM Plex Mono', monospace;
      font-size: 11.5px;
      font-weight: 700;
      cursor: pointer;
      transition: all .15s ease;
    }

    .hp-vermas-btn:hover {
      background: rgba(255, 255, 255, .08);
      color: #fff;
    }

    .hp-vermas-btn:disabled {
      opacity: .4;
      cursor: not-allowed;
    }

    /* Encabezados de columna (Canjea tus puntos / Historial), para
       que ambas secciones compartan la misma jerarquía visual. */
    #colRecompensas>.flex,
    .hp-toggle-btn {
      min-height: 44px;
    }

    /* ==========================================================
       TABLET (768px – 1279px): la tarjeta queda fija a la
       izquierda; recompensas e historial forman una sola columna
       fluida a la derecha, uno debajo del otro. Nada de columnas
       fijas angostas que se aprieten.
       ========================================================== */
    @media (min-width: 768px) {
      body {
        padding-top: 2.5rem;
        padding-bottom: 2.5rem;
      }

      #appContent {
        width: 100%;
        max-width: 900px;
        display: grid;
        grid-template-columns: minmax(260px, 300px) minmax(0, 1fr);
        grid-template-areas:
          "carta recompensas"
          "carta historial";
        column-gap: 32px;
        row-gap: 28px;
        align-items: start;
      }

      #colCarta {
        grid-area: carta;
        position: sticky;
        top: 40px;
      }

      #colRecompensas {
        grid-area: recompensas;
        min-width: 0;
      }

      #colHistorial {
        grid-area: historial;
        min-width: 0;
      }

      .card-scene {
        margin-bottom: 0 !important;
      }

      .card-scene .card {
        max-width: 300px;
        margin: 0 auto;
      }

      #rewardsGrid {
        grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
        gap: 14px;
      }

      #errorBox {
        grid-column: 1 / -1;
      }
    }

    /* ==========================================================
       DESKTOP (≥1280px): se mantiene la misma idea de 2 columnas
       que en tablet -- tarjeta fija a la izquierda, y "Canjea tus
       puntos" arriba de "Historial de puntos" en una sola columna
       a la derecha. Nunca 3 columnas: en pantallas grandes 3
       columnas separadas dejan el historial como una tira angosta
       y se ve mal, así que en vez de eso todo respira más ancho.
       ========================================================== */
    @media (min-width: 1280px) {

      html,
      body {
        height: 100%;
      }

      body {
        display: flex;
        align-items: center;
        justify-content: center;
      }

      #appContent {
        width: 100%;
        max-width: min(1180px, 88vw);
        grid-template-columns: minmax(340px, 400px) minmax(0, 1fr);
        grid-template-areas:
          "carta recompensas"
          "carta historial";
        column-gap: 56px;
        row-gap: 36px;
      }

      #colCarta {
        grid-area: carta;
        position: sticky;
        top: 40px;
      }

      #colRecompensas {
        grid-area: recompensas;
        min-width: 0;
      }

      #colHistorial {
        grid-area: historial;
        min-width: 0;
      }

      .card-scene .card {
        max-width: 400px;
      }

      #rewardsGrid {
        grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
        gap: 18px;
      }

      .hp-section {
        max-height: calc(100vh - 220px);
        display: flex;
        flex-direction: column;
      }

      /* En PC, el límite de alto y el scroll interno van en el
         wrapper interno, no en .hp-body (que ahora solo controla la
         animación de expandir/colapsar vía grid-template-rows). */
      .hp-body-inner {
        max-height: calc(100vh - 320px);
        overflow-y: auto;
      }
    }

    @media (min-width: 1680px) {
      #appContent {
        max-width: min(1320px, 82vw);
        column-gap: 64px;
      }

      .card-scene .card {
        max-width: 420px;
      }

      #rewardsGrid {
        grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
        gap: 20px;
      }
    }

    /* Respeta "reducir movimiento" del sistema y sirve además como
       colchón extra de rendimiento en equipos muy limitados. */
    @media (prefers-reduced-motion: reduce) {

      .skeleton,
      .flip-hint-icon,
      .card-flipper,
      .card-tilt,
      .hp-body,
      .hp-chevron,
      .reward-card,
      .btn-redeem,
      .hp-chip {
        animation: none !important;
        transition: none !important;
      }
    }
  </style>
</head>

<body class="min-h-screen text-white sm:py-6">

  <!-- ============ SKELETON DE PANTALLA COMPLETA ============ -->
  <div id="fullSkeleton"
    class="fixed inset-0 z-50 flex flex-col items-center sm:justify-center overflow-y-auto bg-[#060709] px-4 py-10">
    <div
      class="w-full max-w-md mx-auto md:max-w-3xl md:grid md:grid-cols-[300px_1fr] md:gap-8 md:items-start xl:max-w-[1180px] xl:grid-cols-[400px_1fr] xl:gap-14">

      <!-- Skeleton de la tarjeta -->
      <div class="rounded-[24px] border border-white/5 bg-[#0d0e12] flex flex-col items-center px-6 py-8 mb-8 md:mb-0">
        <div class="skeleton w-[74px] h-[74px] rounded-full"></div>
        <div class="skeleton h-4 w-32 rounded mt-4"></div>
        <div class="skeleton h-3 w-16 rounded-full mt-3"></div>

        <div class="w-full h-px bg-white/5 my-6"></div>

        <div class="skeleton h-3 w-24 rounded mb-2"></div>
        <div class="skeleton h-5 w-36 rounded mb-6"></div>
        <div class="skeleton h-3 w-28 rounded mb-2"></div>
        <div class="skeleton h-12 w-28 rounded"></div>

        <div class="w-full h-px bg-white/5 my-6"></div>

        <div class="skeleton h-7 w-full max-w-[220px] rounded"></div>
      </div>

      <div>
        <!-- Skeleton del título de recompensas -->
        <div class="flex items-center justify-between mb-3.5 px-1">
          <div class="skeleton h-3.5 w-28 rounded"></div>
          <div class="skeleton h-3 w-12 rounded"></div>
        </div>

        <!-- Skeleton del grid de recompensas -->
        <div class="grid grid-cols-2 xl:grid-cols-3 gap-2.5 sm:gap-3">
          <div class="rounded-2xl border border-white/5 bg-[#0d0e12] p-3.5 h-[132px]">
            <div class="skeleton w-10 h-10 rounded-xl mb-2.5"></div>
            <div class="skeleton h-3 w-full rounded mb-1.5"></div>
            <div class="skeleton h-3 w-2/3 rounded"></div>
          </div>
          <div class="rounded-2xl border border-white/5 bg-[#0d0e12] p-3.5 h-[132px]">
            <div class="skeleton w-10 h-10 rounded-xl mb-2.5"></div>
            <div class="skeleton h-3 w-full rounded mb-1.5"></div>
            <div class="skeleton h-3 w-2/3 rounded"></div>
          </div>
          <div class="rounded-2xl border border-white/5 bg-[#0d0e12] p-3.5 h-[132px]">
            <div class="skeleton w-10 h-10 rounded-xl mb-2.5"></div>
            <div class="skeleton h-3 w-full rounded mb-1.5"></div>
            <div class="skeleton h-3 w-2/3 rounded"></div>
          </div>
          <div class="rounded-2xl border border-white/5 bg-[#0d0e12] p-3.5 h-[132px]">
            <div class="skeleton w-10 h-10 rounded-xl mb-2.5"></div>
            <div class="skeleton h-3 w-full rounded mb-1.5"></div>
            <div class="skeleton h-3 w-2/3 rounded"></div>
          </div>
        </div>
      </div>

    </div>
  </div>
  <div id="appContent" class="w-full max-w-md mx-auto"
    style="opacity:0; pointer-events:none; transition: opacity .5s ease;">

    <!-- ============ COLUMNA 1 (desktop): TARJETA DE FIDELIZACIÓN ============ -->
    <div id="colCarta">
      <div class="card-scene mb-8 sm:mb-10">
        <div id="cardTilt" class="card-tilt">
          <div id="cardFlipper" class="card-flipper" role="button" aria-label="Tocar para ver código QR" tabindex="0">

            <!-- ===== FRENTE ===== -->
            <div class="card card-face flex flex-col" style="padding: clamp(22px, 6vw, 30px) clamp(20px, 5.5vw, 26px);">
              <div class="card-sheen"></div>

              <div class="flip-hint-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                  stroke-linejoin="round">
                  <path d="M21 12a9 9 0 1 1-3-6.7" />
                  <path d="M21 3v6h-6" />
                </svg>
              </div>

              <div class="relative z-10 flex flex-col items-center text-center pb-5">
                <div id="logoWrap" class="logo-avatar">
                  <div class="logo-avatar-inner">
                    <img id="logoImg" alt="Logo" class="w-full h-full object-cover hidden" crossorigin="anonymous">
                    <div id="logoSkeleton" class="w-full h-full skeleton"></div>
                  </div>
                </div>

                <p id="storeName"
                  class="font-display font-semibold fluid-store text-white leading-tight tracking-wide mt-3.5 max-w-[85%] truncate uppercase">
                  <span class="skeleton inline-block h-4 w-28 rounded"></span>
                </p>
                <p class="fluid-eyebrow uppercase text-white/40 mt-1 font-mono-card">Tarjeta de Fidelización</p>

                <span id="tierBadge" class="chip-tier fluid-eyebrow font-bold uppercase px-3.5 py-1 rounded-full mt-3">
                  <span class="skeleton inline-block h-3 w-12 rounded"></span>
                </span>
              </div>

              <div class="perforation"></div>

              <div class="relative z-10 flex flex-col items-center text-center py-6">
                <p class="fluid-eyebrow uppercase text-white/40 mb-1 font-mono-card">Cliente Frecuente</p>
                <p id="clientName"
                  class="font-mono-card fluid-name text-white font-medium tracking-wider max-w-full truncate px-2 uppercase">
                  <span class="skeleton inline-block h-5 w-36 rounded"></span>
                </p>

                <p class="fluid-eyebrow uppercase text-white/40 mt-6 mb-1 font-mono-card">Puntos Acumulados</p>
                <p id="clientPoints" class="points-glow font-mono-card fluid-points font-bold leading-none">
                  <span class="skeleton inline-block h-10 w-24 rounded"></span>
                </p>
              </div>

              <div class="perforation"></div>

              <div class="relative z-10 flex flex-col items-center pt-5" style="display: none;">
                <svg id="barcodeSvg" class="barcode-svg hidden" preserveAspectRatio="none"></svg>
                <div id="barcodeSkeleton" class="skeleton rounded w-full max-w-[220px] h-[28px]"></div>
                <p id="clientCode" class="font-mono-card fluid-code text-white/50 tracking-[0.25em] mt-2.5">
                  <span class="skeleton inline-block h-3 w-24 rounded mt-1"></span>
                </p>
                <p class="flip-hint-text fluid-eyebrow text-white/25 mt-4 uppercase">Toca la tarjeta · Ver código QR</p>
              </div>
            </div>

            <!-- ===== REVERSO: QR ===== -->
            <div class="card card-face card-back flex flex-col items-center justify-center text-center"
              style="padding: clamp(22px, 6vw, 30px) clamp(20px, 5.5vw, 26px);">
              <div class="card-sheen"></div>

              <p class="fluid-eyebrow uppercase text-white/40 font-mono-card mb-5 relative z-10">Tu código QR</p>

              <div class="qr-frame relative z-10">
                <div id="qrCanvas" class="hidden"></div>
                <div id="qrSkeleton" class="skeleton qr-skeleton-box"></div>
              </div>

              <p id="qrCodeText" class="font-mono-card fluid-code text-white/50 tracking-[0.25em] mt-5 relative z-10">
                <span class="skeleton inline-block h-3 w-24 rounded"></span>
              </p>

              <p class="fluid-eyebrow text-white/25 mt-6 uppercase relative z-10">Toca para volver</p>
            </div>

          </div>
        </div>
      </div>
    </div>

    <!-- ============ COLUMNA 2 (desktop): PREMIOS / RECOMPENSAS ============ -->
    <div id="colRecompensas">
      <div class="flex items-center justify-between mb-3.5 px-1">
        <h2
          class="font-display font-semibold text-[14px] sm:text-base tracking-wide text-white uppercase flex items-center gap-2">
          <span id="titleDot" class="w-2 h-2 rounded-full shrink-0"
            style="background: var(--brand-vivid); box-shadow: 0 0 10px var(--brand-vivid);"></span>
          Canjea tus puntos
        </h2>
        <span id="pointsHint" class="text-[11px] sm:text-xs text-white/50 font-mono-card">-- pts</span>
      </div>

      <!-- Filtros de categoría: se rellenan solo si los productos traen "categoria" en la DB -->
      <div id="rewardsFiltros" class="hp-filtros"></div>

      <div id="rewardsGrid" class="grid grid-cols-2 gap-2.5 sm:gap-3">
        <!-- Se llenan dinámicamente -->
      </div>
    </div>

    <!-- ============ COLUMNA 3 (desktop): HISTORIAL ============ -->
    <div id="colHistorial">
      <div class="hp-section mt-8 md:mt-0">
        <button id="hpToggleBtn" type="button" class="hp-toggle-btn">
          <span class="flex items-center gap-2">
            <span class="w-2 h-2 rounded-full shrink-0" style="background: var(--brand-vivid);"></span>
            <span class="font-display font-semibold text-[14px] sm:text-base tracking-wide text-white uppercase">Historial de puntos</span>
          </span>
          <span class="flex items-center gap-2">
            <span id="hpCountBadge" class="hp-count-badge">0</span>
            <svg id="hpChevron" class="hp-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
          </span>
        </button>

        <div id="hpBody" class="hp-body">
          <div class="hp-body-inner">
            <div id="hpFiltros" class="hp-filtros">
              <button type="button" class="hp-chip active" data-filtro="todos">Todos</button>
              <button type="button" class="hp-chip" data-filtro="ganado">🎉 Ganados</button>
              <button type="button" class="hp-chip" data-filtro="canje">🎁 Canjes</button>
              <button type="button" class="hp-chip" data-filtro="devolucion">↩️ Devueltos</button>
            </div>

            <div id="historialPuntosList" class="flex flex-col gap-2"></div>

            <button id="hpVerMasBtn" type="button" class="hp-vermas-btn hidden">Ver más</button>
          </div>
        </div>
      </div>
    </div>

    <p id="errorBox"
      class="hidden mt-6 text-xs text-red-400/80 bg-red-500/5 border border-red-500/20 rounded-xl p-3 text-center"></p>
  </div>

</body>

</html>
