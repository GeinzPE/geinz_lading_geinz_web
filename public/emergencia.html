<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <title>Salud y Seguridad | Geinz</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
        rel="stylesheet" />

    <style>
        :root {
            --primary: #8800F2;
            --primary-glow: rgba(136, 0, 242, .35);
            --bg: #050505;
            --card-bg: #111111;
            --border: rgba(255, 255, 255, .07);
            --text: #ffffff;
            --gray: #9c9ca5;
            --call: #007aff;
            --wssp: #25d366;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            background:
                radial-gradient(circle at top, rgba(136, 0, 242, .14), transparent 45%),
                #050505;
            color: var(--text);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* ─────────────────────────────
   GLOBAL SKELETON
───────────────────────────── */

        body.loading-page {
            overflow: hidden;
        }

        .page-skeleton {
            position: fixed;
            inset: 0;
            z-index: 99999;
            overflow: auto;
            background:
                radial-gradient(circle at top, rgba(136, 0, 242, .12), transparent 45%),
                #050505;
            animation: fadeIn .25s ease;
        }

        .page-skeleton.hide {
            opacity: 0;
            visibility: hidden;
            transition: .45s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        .sk-shimmer {
            position: relative;
            overflow: hidden;
            background: #171717;
        }

        .sk-shimmer::after {
            content: "";
            position: absolute;
            inset: 0;
            background:
                linear-gradient(90deg,
                    transparent 0%,
                    rgba(136, 0, 242, .08) 35%,
                    rgba(255, 255, 255, .04) 50%,
                    rgba(136, 0, 242, .08) 65%,
                    transparent 100%);
            transform: translateX(-100%);
            animation: shimmer 1.3s linear infinite;
        }

        @keyframes shimmer {
            100% {
                transform: translateX(100%);
            }
        }

        .sk-header {
            padding: 70px 20px 35px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .sk-title {
            width: min(400px, 80%);
            height: 54px;
            border-radius: 18px;
            margin-bottom: 18px;
        }

        .sk-subtitle {
            width: min(550px, 92%);
            height: 18px;
            border-radius: 12px;
        }

        .sk-controls {
            position: sticky;
            top: 0;
            z-index: 10;
            padding: 18px 20px 24px;
            background: rgba(5, 5, 5, .82);
            backdrop-filter: blur(22px);
            border-bottom: 1px solid rgba(255, 255, 255, .05);
        }

        .sk-search {
            max-width: 700px;
            height: 58px;
            border-radius: 22px;
            margin: auto auto 16px;
        }

        .sk-filters {
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .sk-filter {
            width: 120px;
            height: 40px;
            border-radius: 999px;
        }

        .sk-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 24px;
            max-width: 1200px;
            margin: auto;
            padding: 30px 20px 60px;
        }

        .sk-card {
            background: #111111;
            border: 1px solid rgba(255, 255, 255, .05);
            border-radius: 30px;
            padding: 24px;
        }

        .sk-card-header {
            display: flex;
            gap: 18px;
            margin-bottom: 20px;
        }

        .sk-logo {
            width: 82px;
            height: 82px;
            border-radius: 22px;
            flex-shrink: 0;
        }

        .sk-info {
            flex: 1;
        }

        .sk-tag {
            width: 90px;
            height: 22px;
            border-radius: 999px;
            margin-bottom: 12px;
        }

        .sk-name {
            width: 75%;
            height: 24px;
            border-radius: 10px;
        }

        .sk-line {
            height: 16px;
            border-radius: 10px;
            margin-bottom: 14px;
        }

        .sk-line.l1 {
            width: 100%;
        }

        .sk-line.l2 {
            width: 82%;
        }

        .sk-line.l3 {
            width: 92%;
        }

        .sk-actions {
            display: grid;
            grid-template-columns: 1fr 1fr 52px;
            gap: 10px;
            margin-top: 24px;
        }

        .sk-btn {
            height: 48px;
            border-radius: 16px;
        }

        /* ─────────────────────────────
   REAL CONTENT
───────────────────────────── */

        .container {
            max-width: 1200px;
            margin: auto;
            padding: 0 20px 60px;
            opacity: 0;
            transform: translateY(16px);
            transition: .5s ease;
        }

        .container.loaded {
            opacity: 1;
            transform: translateY(0);
        }

        header {
            text-align: center;
            padding: 60px 0 38px;
        }

        header h1 {
            font-size: 3rem;
            font-weight: 800;
            margin-bottom: 15px;
            letter-spacing: -1.5px;
            background: linear-gradient(135deg, #fff 0%, #C084FC 100%);
            -webkit-background-clip: text;
            color: transparent;
        }

        header p {
            color: var(--gray);
            max-width: 650px;
            margin: auto;
            line-height: 1.7;
        }

        /* ─────────────────────────────
   CONTROLS IMPROVED
───────────────────────────── */

        .controls {
            position: sticky;
            top: 0;
            z-index: 1000;
            padding: 16px 0 22px;
            margin-bottom: 30px;
            transition:
                padding .35s ease,
                background .35s ease,
                border-color .35s ease,
                transform .35s ease,
                backdrop-filter .35s ease;
        }

        .controls.scrolled {
            padding: 10px 0 14px;
            background: rgba(5, 5, 5, .78);
            backdrop-filter: blur(24px) saturate(180%);
            -webkit-backdrop-filter: blur(24px) saturate(180%);
            border-bottom: 1px solid rgba(255, 255, 255, .06);
        }

        .search-wrapper {
            max-width: 700px;
            margin: auto auto 16px;
            background: rgba(255, 255, 255, .05);
            border: 1px solid rgba(255, 255, 255, .08);
            border-radius: 24px;
            display: flex;
            align-items: center;
            padding: 5px 20px;
            transition: .3s ease;
        }

        .search-wrapper:focus-within {
            border-color: var(--primary);
            background: rgba(136, 0, 242, .08);
            box-shadow: 0 0 35px rgba(136, 0, 242, .18);
            transform: translateY(-1px);
        }

        .search-wrapper i {
            color: var(--primary);
            font-size: 1.1rem;
        }

        .search-wrapper input {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: white;
            padding: 14px 12px;
            font-size: 1rem;
        }

        .search-wrapper input::placeholder {
            color: #85858e;
        }

        .filter-group {
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .filter-btn {
            border: none;
            outline: none;
            cursor: pointer;
            padding: 10px 22px;
            border-radius: 999px;
            background: rgba(255, 255, 255, .05);
            border: 1px solid rgba(255, 255, 255, .07);
            color: white;
            font-weight: 700;
            transition: .28s ease;
        }

        .filter-btn:hover {
            transform: translateY(-2px);
            background: rgba(255, 255, 255, .08);
        }

        .filter-btn.active {
            background: var(--primary);
            border-color: var(--primary);
            box-shadow:
                0 10px 30px rgba(136, 0, 242, .25),
                inset 0 1px 0 rgba(255, 255, 255, .15);
        }

        .filter-btn:active {
            transform: scale(.95);
        }

        /* ─────────────────────────────
   GRID
───────────────────────────── */

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 24px;
        }

        /* ─────────────────────────────
   CARD
───────────────────────────── */

        .card {
            background:
                linear-gradient(180deg,
                    rgba(255, 255, 255, .02),
                    rgba(255, 255, 255, .01));
            border: 1px solid var(--border);
            border-radius: 30px;
            padding: 24px;
            position: relative;
            overflow: hidden;
            transition: .45s cubic-bezier(.2, .9, .4, 1);
            opacity: 0;
            transform: translateY(40px);
        }

        .card.visible {
            opacity: 1;
            transform: translateY(0);
        }

        .card::before {
            content: "";
            position: absolute;
            inset: 0;
            background:
                radial-gradient(circle at top right,
                    rgba(136, 0, 242, .12),
                    transparent 35%);
            opacity: 0;
            transition: .4s ease;
        }

        .card:hover {
            transform: translateY(-10px);
            border-color: rgba(136, 0, 242, .35);
            box-shadow:
                0 20px 45px rgba(0, 0, 0, .45),
                0 0 0 1px rgba(136, 0, 242, .06);
        }

        .card:hover::before {
            opacity: 1;
        }

        .card-header {
            display: flex;
            gap: 18px;
            align-items: center;
            margin-bottom: 22px;
        }

        .card-logo {
            width: 82px;
            height: 82px;
            border-radius: 22px;
            object-fit: cover;
            background: #1d1d1d;
            border: 1px solid rgba(255, 255, 255, .06);
        }

        .tag-category {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 5px 12px;
            border-radius: 999px;
            background: rgba(136, 0, 242, .12);
            color: #c084fc;
            font-size: .72rem;
            font-weight: 800;
            letter-spacing: .5px;
        }

        .card h3 {
            margin-top: 10px;
            font-size: 1.2rem;
            line-height: 1.3;
        }

        .card-info div {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            margin-bottom: 14px;
            color: var(--gray);
            line-height: 1.6;
            font-size: .92rem;
        }

        .card-info i {
            width: 18px;
            color: var(--primary);
            margin-top: 3px;
        }

        /* actions */

        .card-actions {
            display: grid;
            grid-template-columns: 1fr 1fr 54px;
            gap: 10px;
            margin-top: 26px;
        }

        .btn {
            height: 50px;
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            text-decoration: none;
            color: white;
            font-weight: 700;
            font-size: .86rem;
            transition: .25s ease;
            border: none;
        }

        .btn:hover {
            transform: translateY(-2px);
        }

        .btn:active {
            transform: scale(.96);
        }

        .btn-call {
            background: var(--call);
        }

        .btn-wssp {
            background: var(--wssp);
        }

        .btn-map {
            background: var(--primary);
            font-size: 1rem;
        }

        .btn[disabled] {
            opacity: 1;
            /* <- importante: evita que desaparezca */
            filter: grayscale(1);
            cursor: not-allowed;
            pointer-events: none;
        }

        /* empty */

        .empty-state {
            grid-column: 1/-1;
            text-align: center;
            padding: 80px 20px;
            border-radius: 40px;
            border: 1px dashed rgba(136, 0, 242, .4);
            background: rgba(255, 255, 255, .02);
        }

        .empty-state i {
            font-size: 3rem;
            margin-bottom: 18px;
            color: var(--primary);
        }

        .empty-state p {
            color: var(--gray);
        }

        /* mobile */

        @media(max-width:700px) {

            header h1 {
                font-size: 2rem;
            }

            header {
                padding: 42px 0 28px;
            }

            .grid,
            .sk-grid {
                grid-template-columns: 1fr;
                gap: 18px;
            }

            .card {
                border-radius: 26px;
                padding: 20px;
            }

            .card-actions {
                gap: 8px;
            }

            .btn {
                font-size: .76rem;
            }

            .filter-btn {
                padding: 8px 18px;
                font-size: .82rem;
            }

            .search-wrapper {
                border-radius: 20px;
            }
        }
    </style>
</head>

<body class="loading-page">

    <!-- SKELETON GLOBAL -->

    <div class="page-skeleton" id="pageSkeleton">

        <div class="sk-header">
            <div class="sk-title sk-shimmer"></div>
            <div class="sk-subtitle sk-shimmer"></div>
        </div>

        <div class="sk-controls">

            <div class="sk-search sk-shimmer"></div>

            <div class="sk-filters">
                <div class="sk-filter sk-shimmer"></div>
                <div class="sk-filter sk-shimmer"></div>
                <div class="sk-filter sk-shimmer"></div>
            </div>

        </div>

        <div class="sk-grid">

            <!-- repeat -->
            <div class="sk-card">
                <div class="sk-card-header">
                    <div class="sk-logo sk-shimmer"></div>
                    <div class="sk-info">
                        <div class="sk-tag sk-shimmer"></div>
                        <div class="sk-name sk-shimmer"></div>
                    </div>
                </div>

                <div class="sk-line l1 sk-shimmer"></div>
                <div class="sk-line l2 sk-shimmer"></div>
                <div class="sk-line l3 sk-shimmer"></div>

                <div class="sk-actions">
                    <div class="sk-btn sk-shimmer"></div>
                    <div class="sk-btn sk-shimmer"></div>
                    <div class="sk-btn sk-shimmer"></div>
                </div>
            </div>

            <div class="sk-card">
                <div class="sk-card-header">
                    <div class="sk-logo sk-shimmer"></div>
                    <div class="sk-info">
                        <div class="sk-tag sk-shimmer"></div>
                        <div class="sk-name sk-shimmer"></div>
                    </div>
                </div>

                <div class="sk-line l1 sk-shimmer"></div>
                <div class="sk-line l2 sk-shimmer"></div>
                <div class="sk-line l3 sk-shimmer"></div>

                <div class="sk-actions">
                    <div class="sk-btn sk-shimmer"></div>
                    <div class="sk-btn sk-shimmer"></div>
                    <div class="sk-btn sk-shimmer"></div>
                </div>
            </div>

            <div class="sk-card">
                <div class="sk-card-header">
                    <div class="sk-logo sk-shimmer"></div>
                    <div class="sk-info">
                        <div class="sk-tag sk-shimmer"></div>
                        <div class="sk-name sk-shimmer"></div>
                    </div>
                </div>

                <div class="sk-line l1 sk-shimmer"></div>
                <div class="sk-line l2 sk-shimmer"></div>
                <div class="sk-line l3 sk-shimmer"></div>

                <div class="sk-actions">
                    <div class="sk-btn sk-shimmer"></div>
                    <div class="sk-btn sk-shimmer"></div>
                    <div class="sk-btn sk-shimmer"></div>
                </div>
            </div>

        </div>

    </div>

    <!-- REAL CONTENT -->

    <div class="container">

        <header>
            <h1>Salud y Seguridad por Geinz</h1>
            <p>
                Directorio centralizado de servicios de emergencia en Barranca.
            </p>
        </header>

        <div class="controls" id="controls">

            <div class="search-wrapper">
                <i class="fas fa-shield-virus"></i>

                <input type="text" id="searchInput" placeholder="Busca por servicio, emergencia, policía, clínica..." />
            </div>

            <div class="filter-group">

                <button class="filter-btn active" data-filter="todos">
                    <i class="fas fa-th-large"></i>
                    Todos
                </button>

                <button class="filter-btn" data-filter="seguridad">
                    <i class="fas fa-shield-alt"></i>
                    Seguridad
                </button>

                <button class="filter-btn" data-filter="salud">
                    <i class="fas fa-heartbeat"></i>
                    Salud
                </button>

            </div>

        </div>

        <div class="grid" id="containerGrid"></div>

    </div>

    <script type="module">

        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";

        import {
            getFirestore,
            collection,
            getDocs
        } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBFV4SF7hMFifKz45GaBiu2xwTq7T_gxBQ",
            authDomain: "geinzworkapp.firebaseapp.com",
            projectId: "geinzworkapp",
            storageBucket: "geinzworkapp.appspot.com",
            messagingSenderId: "921389328767",
            appId: "1:921389328767:web:dc6fffc43a51444f5b524a"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const grid = document.getElementById("containerGrid");

        let listadoEmergencias = [];

        /* controls effect */

        const controls = document.getElementById("controls");

        window.addEventListener("scroll", () => {

            if (window.scrollY > 80) {
                controls.classList.add("scrolled");
            } else {
                controls.classList.remove("scrolled");
            }

        });

        /* fetch */

        async function fetchDatabase() {

            try {

                const colRef = collection(
                    db,
                    "Tiendas",
                    "salud_seguridad",
                    "barranca"
                );

                const snapshot = await getDocs(colRef);

                listadoEmergencias = snapshot.docs.map(doc => {

                    const d = doc.data();

                    return {

                        nombre: d.nombre || "Entidad",
                        categoria: d.categoria || "seguridad",
                        img: d.img || "",
                        direccion: d.ubicacion?.direccion || "Sin dirección",
                        referencia: d.ubicacion?.referencia || "Sin referencia",
                        lat: d.ubicacion?.latitud || -10.7539,
                        lng: d.ubicacion?.longitud || -77.7640,
                        llamada: d.numeros_contactos?.llamada?.[0] || "",
                        whatsapp: d.numeros_contactos?.whatsapp?.[0] || "",
                        tags: d.tag_eventos_emerge || []

                    };

                });

                renderCards(listadoEmergencias);

            } catch (error) {

                console.error(error);

                grid.innerHTML = `
            <div class="empty-state">
                <i class="fas fa-triangle-exclamation"></i>
                <p>Error cargando información.</p>
            </div>
        `;

            }

            /* hide skeleton */

            setTimeout(() => {

                document.getElementById("pageSkeleton")
                    .classList.add("hide");

                document.body.classList.remove("loading-page");

                document.querySelector(".container")
                    .classList.add("loaded");

            }, 700);

        }

        function renderCards(data) {

            if (!data.length) {

                grid.innerHTML = `
            <div class="empty-state">
                <i class="fas fa-search"></i>
                <p>No se encontraron resultados.</p>
            </div>
        `;

                return;
            }

            grid.innerHTML = data.map(item => {

                const hasCall = item.llamada !== "";
                const hasWhatsapp = item.whatsapp !== "";

                const mapUrl =
                    `https://www.google.com/maps?q=${item.lat},${item.lng}`;

                const img =
                    item.img ||
                    `https://ui-avatars.com/api/?name=${encodeURIComponent(item.nombre.charAt(0))}&background=8800F2&color=fff`;

                return `

        <div class="card reveal-card">

            <div class="card-header">

                <img
                    class="card-logo"
                    src="${img}"
                    alt="${item.nombre}"
                    loading="lazy"
                />

                <div>

                    <span class="tag-category">
                        <i class="fas ${item.categoria === "salud"
                        ? "fa-heartbeat"
                        : "fa-shield-alt"
                    }"></i>

                        ${item.categoria === "salud"
                        ? "SALUD"
                        : "SEGURIDAD"
                    }

                    </span>

                    <h3>${item.nombre}</h3>

                </div>

            </div>

            <div class="card-info">

                <div>
                    <i class="fas fa-location-dot"></i>
                    <span>${item.direccion}</span>
                </div>

                <div>
                    <i class="fas fa-circle-info"></i>
                    <span>${item.referencia}</span>
                </div>

            </div>

            <div class="card-actions">

                ${hasCall
                        ?
                        `
                    <a href="tel:${item.llamada}" class="btn btn-call">
                        <i class="fas fa-phone"></i>
                        Llamar
                    </a>
                    `
                        :
                        `
               <button class="btn btn-call" disabled>
    <i class="fas fa-ban"></i>
    No disponible
</button>
                    `
                    }

                ${hasWhatsapp
                        ?
                        `
                    <a
                        href="https://wa.me/${item.whatsapp.replace(/[^0-9]/g, '')}"
                        target="_blank"
                        class="btn btn-wssp"
                    >
                        <i class="fab fa-whatsapp"></i>
                        WhatsApp
                    </a>
                    `
                        :
                        `
                    <button class="btn btn-wssp" disabled>
                        No disponible
                    </button>
                    `
                    }

                <a
                    href="${mapUrl}"
                    target="_blank"
                    class="btn btn-map"
                >
                    <i class="fas fa-location-arrow"></i>
                </a>

            </div>

        </div>

        `;

            }).join("");

            revealCards();
        }

        /* reveal animation */

        function revealCards() {

            const cards = document.querySelectorAll(".reveal-card");

            const observer = new IntersectionObserver((entries) => {

                entries.forEach(entry => {

                    if (entry.isIntersecting) {

                        entry.target.classList.add("visible");

                    }

                });

            }, {
                threshold: .12
            });

            cards.forEach(card => observer.observe(card));
        }

        /* filters */

        function filterData() {

            const term =
                document.getElementById("searchInput")
                    .value
                    .toLowerCase()
                    .trim();

            const active =
                document.querySelector(".filter-btn.active")
                    .dataset
                    .filter;

            const filtered = listadoEmergencias.filter(item => {

                const matchSearch =
                    term === "" ||
                    item.nombre.toLowerCase().includes(term) ||
                    item.tags.some(tag =>
                        tag.toLowerCase().includes(term)
                    );

                const matchCategory =
                    active === "todos" ||
                    item.categoria === active;

                return matchSearch && matchCategory;

            });

            renderCards(filtered);

        }

        /* search */

        let debounce;

        document
            .getElementById("searchInput")
            .addEventListener("input", () => {

                clearTimeout(debounce);

                debounce = setTimeout(() => {

                    filterData();

                }, 220);

            });

        /* filters */

        document
            .querySelectorAll(".filter-btn")
            .forEach(btn => {

                btn.addEventListener("click", () => {

                    document
                        .querySelectorAll(".filter-btn")
                        .forEach(b => b.classList.remove("active"));

                    btn.classList.add("active");

                    filterData();

                });

            });

        fetchDatabase();

    </script>

</body>

</html>
