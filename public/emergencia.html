<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Salud y Seguridad | Geinz</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #8800F2;
            --primary-glow: rgba(136, 0, 242, 0.3);
            --bg: #050505;
            --card-bg: #111111;
            --border: rgba(255, 255, 255, 0.08);
            --text-white: #ffffff;
            --text-gray: #a1a1a6;
            --call-color: #007aff;
            --wssp-color: #25d366;
            --shimmer-light: rgba(255, 255, 255, 0.03);
            --shimmer-dark: rgba(255, 255, 255, 0.01);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }

        body {
            background-color: var(--bg);
            color: var(--text-white);
            background-image: radial-gradient(circle at 50% -20%, rgba(136, 0, 242, 0.15), transparent 60%);
            min-height: 100vh;
            padding-bottom: 50px;
            overflow-x: hidden;
        }

        .container { max-width: 1200px; margin: 0 auto; padding: 0 20px; }

        header { text-align: center; padding: 60px 0 40px; }
        header h1 { 
            font-size: 3rem; 
            font-weight: 800; 
            margin-bottom: 15px; 
            letter-spacing: -1.5px;
            background: linear-gradient(135deg, #FFFFFF 0%, #C084FC 100%);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
        }
        header p { color: var(--text-gray); font-size: 1.1rem; max-width: 600px; margin: 0 auto; }

        .controls { 
            position: sticky; 
            top: 0; 
            z-index: 1000; 
            margin-bottom: 40px;
            padding: 20px 0;
            background: rgba(5, 5, 5, 0.75);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .search-wrapper {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 5px 20px;
            display: flex;
            align-items: center;
            max-width: 700px;
            margin: 0 auto 15px;
            transition: all 0.3s ease;
        }
        .search-wrapper:focus-within { 
            border-color: var(--primary); 
            background: rgba(136, 0, 242, 0.08);
            box-shadow: 0 0 30px var(--primary-glow); 
        }
        .search-wrapper input {
            background: transparent; 
            border: none; 
            color: white; 
            flex: 1; 
            padding: 12px; 
            font-size: 1rem; 
            outline: none;
        }
        .search-wrapper input::placeholder { color: var(--text-gray); }
        .search-wrapper i { color: var(--primary); font-size: 1.2rem; }

        .filter-group { 
            display: flex; 
            justify-content: center; 
            gap: 12px; 
            flex-wrap: wrap; 
        }
        .filter-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text-white);
            padding: 8px 24px;
            border-radius: 100px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 600;
            transition: all 0.3s ease;
        }
        .filter-btn i { margin-right: 6px; }
        .filter-btn.active { 
            background: var(--primary); 
            border-color: var(--primary);
            box-shadow: 0 4px 15px var(--primary-glow);
        }
        .filter-btn:active { transform: scale(0.95); }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 25px;
        }

        /* Estilos de las tarjetas reales */
        .card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 30px;
            padding: 24px;
            transition: all 0.4s cubic-bezier(0.2, 0.9, 0.4, 1.1);
            animation: fadeInUp 0.5s ease backwards;
        }
        .card:hover { 
            transform: translateY(-8px); 
            border-color: var(--primary);
            box-shadow: 0 20px 35px -15px rgba(0,0,0,0.5);
        }
        .card-header { display: flex; gap: 20px; align-items: center; margin-bottom: 20px; }
        .card-logo { 
            width: 80px; 
            height: 80px; 
            border-radius: 20px; 
            object-fit: cover; 
            background: #1a1a2e;
        }
        
        .tag-category {
            background: rgba(136, 0, 242, 0.12);
            color: var(--primary);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.7rem;
            text-transform: uppercase;
            font-weight: 700;
            letter-spacing: 0.5px;
            display: inline-block;
        }

        .card-info div { 
            display: flex; 
            align-items: flex-start; 
            gap: 12px; 
            margin-bottom: 12px; 
            color: var(--text-gray); 
            font-size: 0.88rem; 
            line-height: 1.4;
        }
        .card-info i { color: var(--primary); width: 18px; text-align: center; margin-top: 2px; }

        .card-actions { 
            display: grid; 
            grid-template-columns: 1fr 1fr 50px; 
            gap: 10px; 
            margin-top: 25px; 
        }
        
        .btn {
            height: 48px;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            font-weight: 700;
            gap: 8px;
            transition: all 0.2s ease;
            color: white;
            font-size: 0.85rem;
        }
        .btn:active { transform: scale(0.96); }
        .btn-call { background: var(--call-color); }
        .btn-wssp { background: var(--wssp-color); }
        .btn-map { background: var(--primary); font-size: 1.1rem; }

        /* SKELETON LOADER MODERNO - Effect Shimmer */
        .skeleton-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 30px;
            padding: 24px;
            position: relative;
            overflow: hidden;
        }
        .skeleton-header {
            display: flex;
            gap: 20px;
            align-items: center;
            margin-bottom: 20px;
        }
        .skeleton-logo {
            width: 80px;
            height: 80px;
            border-radius: 20px;
            background: #1E1E2E;
        }
        .skeleton-text {
            flex: 1;
        }
        .skeleton-tag {
            width: 80px;
            height: 22px;
            background: #1E1E2E;
            border-radius: 20px;
            margin-bottom: 10px;
        }
        .skeleton-title {
            width: 140px;
            height: 24px;
            background: #1E1E2E;
            border-radius: 8px;
        }
        .skeleton-info {
            margin-top: 15px;
        }
        .skeleton-line {
            height: 18px;
            background: #1E1E2E;
            border-radius: 8px;
            margin-bottom: 12px;
        }
        .skeleton-line.short { width: 70%; }
        .skeleton-line.medium { width: 85%; }
        .skeleton-actions {
            display: grid;
            grid-template-columns: 1fr 1fr 50px;
            gap: 10px;
            margin-top: 25px;
        }
        .skeleton-btn {
            height: 48px;
            background: #1E1E2E;
            border-radius: 16px;
        }
        
        /* Efecto shimmer animado */
        .shimmer {
            position: relative;
            overflow: hidden;
        }
        .shimmer::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                90deg,
                transparent,
                rgba(136, 0, 242, 0.08),
                rgba(255, 255, 255, 0.03),
                transparent
            );
            animation: shimmerMove 1.2s infinite;
        }
        @keyframes shimmerMove {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }

        .skeleton-card.shimmer {
            animation: pulseOpacity 1.5s ease-in-out infinite;
        }
        @keyframes pulseOpacity {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }

        /* Animación de entrada para tarjetas */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(25px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Estado vacío */
        .empty-state {
            grid-column: 1 / -1;
            text-align: center;
            padding: 60px 20px;
            background: rgba(17, 17, 17, 0.8);
            border-radius: 40px;
            border: 1px dashed var(--primary);
        }
        .empty-state i {
            font-size: 3rem;
            color: var(--primary);
            margin-bottom: 15px;
            opacity: 0.7;
        }
        .empty-state p {
            color: var(--text-gray);
            font-size: 1rem;
        }

        @media (max-width: 600px) {
            header h1 { font-size: 2rem; }
            header { padding: 40px 0 25px; }
            .grid { grid-template-columns: 1fr; gap: 18px; }
            .card-actions { gap: 8px; }
            .btn { font-size: 0.75rem; gap: 5px; }
            .filter-btn { padding: 6px 18px; font-size: 0.8rem; }
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Salud y Seguridad</h1>
        <p>Directorio centralizado de servicios de emergencia en Barranca.</p>
    </header>

    <div class="controls">
        <div class="search-wrapper">
            <i class="fas fa-shield-virus"></i>
            <input type="text" placeholder="Busca por servicio, emergencia, policía, clínica..." id="searchInput">
        </div>
        <div class="filter-group">
            <button class="filter-btn active" data-filter="todos"><i class="fas fa-th-large"></i> Todos</button>
            <button class="filter-btn" data-filter="seguridad"><i class="fas fa-shield-alt"></i> Seguridad</button>
            <button class="filter-btn" data-filter="salud"><i class="fas fa-heartbeat"></i> Salud</button>
        </div>
    </div>

    <!-- Grid container -->
    <div class="grid" id="containerGrid"></div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { 
        getFirestore, 
        collection, 
        getDocs 
    } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyBFV4SF7hMFifKz45GaBiu2xwTq7T_gxBQ",
        authDomain: "geinzworkapp.firebaseapp.com",
        databaseURL: "https://geinzworkapp-default-rtdb.firebaseio.com",
        projectId: "geinzworkapp",
        storageBucket: "geinzworkapp.appspot.com",
        messagingSenderId: "921389328767",
        appId: "1:921389328767:web:dc6fffc43a51444f5b524a",
        measurementId: "G-38J7RJP8HK"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let listadoEmergencias = [];

    // Renderiza skeletons de carga modernos
    function renderSkeletons() {
        const grid = document.getElementById('containerGrid');
        const skeletonCount = 6;
        let skeletonsHTML = '';
        
        for (let i = 0; i < skeletonCount; i++) {
            skeletonsHTML += `
                <div class="skeleton-card shimmer">
                    <div class="skeleton-header">
                        <div class="skeleton-logo"></div>
                        <div class="skeleton-text">
                            <div class="skeleton-tag"></div>
                            <div class="skeleton-title"></div>
                        </div>
                    </div>
                    <div class="skeleton-info">
                        <div class="skeleton-line medium"></div>
                        <div class="skeleton-line short"></div>
                        <div class="skeleton-line" style="width: 90%;"></div>
                    </div>
                    <div class="skeleton-actions">
                        <div class="skeleton-btn"></div>
                        <div class="skeleton-btn"></div>
                        <div class="skeleton-btn"></div>
                    </div>
                </div>
            `;
        }
        grid.innerHTML = skeletonsHTML;
    }

    async function fetchDatabase() {
        const grid = document.getElementById('containerGrid');
        
        // Mostrar skeletons elegantes
        renderSkeletons();
        
        try {
            const colRef = collection(db, "Tiendas", "salud_seguridad", "barranca");
            const querySnapshot = await getDocs(colRef);
            
            if (querySnapshot.empty) {
                grid.innerHTML = `<div class="empty-state"><i class="fas fa-database"></i><p>No hay datos disponibles en esta categoría.</p></div>`;
                return;
            }
            
            listadoEmergencias = querySnapshot.docs.map(doc => {
                const d = doc.data();
                // Limpieza de números de contacto
                let phoneNumber = d.numeros_contactos?.llamada?.[0] || "";
                let whatsappNumber = d.numeros_contactos?.whatsapp?.[0] || "";
                
                // Remover espacios y caracteres no numéricos excepto +
                phoneNumber = phoneNumber.replace(/\s/g, '');
                whatsappNumber = whatsappNumber.replace(/\s/g, '');
                
                return {
                    id: doc.id,
                    nombre: d.nombre || "Entidad de Emergencia",
                    categoria: d.categoria || "seguridad",
                    img: d.img || "",
                    direccion: d.ubicacion?.direccion || "Dirección no especificada",
                    referencia: d.ubicacion?.referencia || "Sin referencia adicional",
                    lat: d.ubicacion?.latitud || -10.7539,
                    lng: d.ubicacion?.longitud || -77.7640,
                    llamada: phoneNumber,
                    whatsapp: whatsappNumber,
                    tags: d.tag_eventos_emerge || []
                };
            });

            renderCards(listadoEmergencias);
            
        } catch (error) {
            console.error("Error Firestore:", error);
            grid.innerHTML = `<div class="empty-state"><i class="fas fa-exclamation-triangle"></i><p>⚠️ Error al cargar los datos. Verifica tu conexión.</p></div>`;
        }
    }

    function renderCards(data) {
        const grid = document.getElementById('containerGrid');
        
        if (!data.length) {
            grid.innerHTML = `<div class="empty-state"><i class="fas fa-search"></i><p>No se encontraron resultados para tu búsqueda.</p></div>`;
            return;
        }
        
        grid.innerHTML = data.map((item, idx) => {
            // Manejar teléfono y whatsapp vacíos
            const callNumber = item.llamada ? item.llamada : "#";
            const whatsappNumber = item.whatsapp ? item.whatsapp : "";
            const hasCall = item.llamada && item.llamada !== "";
            const hasWhatsapp = item.whatsapp && item.whatsapp !== "";
            const mapUrl = `https://www.google.com/maps?q=${item.lat},${item.lng}`;
            
            // Imagen fallback
            const imgSrc = item.img || "https://ui-avatars.com/api/?name=" + encodeURIComponent(item.nombre.charAt(0)) + "&background=8800F2&color=fff&size=80&rounded=20";
            
            // Iconos por categoría
            const categoryIcon = item.categoria === "salud" ? "fa-heartbeat" : "fa-shield-alt";
            
            return `
                <div class="card" style="animation-delay: ${Math.min(idx * 0.03, 0.3)}s">
                    <div class="card-header">
                        <img src="${imgSrc}" class="card-logo" alt="${item.nombre}" loading="lazy" 
                             onerror="this.src='https://ui-avatars.com/api/?name=${encodeURIComponent(item.nombre.charAt(0))}&background=8800F2&color=fff&size=80&rounded=20'">
                        <div>
                            <span class="tag-category"><i class="${categoryIcon}" style="font-size:0.65rem; margin-right:4px;"></i> ${item.categoria === "salud" ? "SALUD" : "SEGURIDAD"}</span>
                            <h3 style="margin-top:8px; font-size:1.2rem;">${item.nombre}</h3>
                        </div>
                    </div>
                    <div class="card-info">
                        <div><i class="fas fa-map-marker-alt"></i> <span>${item.direccion}</span></div>
                        <div><i class="fas fa-info-circle"></i> <span>${item.referencia}</span></div>
                    </div>
                    <div class="card-actions">
                        ${hasCall ? `<a href="tel:${callNumber}" class="btn btn-call"><i class="fas fa-phone-alt"></i> Llamar</a>` : `<button class="btn btn-call" disabled style="opacity:0.4; cursor:not-allowed;"><i class="fas fa-phone-alt"></i> No disponible</button>`}
                        ${hasWhatsapp ? `<a href="https://wa.me/${whatsappNumber.replace(/[^0-9+]/g, '')}" target="_blank" class="btn btn-wssp"><i class="fab fa-whatsapp"></i> WhatsApp</a>` : `<button class="btn btn-wssp" disabled style="opacity:0.4; cursor:not-allowed;"><i class="fab fa-whatsapp"></i> No disponible</button>`}
                        <a href="${mapUrl}" target="_blank" class="btn btn-map"><i class="fas fa-location-arrow"></i></a>
                    </div>
                </div>
            `;
        }).join('');
    }

    // Filtro combinado: búsqueda + categoría
    function filterData() {
        const searchTerm = document.getElementById('searchInput').value.toLowerCase().trim();
        const activeCategory = document.querySelector('.filter-btn.active').dataset.filter;

        let filtered = listadoEmergencias.filter(item => {
            // Coincidencia por búsqueda: nombre o tags
            const matchesSearch = searchTerm === "" || 
                                 item.nombre.toLowerCase().includes(searchTerm) || 
                                 (item.tags && item.tags.some(tag => tag.toLowerCase().includes(searchTerm)));
            // Coincidencia por categoría
            const matchesCategory = activeCategory === 'todos' || item.categoria === activeCategory;
            return matchesSearch && matchesCategory;
        });

        renderCards(filtered);
    }

    // Debounce para búsqueda más fluida
    let debounceTimeout;
    document.getElementById('searchInput').addEventListener('input', (e) => {
        clearTimeout(debounceTimeout);
        debounceTimeout = setTimeout(() => {
            filterData();
        }, 250);
    });

    // Eventos de filtros con categoría
    document.querySelectorAll('.filter-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            filterData();
        });
    });

    // Iniciar carga
    fetchDatabase();
</script>
</body>
</html>
