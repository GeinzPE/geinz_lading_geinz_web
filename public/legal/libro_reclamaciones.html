<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Libro de Reclamaciones</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
    <script type="module" src="/legal/lega.js"></script>
    <style>
        :root {
            --dr: 139;
            --dg: 92;
            --db: 246;
        }

        * {
            box-sizing: border-box;
        }

        html {
            background: #030303;
        }

        body {
            margin: 0;
            font-family: 'Inter', system-ui, sans-serif;
            background: radial-gradient(circle at 20% 0%, rgba(var(--dr), var(--dg), var(--db), .05), #030303 40%);
            color: #f4f4f5;
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
        }

        /* ── Blobs decorativos (mismo lenguaje visual que el perfil) ── */
        .bg-blob {
            position: fixed;
            border-radius: 50%;
            filter: blur(90px);
            pointer-events: none;
            z-index: 0;
        }

        #blobUno {
            top: -8%;
            left: -10%;
            width: 340px;
            height: 340px;
            background: rgba(var(--dr), var(--dg), var(--db), .10);
        }

        #blobDos {
            bottom: -10%;
            right: -8%;
            width: 320px;
            height: 320px;
            background: rgba(var(--dr), var(--dg), var(--db), .08);
        }

        main,
        #loaderScreen,
        #notAvailableScreen {
            position: relative;
            z-index: 1;
        }

        .glass {
            background: rgba(255, 255, 255, .03);
            border: 1px solid rgba(255, 255, 255, .08);
            backdrop-filter: blur(16px);
        }

        .accent {
            color: rgb(var(--dr), var(--dg), var(--db));
        }

        .btn-primary {
            background: linear-gradient(135deg, rgb(var(--dr), var(--dg), var(--db)), rgba(var(--dr), var(--dg), var(--db), .7));
            box-shadow: 0 12px 30px -10px rgba(var(--dr), var(--dg), var(--db), .6);
            transition: transform .18s ease, box-shadow .18s ease, filter .18s ease;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            filter: brightness(1.05);
        }

        .btn-primary:active {
            transform: translateY(0);
        }

        .btn-primary:disabled {
            opacity: .55;
            cursor: not-allowed;
            transform: none;
        }

        /* ── Campos ── */
        .form-section {
            margin-bottom: 30px;
        }

        .form-section:last-child {
            margin-bottom: 0;
        }

        .form-section-title {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 14px;
            font-weight: 800;
            letter-spacing: .02em;
            color: #f4f4f5;
            margin-bottom: 18px;
            padding-bottom: 12px;
            border-bottom: 1px solid rgba(255, 255, 255, .08);
        }

        .form-section-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 18px;
        }

        @media (min-width:768px) {
            .form-section-grid {
                grid-template-columns: 1fr 1fr;
            }
        }

        .step-badge {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(var(--dr), var(--dg), var(--db), .15);
            border: 1px solid rgba(var(--dr), var(--dg), var(--db), .4);
            color: #fff;
            font-size: 13px;
            box-shadow: 0 0 16px -4px rgba(var(--dr), var(--dg), var(--db), .6);
        }

        .field-group {
            display: flex;
            flex-direction: column;
        }

        .field-label {
            font-size: 11.5px;
            font-weight: 700;
            letter-spacing: .05em;
            text-transform: uppercase;
            color: #9c9ca3;
            margin-bottom: 9px;
            display: flex;
            align-items: center;
            gap: 7px;
        }

        .field-label-icon {
            color: rgba(var(--dr), var(--dg), var(--db), .9);
            font-size: 12px;
        }

        .field-input,
        .field-select,
        .field-textarea {
            width: 100%;
            padding: 13px 16px;
            border-radius: 14px;
            background: #0b0b0d;
            border: 1px solid rgba(255, 255, 255, .1);
            color: #fff;
            font-size: 14px;
            font-family: inherit;
            transition: border-color .18s ease, background .18s ease, box-shadow .18s ease;
        }

        .field-input::placeholder,
        .field-textarea::placeholder {
            color: #6b6b72;
        }

        .field-select {
            appearance: none;
            -webkit-appearance: none;
            background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='14' viewBox='0 0 24 24' fill='none' stroke='%239c9ca3' stroke-width='2.5'><path d='M6 9l6 6 6-6'/></svg>");
            background-repeat: no-repeat;
            background-position: right 14px center;
            padding-right: 38px;
        }

        .field-select option {
            background: #0b0b0d;
            color: #fff;
        }

        .field-input:focus,
        .field-select:focus,
        .field-textarea:focus {
            outline: none;
            border-color: rgba(var(--dr), var(--dg), var(--db), .75);
            background: #121215;
            box-shadow: 0 0 0 4px rgba(var(--dr), var(--dg), var(--db), .14);
        }

        .field-textarea {
            resize: vertical;
            min-height: 96px;
        }

        /* ── Kill del autofill blanco/azul de Chrome ── */
        input:-webkit-autofill,
        input:-webkit-autofill:hover,
        input:-webkit-autofill:focus,
        input:-webkit-autofill:active {
            -webkit-box-shadow: 0 0 0 1000px #0b0b0d inset !important;
            -webkit-text-fill-color: #fff !important;
            caret-color: #fff;
            transition: background-color 9999s ease-in-out 0s;
        }

        .doc-combo-grid {
            display: grid;
            grid-template-columns: 118px 1fr;
            gap: 10px;
        }

        .field-group.has-error .field-input,
        .field-group.has-error .field-select,
        .field-group.has-error .field-textarea {
            border-color: #ff6b6b;
            box-shadow: 0 0 0 4px rgba(255, 107, 107, .12);
        }

        .field-error {
            font-size: 12px;
            color: #ff6b6b;
            margin: 7px 0 0;
            display: none;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .field-error.show {
            display: flex;
        }

        .field-error:not(:empty)::before {
            content: "⚠";
            font-size: 11px;
        }

        #formGeneralError.field-error {
            justify-content: center;
            text-align: center;
            font-size: 13px;
        }

        /* ── Info card / legal chips ── */
        .legal-chip {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
            font-weight: 700;
            padding: 8px 14px;
            border-radius: 999px;
            background: rgba(255, 255, 255, .05);
            border: 1px solid rgba(255, 255, 255, .1);
            color: #d4d4d8;
        }

        .legal-chip i {
            color: rgb(var(--dr), var(--dg), var(--db));
        }

        /* ── Loader premium ── */
        .loader-wrap {
            position: fixed;
            inset: 0;
            z-index: 50;
            background: #030303;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 18px;
        }

        .loader-logo {
            width: 64px;
            height: 64px;
            border-radius: 22px;
            background: radial-gradient(circle, rgba(var(--dr), var(--dg), var(--db), .35), rgba(var(--dr), var(--dg), var(--db), .05));
            border: 1px solid rgba(var(--dr), var(--dg), var(--db), .35);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            animation: loaderPulse 1.6s ease-in-out infinite;
        }

        @keyframes loaderPulse {

            0%,
            100% {
                transform: scale(1);
                opacity: 1;
            }

            50% {
                transform: scale(1.08);
                opacity: .75;
            }
        }

        .spinner {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            border: 3px solid rgba(var(--dr), var(--dg), var(--db), .22);
            border-top-color: rgb(var(--dr), var(--dg), var(--db));
            animation: spin .8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .loader-text {
            font-size: 12.5px;
            color: #8a8a92;
            font-weight: 600;
            letter-spacing: .03em;
        }

        /* ── Success ── */
        .success-check {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: rgba(var(--dr), var(--dg), var(--db), .15);
            border: 2px solid rgba(var(--dr), var(--dg), var(--db), .5);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            margin: 0 auto 22px;
            box-shadow: 0 0 40px -8px rgba(var(--dr), var(--dg), var(--db), .5);
        }

        #successCard {
            opacity: 0;
            transform: translateY(14px);
            transition: opacity .45s ease, transform .45s cubic-bezier(.22, .85, .32, 1);
        }

        #successCard.in {
            opacity: 1;
            transform: translateY(0);
        }

        .codigo-box {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 12px 20px;
            border-radius: 16px;
            margin: 10px 0 18px;
            background: rgba(var(--dr), var(--dg), var(--db), .1);
            border: 1px dashed rgba(var(--dr), var(--dg), var(--db), .5);
        }

        #mainWrap {
            opacity: 0;
            transform: translateY(10px);
            transition: opacity .5s ease, transform .5s cubic-bezier(.22, .85, .32, 1);
        }

        #mainWrap.in {
            opacity: 1;
            transform: translateY(0);
        }

        .fade-in {
            animation: fadeIn .5s ease both;
        }

        .fade-in.d1 {
            animation-delay: .05s;
        }

        .fade-in.d2 {
            animation-delay: .12s;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .card-glow {
            position: relative;
        }

        .card-glow::before {
            content: "";
            position: absolute;
            inset: -1px;
            border-radius: inherit;
            z-index: -1;
            background: linear-gradient(135deg, rgba(var(--dr), var(--dg), var(--db), .5), transparent 40%);
            opacity: .5;
            filter: blur(1px);
        }
        /* ── Skeleton loader ── */
.loader-wrap{
  position:fixed; inset:0; z-index:50; background:#030303;
  display:flex; align-items:center; justify-content:center;
  overflow-y:auto; padding:40px 0;
}
.skeleton-page{
  width:100%; max-width:720px; padding:0 24px;
}
.skel{
  position:relative; overflow:hidden; border-radius:10px;
  background:#111114;
}
.skel::after{
  content:""; position:absolute; inset:0;
  background:linear-gradient(
    90deg,
    transparent,
    rgba(var(--dr),var(--dg),var(--db),.14),
    transparent
  );
  transform:translateX(-100%);
  animation: shimmer 1.5s ease-in-out infinite;
}
@keyframes shimmer{
  100%{ transform:translateX(100%); }
}

.skeleton-header{ display:flex; align-items:center; gap:16px; margin-bottom:28px; }
.skel-logo{ width:56px; height:56px; border-radius:16px; flex-shrink:0; }
.skel-header-lines{ flex:1; }
.skel-line{ border-radius:6px; }

.skeleton-card{
  background: rgba(255,255,255,.03);
  border:1px solid rgba(255,255,255,.08);
  border-radius:24px; padding:28px; margin-bottom:24px;
}
.skeleton-chips{ display:flex; gap:10px; margin-top:20px; }
.skel-chip{ width:150px; height:30px; border-radius:999px; }

.skeleton-grid{ display:grid; grid-template-columns:1fr; gap:18px; }
@media (min-width:768px){ .skeleton-grid{ grid-template-columns:1fr 1fr; } }
.skel-field{ height:48px; border-radius:14px; }
    </style>
</head>

<body>

    <div id="blobUno" class="bg-blob"></div>
    <div id="blobDos" class="bg-blob"></div>

    <div id="loaderScreen" class="loader-wrap">
        <div class="skeleton-page">
            <div class="skeleton-header">
                <div class="skel skel-logo"></div>
                <div class="skel-header-lines">
                    <div class="skel skel-line" style="width:140px;height:11px;"></div>
                    <div class="skel skel-line" style="width:200px;height:20px;margin-top:8px;"></div>
                </div>
            </div>

            <div class="skeleton-card">
                <div class="skel skel-line" style="width:60%;height:26px;"></div>
                <div class="skel skel-line" style="width:90%;height:13px;margin-top:16px;"></div>
                <div class="skel skel-line" style="width:75%;height:13px;margin-top:8px;"></div>
                <div class="skeleton-chips">
                    <div class="skel skel-chip"></div>
                    <div class="skel skel-chip" style="width:110px;"></div>
                </div>
            </div>

            <div class="skeleton-card">
                <div class="skel skel-line" style="width:120px;height:14px;margin-bottom:20px;"></div>
                <div class="skeleton-grid">
                    <div class="skel skel-field"></div>
                    <div class="skel skel-field"></div>
                    <div class="skel skel-field"></div>
                    <div class="skel skel-field"></div>
                </div>
            </div>
        </div>
    </div>

    <main id="mainWrap" style="display:none;" class="max-w-3xl mx-auto px-4 md:px-6 py-10 md:py-16">

        <!-- HEADER -->
        <div class="flex items-center gap-4 mb-8 fade-in">
            <div id="logoWrap"
                class="w-14 h-14 rounded-2xl overflow-hidden bg-zinc-900 border border-white/10 flex items-center justify-center flex-shrink-0 shadow-lg">
                <img id="bizLogo" style="display:none;width:100%;height:100%;object-fit:cover;" />
                <span id="bizLogoLetter" class="font-black text-xl accent"></span>
            </div>
            <div class="min-w-0">
                <p class="uppercase tracking-[3px] text-xs accent font-bold mb-1">Libro de Reclamaciones</p>
                <h1 id="bizNombre" class="text-xl md:text-2xl font-black leading-tight truncate"></h1>
            </div>
        </div>

        <!-- INFO CARD -->
        <div class="glass rounded-3xl p-6 md:p-8 mb-8 fade-in d1">
            <h2 id="libroTitulo" class="text-2xl md:text-3xl font-black mb-3 leading-tight" style="overflow-wrap:break-word;word-break:break-word;"></h2>
            <p id="libroDescripcion" class="text-gray-400 text-[15px] leading-relaxed mb-5" style="overflow-wrap:break-word;word-break:break-word;"></p>
            <div id="legalBadges" class="flex flex-wrap gap-2" style="display:none;"></div>
        </div>

        <!-- FORM -->
        <form id="reclamoForm" class="glass card-glow rounded-3xl p-6 md:p-9 fade-in d2">
            <div id="formFields"></div>

            <p id="formGeneralError" class="field-error text-sm mt-2"></p>

            <button type="submit" id="submitBtn"
                class="btn-primary w-full md:w-auto mt-8 px-10 py-4 rounded-2xl font-bold text-[15px]">
                <i class="fa-solid fa-paper-plane mr-2"></i> Enviar reclamación
            </button>
        </form>

        <!-- SUCCESS STATE -->
        <div id="successCard" class="glass rounded-3xl p-10 text-center fade-in" style="display:none;">
            <div class="success-check">✅</div>
            <h3 class="text-2xl font-black mb-2">¡Reclamación registrada!</h3>
            <p class="text-gray-400 text-sm mb-1">Tu código de seguimiento es:</p>
            <div class="codigo-box">
                <i class="fa-solid fa-hashtag accent"></i>
                <span id="codigoReclamo" class="text-2xl font-black accent tracking-wider"></span>
            </div>
            <p class="text-gray-500 text-xs">Conserva este código, el negocio podrá usarlo para dar seguimiento a tu
                caso conforme a ley.</p>
        </div>

        <p class="text-center text-gray-600 text-xs mt-10">Libro de Reclamaciones Virtual</p>
    </main>

    <!-- NOT AVAILABLE SCREEN -->
    <div id="notAvailableScreen" style="display:none;" class="min-h-screen flex items-center justify-center px-6">
        <div class="glass rounded-3xl p-10 max-w-md text-center fade-in">
            <div class="text-5xl mb-4">📕</div>
            <h2 class="text-xl font-black mb-2">Libro no disponible</h2>
            <p class="text-gray-400 text-sm" id="notAvailableMsg">Este negocio no tiene activo el Libro de
                Reclamaciones.</p>
        </div>
    </div>

</body>

</html>
