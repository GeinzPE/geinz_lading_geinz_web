<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=yes" />

<title>Geinz | Servicios Barranca</title>

<link rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet">
<style>
    :root{
    --bg:#03030F;
    --surface:#0C0C1A;
    --accent:#8800F2;
    --accent-glow:rgba(136,0,242,.4);
    --text-primary:#FFFFFF;
    --text-secondary:#B0B0C0;
    --text-muted:#6E6E86;
    --card-bg:#13131F;
    --border-light:rgba(255,255,255,.08);
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Plus Jakarta Sans',sans-serif;
}

html,
body{
    width:100%;
    max-width:100%;
    overflow-x:hidden;
    background:var(--bg);
    color:white;
}

body{
    position:relative;
    -webkit-tap-highlight-color:transparent;
}

/* =========================
   CONTAINER
========================= */

.container{
    width:100%;
    max-width:1400px;
    margin:0 auto;
    padding:0 18px;
}

/* =========================
   HEADER
========================= */

.sticky-header{
    position:sticky;
    top:0;
    z-index:1000;
    width:100%;
    background:rgba(3,3,15,.88);
    backdrop-filter:blur(18px);
    border-bottom:1px solid var(--border-light);
    padding:15px 0;
}

.hero-title{
    font-size:1.5rem;
    font-weight:800;
    letter-spacing:-.5px;
    margin-bottom:8px;
}

.hero-desc{
    font-size:.92rem;
    color:var(--text-secondary);
    margin-bottom:10px;
}

.hero-mini{
    color:var(--accent);
    font-size:.76rem;
    font-weight:600;
    margin-bottom:14px;
}

/* =========================
   FILTERS
========================= */

.filter-wrapper{
    display:flex;
    gap:10px;
    overflow-x:auto;
    padding:10px 0 6px;
    scrollbar-width:none;
    -ms-overflow-style:none;
    -webkit-overflow-scrolling:touch;
}

.filter-wrapper::-webkit-scrollbar{
    display:none;
}

.f-btn{
    border:none;
    cursor:pointer;
    flex-shrink:0;

    background:var(--surface);
    color:var(--text-secondary);

    border:1px solid var(--border-light);

    padding:11px 22px;
    border-radius:999px;

    font-size:.84rem;
    font-weight:700;

    transition:
        transform .2s ease,
        background .2s ease,
        box-shadow .3s ease;
}

.f-btn:hover{
    transform:translateY(-1px);
}

.f-btn.active{
    background:var(--accent);
    color:white;
    border-color:transparent;

    box-shadow:
        0 4px 18px var(--accent-glow);
}

.f-btn:active{
    transform:scale(.95);
}

/* =========================
   GRID
========================= */

.grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:12px;
    padding:22px 0 110px;
}

@media(min-width:640px){
    .grid{
        grid-template-columns:repeat(3,1fr);
        gap:16px;
    }
}

@media(min-width:768px){
    .grid{
        grid-template-columns:repeat(4,1fr);
    }
}

@media(min-width:1024px){
    .grid{
        grid-template-columns:repeat(5,1fr);
    }
}

/* =========================
   CARD
========================= */

.card{
    position:relative;
    overflow:hidden;

    aspect-ratio:1/1;

    border-radius:30px;

    background:var(--card-bg);

    border:1px solid rgba(255,255,255,.05);

    cursor:pointer;

    transition:
        transform .28s cubic-bezier(.16,1,.3,1),
        box-shadow .35s ease,
        border-color .3s ease;

    animation:fadeScale .45s ease backwards;
}

.card:hover{
    transform:translateY(-6px);

    border-color:rgba(136,0,242,.4);

    box-shadow:
        0 20px 35px rgba(0,0,0,.45),
        0 0 0 1px rgba(136,0,242,.15);
}

.card:active{
    transform:scale(.95);
}

.card img{
    width:100%;
    height:100%;
    object-fit:cover;

    display:block;

    opacity:0;

    transition:
        opacity .45s ease,
        transform .7s ease;
}

.card:hover img{
    transform:scale(1.04);
}

.card img.loaded{
    opacity:1;
}

@keyframes fadeScale{
    from{
        opacity:0;
        transform:scale(.92);
    }
    to{
        opacity:1;
        transform:scale(1);
    }
}

/* =========================
   MODAL PREMIUM
========================= */

.modal{
    position:fixed;
    inset:0;

    z-index:2000;

    display:flex;
    align-items:flex-end;
    justify-content:center;

    background:rgba(0,0,0,0);

    backdrop-filter:blur(0px);

    opacity:0;
    pointer-events:none;

    transition:
        opacity .45s ease,
        background .45s ease,
        backdrop-filter .45s ease;
}

.modal.active{
    opacity:1;
    pointer-events:auto;

    background:rgba(0,0,0,.62);

    backdrop-filter:blur(12px);
}

/* =========================
   SHEET
========================= */

.modal-content{
    position:relative;

    width:100%;
    max-width:560px;

    background:#0F0F1C;

    border-radius:38px 38px 0 0;

    overflow:hidden;

    border-top:1px solid rgba(255,255,255,.06);

    box-shadow:
        0 -10px 40px rgba(0,0,0,.45),
        0 0 0 1px rgba(255,255,255,.02);

    transform:
        translateY(120%)
        scale(.94);

    opacity:.6;

    transition:
        transform .62s cubic-bezier(.16,1,.3,1),
        opacity .42s ease;
}

.modal.active .modal-content{
    transform:
        translateY(0)
        scale(1);

    opacity:1;
}

/* =========================
   IOS BAR
========================= */

.modal-content::before{
    content:"";

    width:54px;
    height:5px;

    border-radius:999px;

    background:rgba(255,255,255,.18);

    position:absolute;

    top:10px;
    left:50%;

    transform:translateX(-50%);

    z-index:20;
}

/* =========================
   BANNER
========================= */

.m-banner{
    width:100%;
    height:260px;

    overflow:hidden;
    position:relative;

    background:#13131F;

    border-radius:38px 38px 0 0;
}

.m-banner img{
    width:100%;
    height:100%;

    object-fit:cover;

    display:block;

    transform:scale(1.08);

    transition:
        transform 1.2s cubic-bezier(.16,1,.3,1),
        filter .5s ease;
}

.modal.active .m-banner img{
    transform:scale(1);
}

/* =========================
   CLOSE BTN
========================= */

.close-x{
    position:absolute;
    top:16px;
    right:16px;

    width:42px;
    height:42px;

    border:none;
    border-radius:50%;

    background:rgba(0,0,0,.5);

    backdrop-filter:blur(8px);

    color:white;

    cursor:pointer;

    z-index:20;

    transition:
        transform .2s ease,
        background .2s ease;
}

.close-x:hover{
    background:rgba(0,0,0,.72);
}

.close-x:active{
    transform:scale(.9);
}

/* =========================
   BODY
========================= */

.m-body{
    padding:30px 24px 42px;

    text-align:center;

    transform:translateY(18px);

    opacity:0;

    transition:
        transform .6s cubic-bezier(.16,1,.3,1) .12s,
        opacity .45s ease .12s;
}

.modal.active .m-body{
    transform:translateY(0);
    opacity:1;
}

/* =========================
   TITLE
========================= */

.m-title{
    font-size:1.75rem;
    font-weight:800;

    margin-bottom:10px;

    background:linear-gradient(
        135deg,
        #FFFFFF,
        #C084FC
    );

    -webkit-background-clip:text;
    color:transparent;

    letter-spacing:-.5px;
}

/* =========================
   LOCATION
========================= */

.m-location{
    display:inline-flex;
    align-items:center;
    gap:6px;

    background:rgba(136,0,242,.12);

    color:var(--accent);

    padding:6px 14px;

    border-radius:999px;

    font-size:.8rem;
    font-weight:700;

    margin-bottom:18px;

    animation:pulseBadge 2.2s infinite;
}

@keyframes pulseBadge{
    0%{
        box-shadow:0 0 0 0 rgba(136,0,242,.25);
    }
    70%{
        box-shadow:0 0 0 12px rgba(136,0,242,0);
    }
    100%{
        box-shadow:0 0 0 0 rgba(136,0,242,0);
    }
}

/* =========================
   DESC
========================= */

.m-desc{
    color:var(--text-secondary);

    line-height:1.65;

    margin-bottom:28px;

    background:rgba(255,255,255,.03);

    padding:16px 18px;

    border-radius:24px;

    border:1px solid rgba(255,255,255,.03);
}

/* =========================
   MAIN BTN
========================= */

.btn-main{
    width:100%;

    border:none;
    cursor:pointer;

    text-decoration:none;

    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;

    padding:17px 20px;

    border-radius:28px;

    background:linear-gradient(
        135deg,
        #8800F2,
        #A855F7
    );

    color:white;

    font-weight:800;

    transition:
        transform .2s ease,
        box-shadow .3s ease;

    box-shadow:
        0 10px 30px rgba(136,0,242,.28);
}

.btn-main:hover{
    box-shadow:
        0 18px 45px rgba(136,0,242,.4);
}

.btn-main:active{
    transform:scale(.97);
}

/* =========================
   SOCIALS
========================= */

.socials{
    display:flex;
    justify-content:center;
    gap:16px;

    margin-top:28px;

    flex-wrap:wrap;
}

.s-item{
    width:54px;
    height:54px;

    border-radius:50%;

    display:flex;
    align-items:center;
    justify-content:center;

    background:#1B1B2A;

    color:white;
    text-decoration:none;

    border:1px solid rgba(255,255,255,.05);

    font-size:1.2rem;

    transition:
        transform .2s ease,
        background .2s ease,
        box-shadow .3s ease;
}

.s-item:hover{
    transform:translateY(-3px);

    background:#24243A;

    box-shadow:
        0 10px 20px rgba(0,0,0,.25);
}

.s-item:active{
    transform:scale(.92);
}

/* =========================
   FULL PAGE SKELETON
========================= */

.page-skeleton{
    width:100%;
}

.sk-line,
.sk-chip,
.sk-card{
    position:relative;
    overflow:hidden;

    background:linear-gradient(
        145deg,
        #13131F,
        #0A0A14
    );
}

.sk-line::after,
.sk-chip::after,
.sk-card::after{
    content:"";

    position:absolute;
    inset:0;

    transform:translateX(-100%);

    background:linear-gradient(
        90deg,
        transparent,
        rgba(255,255,255,.05),
        transparent
    );

    animation:shimmer 1.25s infinite;
}

@keyframes shimmer{
    100%{
        transform:translateX(100%);
    }
}

.sk-title{
    width:240px;
    height:30px;

    border-radius:12px;

    margin-bottom:12px;
}

.sk-sub{
    width:92%;
    max-width:420px;

    height:16px;

    border-radius:10px;

    margin-bottom:10px;
}

.sk-mini{
    width:120px;
    height:14px;

    border-radius:10px;

    margin-bottom:18px;
}

.sk-filters{
    display:flex;
    gap:10px;
}

.sk-chip{
    width:100px;
    height:42px;

    border-radius:999px;

    flex-shrink:0;
}

.sk-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:12px;

    padding-top:22px;
}

@media(min-width:640px){
    .sk-grid{
        grid-template-columns:repeat(3,1fr);
    }
}

@media(min-width:768px){
    .sk-grid{
        grid-template-columns:repeat(4,1fr);
    }
}

@media(min-width:1024px){
    .sk-grid{
        grid-template-columns:repeat(5,1fr);
    }
}

.sk-card{
    aspect-ratio:1/1;

    border-radius:28px;

    border:1px solid #1E1E2E;
}
</style>
</head>

<body>

<div id="app"></div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import {
    getFirestore,
    collection,
    getDocs
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

/* =========================
   FIREBASE
========================= */

const config = {
    apiKey: "AIzaSyBFV4SF7hMFifKz45GaBiu2xwTq7T_gxBQ",
    authDomain: "geinzworkapp.firebaseapp.com",
    projectId: "geinzworkapp",
    storageBucket: "geinzworkapp.appspot.com",
    messagingSenderId: "921389328767",
    appId: "1:921389328767:web:dc6fffc43a51444f5b524a"
};

const app = initializeApp(config);
const db = getFirestore(app);

/* =========================
   DATA
========================= */

let allData = [];

const categories = [
    "Todos",
    "agua",
    "gas",
    "luz",
    "cable",
    "internet",
    "telefonia movil",
    "tramites"
];

const categoryIcon = {
    "Todos": "fa-solid fa-grid-2",
    "agua": "fa-solid fa-droplet",
    "gas": "fa-solid fa-fire",
    "luz": "fa-solid fa-bolt",
    "cable": "fa-solid fa-tower-cell",
    "internet": "fa-solid fa-wifi",
    "telefonia movil": "fa-solid fa-mobile-screen",
    "tramites": "fa-regular fa-file-lines"
};

/* =========================
   SKELETON FULL PAGE
========================= */

function showSkeletons() {
    document.getElementById('app').innerHTML = `
    <div class="page-skeleton">

        <header class="sticky-header">
            <div class="container">
                <div class="sk-line sk-title"></div>
                <div class="sk-line sk-sub"></div>
                <div class="sk-line sk-mini"></div>

                <div class="sk-filters">
                    ${Array(7).fill('<div class="sk-chip"></div>').join('')}
                </div>
            </div>
        </header>

        <main class="container">
            <div class="sk-grid">
                ${Array(12).fill('<div class="sk-card"></div>').join('')}
            </div>
        </main>

    </div>
    `;
}

/* =========================
   RENDER APP
========================= */

function renderApp() {
    document.getElementById('app').innerHTML = `

    <header class="sticky-header">
        <div class="container">

            <h1 class="hero-title">servicios esenciales Geinz</h1>

            <p class="hero-desc">
                Obten los contactos y direcciones de los servicios esenciales de barranca
            </p>

            <p class="hero-mini">Barranca · verificado</p>

            <div class="filter-wrapper" id="filterArea"></div>

        </div>
    </header>

    <main class="container">
        <div class="grid" id="mainGrid"></div>
    </main>

    <div class="modal" id="modalUI" onclick="closeM(event)">
        <div class="modal-content" onclick="event.stopPropagation()">

            <div class="m-banner">
                <button class="close-x" onclick="hideM()">
                    <i class="fas fa-times"></i>
                </button>

                <img id="mi" src="" />
            </div>

            <div class="m-body">
                <h2 id="mt" class="m-title"></h2>

                <div class="m-location">
                    <i class="fas fa-map-pin"></i> Barranca, Perú
                </div>

                <p id="md" class="m-desc"></p>

                <a id="ml" class="btn-main" target="_blank">
                    <i class="fas fa-location-arrow"></i> Cómo llegar
                </a>

                <div class="socials" id="ms"></div>
            </div>

        </div>
    </div>

    `;

    renderFilters();
    render(allData);
}

/* =========================
   FILTERS
========================= */

function renderFilters() {
    const area = document.getElementById('filterArea');

    area.innerHTML = categories.map(c => {
        const icon = categoryIcon[c] || "fa-solid fa-tag";

        return `
        <button class="f-btn ${c === 'Todos' ? 'active' : ''}"
                onclick="filter('${c.toLowerCase()}',this)">
            <i class="${icon}" style="margin-right:6px;"></i>
            ${c}
        </button>`;
    }).join('');
}

/* =========================
   GRID
========================= */

function render(data) {
    const grid = document.getElementById('mainGrid');

    if (!data.length) {
        grid.innerHTML = `<div style="grid-column:1/-1;text-align:center;padding:50px;">
            Sin resultados
        </div>`;
        return;
    }

    grid.innerHTML = data.map(item => `
        <div class="card" onclick="showM('${item.id}')">
            <img src="${item.img_logo || ''}"
                 loading="lazy"
                 onload="this.classList.add('loaded')" />
        </div>
    `).join('');
}

/* =========================
   FILTER
========================= */

window.filter = (cat, btn) => {
    document.querySelectorAll('.f-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');

    const res = cat === 'todos'
        ? allData
        : allData.filter(i =>
            i.categoria?.some(x => x.toLowerCase() === cat)
        );

    render(res);
};

/* =========================
   MODAL
========================= */

window.showM = (id) => {

    const item = allData.find(x => x.id === id);
    if (!item) return;

    document.getElementById('mi').src =
        item.img_logo || 'https://placehold.co/600x400';

    document.getElementById('mt').innerText =
        item.lugar_nombre || '';

    document.getElementById('md').innerText =
        item.descripcion || '';

    /* MAPS ROUTE */
    const lat = item.direccion?.lat;
    const lng = item.direccion?.log;

    let mapsUrl = "https://maps.google.com/?q=Barranca";

    if (lat && lng) {
        mapsUrl = `https://www.google.com/maps/dir/?api=1&destination=${lat},${lng}&travelmode=driving`;
    }

    document.getElementById('ml').href = mapsUrl;

    /* SOCIALS */
    const social = document.getElementById('ms');
    social.innerHTML = '';

    const c = item.contacto || {};

    const add = (url, icon) => {
        social.innerHTML += `
        <a class="s-item" target="_blank" href="${url}">
            <i class="${icon}"></i>
        </a>`;
    };

    if (c.whatsapp?.[0]) {
        let n = c.whatsapp[0].replace(/\s/g, '').replace(/^\+?51/, '');
        add(`https://wa.me/51${n}`, 'fab fa-whatsapp');
    }

    if (c.telefono?.[0]) {
        add(`tel:${c.telefono[0]}`, 'fas fa-phone');
    }

    if (c.ig) {
        let ig = c.ig.startsWith('http')
            ? c.ig
            : `https://instagram.com/${c.ig.replace('@', '')}`;
        add(ig, 'fab fa-instagram');
    }

    if (c.facebook) {
        let fb = c.facebook.startsWith('http')
            ? c.facebook
            : `https://facebook.com/${c.facebook}`;
        add(fb, 'fab fa-facebook-f');
    }

    if (c.tk) {
        let tk = c.tk.startsWith('http')
            ? c.tk
            : `https://tiktok.com/@${c.tk.replace('@', '')}`;
        add(tk, 'fab fa-tiktok');
    }

    if (c.sitio_web) {
        let w = c.sitio_web.startsWith('http')
            ? c.sitio_web
            : `https://${c.sitio_web}`;
        add(w, 'fas fa-globe');
    }

    document.getElementById('modalUI').classList.add('active');
    document.body.style.overflow = 'hidden';
};

window.hideM = () => {
    document.getElementById('modalUI').classList.remove('active');
    document.body.style.overflow = '';
};

window.closeM = (e) => {
    if (e.target.id === 'modalUI') hideM();
};

/* =========================
   START
========================= */

async function start() {

    showSkeletons();

    try {

        const snap = await getDocs(
            collection(db, "Tiendas", "servicios_basicos", "barranca")
        );

        allData = snap.docs.map(d => ({
            id: d.id,
            ...d.data()
        }));

        renderApp();

    } catch (e) {
        console.error(e);
    }
}

start();
</script>

</body>
</html>
