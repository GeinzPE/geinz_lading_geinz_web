<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=yes">
    <title>Geinz | Servicios Barranca</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #03030F;
            --surface: #0C0C1A;
            --accent: #8800F2;
            --accent-glow: rgba(136, 0, 242, 0.4);
            --text-primary: #FFFFFF;
            --text-secondary: #B0B0C0;
            --text-muted: #6E6E86;
            --card-bg: #13131F;
            --border-light: rgba(255, 255, 255, 0.08);
            --placeholder: url('data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iMjAwIiBoZWlnaHQ9IjIwMCIgeG1sbnM9Imh0dHA6Ly93d3cudzMub3JnLzIwMDAvc3ZnIj48cmVjdCB3aWR0aD0iMjAwIiBoZWlnaHQ9IjIwMCIgZmlsbD0iIzEzMTMxRiIvPjxjaXJjbGUgY3g9IjEwMCIgY3k9IjEwMCIgcj0iNDAiIGZpbGw9IiMyMjIyMzAiLz48L3N2Zz4=');
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { 
            background-color: var(--bg); 
            color: white; 
            overflow-x: hidden; 
            -webkit-tap-highlight-color: transparent;
            position: relative;
            width: 100%;
        }

        /* Ocultar scroll horizontal en todos los elementos */
        html, body, .container, .grid, .sticky-header, .modal {
            max-width: 100%;
            overflow-x: hidden;
        }

        /* HEADER & FILTROS */
        .sticky-header {
            position: sticky; 
            top: 0; 
            z-index: 1000;
            background: rgba(3, 3, 15, 0.85); 
            backdrop-filter: blur(20px);
            padding: 15px 0; 
            border-bottom: 1px solid var(--border-light);
            width: 100%;
        }
        .container { 
            max-width: 1400px; 
            margin: 0 auto; 
            padding: 0 18px;
            width: 100%;
        }
        
   .filter-wrapper {
            display: flex; 
            gap: 10px; 
            overflow-x: auto; 
            padding: 10px 0 6px;
            
            /* Ocultar en Firefox */
            scrollbar-width: none;
            
            /* Ocultar en IE y Edge antiguo */
            -ms-overflow-style: none;
            
            -webkit-overflow-scrolling: touch;
        }

        /* 2. Ocultar en Chrome, Safari y Edge moderno */
        .filter-wrapper::-webkit-scrollbar {
            display: none;
        }
        .filter-wrapper::-webkit-scrollbar-track {
            background: rgba(255,255,255,0.05);
            border-radius: 10px;
        }
        .filter-wrapper::-webkit-scrollbar-thumb {
            background: var(--accent);
            border-radius: 10px;
        }
        
        .f-btn {
            background: var(--surface); 
            border: 1px solid var(--border-light);
            color: var(--text-secondary); 
            padding: 10px 22px; 
            border-radius: 100px;
            font-weight: 600; 
            font-size: 0.85rem; 
            cursor: pointer; 
            transition: all 0.25s cubic-bezier(0.2, 0.8, 0.4, 1);
            white-space: nowrap;
            flex-shrink: 0;
        }
        .f-btn:active { transform: scale(0.96); }
        .f-btn.active { 
            background: var(--accent); 
            color: white; 
            border-color: transparent; 
            box-shadow: 0 4px 15px var(--accent-glow);
        }

        /* GRID OPTIMIZADO */
        .grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            padding: 20px 0 100px;
            width: 100%;
        }

        @media (min-width: 480px) { .grid { gap: 14px; } }
        @media (min-width: 640px) { .grid { grid-template-columns: repeat(3, 1fr); gap: 16px; } }
        @media (min-width: 768px) { .grid { grid-template-columns: repeat(4, 1fr); gap: 20px; } }
        @media (min-width: 1024px) { .grid { grid-template-columns: repeat(5, 1fr); gap: 22px; } }
        @media (min-width: 1400px) { .grid { grid-template-columns: repeat(6, 1fr); gap: 24px; } }

        .card {
            background: var(--card-bg);
            border-radius: 28px;
            aspect-ratio: 1/1;
            overflow: hidden;
            cursor: pointer;
            position: relative;
            transition: transform 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275), box-shadow 0.2s;
            border: 1px solid var(--border-light);
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
        }
        .card:hover {
            transform: translateY(-4px);
            border-color: var(--accent);
            box-shadow: 0 15px 30px rgba(0,0,0,0.5), 0 0 0 1px rgba(136,0,242,0.2);
        }
        .card:active { transform: scale(0.94); transition-duration: 0.1s; }
        .card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0;
            transition: opacity 0.4s ease-in-out;
            display: block;
        }
        .card img.loaded { opacity: 1; }

        /* BOTTOM SHEET (MODAL) - Banner mejorado ocupa todo el ancho/alto */
        .modal {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(12px);
            display: none;
            align-items: flex-end;
            justify-content: center;
            z-index: 2000;
        }
        .modal.active { display: flex; }
        .modal-content {
            background: #0F0F1C;
            width: 100%;
            max-width: 550px;
            border-radius: 35px 35px 0 0;
            transform: translateY(100%);
            transition: transform 0.45s cubic-bezier(0.2, 0.85, 0.3, 1.05);
            overflow: hidden;
            border-top: 1px solid rgba(136, 0, 242, 0.3);
        }
        .modal.active .modal-content { transform: translateY(0); }

        /* Banner que ocupa TODO el ancho y altura proporcionada */
        .m-banner { 
            width: 100%;
            height: 260px;
            background: linear-gradient(145deg, #1A1A2E, #0F0F1C);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }
        .m-banner img { 
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        /* Si la imagen es tipo logo y debe mostrarse completa sin cortar, usamos contain pero manteniendo todo el espacio */
        .m-banner.logo-mode img {
            object-fit: contain;
            padding: 20px;
            background: #FFFFFF;
        }
        .close-x { 
            position: absolute; 
            top: 16px; 
            right: 16px; 
            border: none; 
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(4px);
            width: 38px; 
            height: 38px; 
            border-radius: 50%; 
            cursor: pointer;
            color: white;
            font-size: 1rem;
            transition: all 0.2s;
            z-index: 10;
        }
        .close-x:active {
            transform: scale(0.92);
            background: var(--accent);
        }

        .m-body { 
            padding: 28px 24px 38px;
            text-align: center; 
        }
        .m-title { 
            font-size: 1.7rem; 
            font-weight: 800; 
            margin-bottom: 8px;
            background: linear-gradient(135deg, #FFFFFF, #C084FC);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            letter-spacing: -0.3px;
        }
        .m-location {
            color: var(--accent);
            font-size: 0.8rem;
            font-weight: 600;
            margin-bottom: 16px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(136,0,242,0.12);
            padding: 5px 14px;
            border-radius: 40px;
        }
        .m-desc { 
            color: var(--text-secondary); 
            line-height: 1.55; 
            margin-bottom: 28px; 
            font-size: 0.94rem;
            background: rgba(255,255,255,0.02);
            padding: 14px 16px;
            border-radius: 24px;
        }
        
        .btn-main {
            background: var(--accent);
            color: white;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 16px 20px;
            border-radius: 28px;
            font-weight: 700;
            width: 100%;
            transition: all 0.2s ease;
            border: none;
            cursor: pointer;
            font-size: 1rem;
        }
        .btn-main:active {
            transform: scale(0.97);
            background: #6B00C2;
            box-shadow: 0 0 12px rgba(136,0,242,0.5);
        }
        
        .socials { 
            display: flex; 
            justify-content: center; 
            gap: 16px; 
            margin-top: 28px;
            flex-wrap: wrap;
        }
        .s-item { 
            width: 52px; 
            height: 52px; 
            background: #1B1B2A; 
            border-radius: 50%; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            color: white; 
            text-decoration: none; 
            border: 1px solid var(--border-light);
            transition: all 0.2s;
            font-size: 1.3rem;
        }
        .s-item:active {
            transform: scale(0.92);
            background: var(--accent);
            color: white;
        }

        /* Estado de carga esqueleto */
        .skeleton-card {
            background: linear-gradient(145deg, #13131F, #0A0A14);
            border-radius: 28px;
            aspect-ratio: 1/1;
            position: relative;
            overflow: hidden;
            border: 1px solid #1E1E2E;
        }
        .skeleton-card::after {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.04), transparent);
            animation: shimmer 1.2s infinite;
        }
        @keyframes shimmer {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }

        /* Animación entrada */
        @keyframes fadeScale {
            from { opacity: 0; transform: scale(0.94); }
            to { opacity: 1; transform: scale(1); }
        }
        .card {
            animation: fadeScale 0.35s ease backwards;
        }
    </style>
</head>
<body>

<header class="sticky-header">
    <div class="container">
        <h1 style="font-size: 1.5rem; margin-bottom: 8px; font-weight: 800; letter-spacing: -0.5px;">servicios esenciales Geinz</h1>
        <p style="font-size: 0.75rem; color: var(--accent); margin-bottom: 12px; font-weight: 500;">Barranca · verificado</p>
        <div class="filter-wrapper" id="filterArea"></div>
    </div>
</header>

<main class="container">
    <div class="grid" id="mainGrid"></div>
</main>

<div class="modal" id="modalUI" onclick="closeM(event)">
    <div class="modal-content" onclick="event.stopPropagation()">
        <div class="m-banner" id="bannerContainer">
            <button class="close-x" onclick="hideM()"><i class="fas fa-times"></i></button>
            <img id="mi" src="" alt="logo servicio">
        </div>
        <div class="m-body">
            <h2 id="mt" class="m-title"></h2>
            <div class="m-location"><i class="fas fa-map-pin"></i> Barranca, Perú</div>
            <p id="md" class="m-desc"></p>
            <a id="ml" href="#" target="_blank" class="btn-main"><i class="fas fa-map-marker-alt"></i> Cómo llegar · Google Maps</a>
            <div class="socials" id="ms"></div>
        </div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    const config = {
        apiKey: "AIzaSyBFV4SF7hMFifKz45GaBiu2xwTq7T_gxBQ",
        authDomain: "geinzworkapp.firebaseapp.com",
        projectId: "geinzworkapp",
        storageBucket: "geinzworkapp.appspot.com",
        messagingSenderId: "921389328767",
        appId: "1:921389328767:web:dc6fffc43a51444f5b524a"
    };

    const app = initializeApp(config);
    const db = getFirestore(app);
    let allData = [];

    // Categorías con íconos visuales
    const categories = ["Todos", "agua", "gas", "luz", "cable", "internet", "telefonia movil", "tramites"];
    const categoryIcon = {
        "Todos": "fa-solid fa-grid-2",
        "agua": "fa-solid fa-droplet",
        "gas": "fa-solid fa-fire",
        "luz": "fa-solid fa-bolt",
        "cable": "fa-solid fa-tower-cell",
        "internet": "fa-solid fa-wifi",
        "telefonia movil": "fa-solid fa-mobile-screen",
        "tramites": "fa-regular fa-file-lines"
    };

    async function start() {
        // Renderizar filtros mejorados con iconos
        const filterArea = document.getElementById('filterArea');
        filterArea.innerHTML = categories.map(c => {
            const icon = categoryIcon[c] || "fa-solid fa-tag";
            return `<button class="f-btn ${c === 'Todos' ? 'active' : ''}" onclick="filter('${c.toLowerCase()}', this)">
                        <i class="${icon}" style="margin-right: 6px;"></i> ${c}
                    </button>`;
        }).join('');

        // Mostrar skeletons
        showSkeletons();
        
        try {
            const snap = await getDocs(collection(db, "Tiendas", "servicios_basicos", "barranca"));
            allData = snap.docs.map(doc => ({ id: doc.id, ...doc.data() }));
            render(allData);
        } catch (e) {
            console.error("Firebase error:", e);
            document.getElementById('mainGrid').innerHTML = `<div style="grid-column:1/-1; text-align:center; padding:50px; background:#0C0C1A; border-radius:40px; color:var(--text-secondary);">
                <i class="fas fa-exclamation-triangle" style="font-size:2rem; margin-bottom:12px; color:var(--accent);"></i><br>Error de conexión. Revisa tu internet.
            </div>`;
        }
    }

    function showSkeletons() {
        const grid = document.getElementById('mainGrid');
        grid.innerHTML = Array(10).fill('<div class="skeleton-card"></div>').join('');
    }

    function render(data) {
        const grid = document.getElementById('mainGrid');
        if (!data.length) {
            grid.innerHTML = `<div style="grid-column:1/-1; text-align:center; padding:60px 20px; background:#0C0C1A; border-radius:44px;">
                <i class="fa-regular fa-compass" style="font-size:2.5rem; color:var(--accent); margin-bottom:12px; display:block;"></i>
                <span style="color:var(--text-secondary);">No hay servicios en esta categoría</span>
            </div>`;
            return;
        }
        
        grid.innerHTML = data.map(item => `
            <div class="card" onclick="showM('${item.id}')">
                <img src="${item.img_logo || 'https://placehold.co/400x400/13131F/8800F2?text=Geinz'}" 
                     loading="lazy"
                     onload="this.classList.add('loaded')" 
                     alt="${item.lugar_nombre || 'servicio'}">
            </div>
        `).join('');
    }

    window.filter = (c, btn) => {
        document.querySelectorAll('.f-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        const res = c === 'todos' ? allData : allData.filter(i => i.categoria?.some(cat => cat.toLowerCase() === c));
        render(res);
    }

    window.showM = (id) => {
        const item = allData.find(x => x.id === id);
        if (!item) return;
        
        const modalImg = document.getElementById('mi');
        const bannerDiv = document.getElementById('bannerContainer');
        
        // Configurar imagen del banner: Ocupa todo el alto y ancho
        modalImg.src = item.img_logo || 'https://placehold.co/600x300/13131F/8800F2?text=Geinz';
        modalImg.alt = item.lugar_nombre || 'Logo';
        
        // Detectar si la imagen es probablemente un logo con fondo claro vs oscuro, pero mantener cover para que llene todo
        // Forzamos object-fit cover para que ocupe todo el espacio del banner sin bordes blancos
        modalImg.style.objectFit = 'cover';
        modalImg.style.width = '100%';
        modalImg.style.height = '100%';
        
        // En caso de que la imagen sea cuadrada y se vea cortada, pero el cliente pide que ocupe todo el alto y ancho -> cover es correcto
        // Si se prefiere sin recorte extremo se puede cambiar a contain, pero la petición textual: "debe abarcar todo el alto y ancho"
        // así que usamos object-fit: cover.
        
        // Título y descripción
        document.getElementById('mt').innerText = item.lugar_nombre || 'Servicio Geinz';
        document.getElementById('md').innerText = item.descripcion || 'Información verificada. Contacta directamente para más detalles sobre este servicio en Barranca.';
        
        // Ruta maps
        const lat = item.direccion?.lat;
        const lng = item.direccion?.log;
        let mapsUrl = 'https://maps.google.com/?q=Barranca,Peru';
        if (lat && lng) {
            mapsUrl = `https://www.google.com/maps?q=${lat},${lng}`;
        }
        document.getElementById('ml').href = mapsUrl;
        
        // Sociales
        const socialContainer = document.getElementById('ms');
        socialContainer.innerHTML = '';
        const contact = item.contacto || {};
        
        // WhatsApp
        if (contact.whatsapp && contact.whatsapp[0]) {
            let waNum = contact.whatsapp[0].replace(/\s/g, '').replace(/^\+?51/, '');
            if (waNum) socialContainer.innerHTML += `<a href="https://wa.me/51${waNum}" target="_blank" class="s-item"><i class="fab fa-whatsapp"></i></a>`;
        }
        // Teléfono
        if (contact.telefono && contact.telefono[0]) {
            socialContainer.innerHTML += `<a href="tel:${contact.telefono[0]}" class="s-item"><i class="fas fa-phone-alt"></i></a>`;
        }
        // Instagram
        if (contact.ig) {
            let igLink = contact.ig.startsWith('http') ? contact.ig : `https://instagram.com/${contact.ig.replace('@', '')}`;
            socialContainer.innerHTML += `<a href="${igLink}" target="_blank" class="s-item"><i class="fab fa-instagram"></i></a>`;
        }
        // Facebook
        if (contact.facebook) {
            let fbLink = contact.facebook.startsWith('http') ? contact.facebook : `https://facebook.com/${contact.facebook}`;
            socialContainer.innerHTML += `<a href="${fbLink}" target="_blank" class="s-item"><i class="fab fa-facebook-f"></i></a>`;
        }
        // TikTok
        if (contact.tk) {
            let tkLink = contact.tk.startsWith('http') ? contact.tk : `https://tiktok.com/@${contact.tk.replace('@', '')}`;
            socialContainer.innerHTML += `<a href="${tkLink}" target="_blank" class="s-item"><i class="fab fa-tiktok"></i></a>`;
        }
        
        // Si no hay redes, mostrar mensaje sutil
        if (socialContainer.children.length === 0) {
            socialContainer.innerHTML = `<span style="color:#6E6E86; font-size:0.75rem;">📱 Contacto disponible por mapa o llamada</span>`;
        }
        
        const modal = document.getElementById('modalUI');
        modal.classList.add('active');
        document.body.style.overflow = 'hidden';
        document.body.style.position = 'fixed';
        document.body.style.width = '100%';
    }

    window.hideM = () => {
        const modal = document.getElementById('modalUI');
        modal.classList.remove('active');
        document.body.style.overflow = '';
        document.body.style.position = '';
        document.body.style.width = '';
    }

    window.closeM = (e) => { 
        if(e.target.id === 'modalUI') hideM(); 
    }

    // Iniciar app
    start();
</script>
</body>
</html>
