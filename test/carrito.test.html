<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pruebas del carrito · EMULADOR</title>
<style>
  :root{color-scheme:dark light;--bg:#0f1115;--fg:#e5e7eb;--mut:#9ca3af;--bd:#2a2f3a}
  @media (prefers-color-scheme:light){:root{--bg:#fff;--fg:#111827;--mut:#6b7280;--bd:#e5e7eb}}
  body{font:14px/1.45 system-ui,sans-serif;background:var(--bg);color:var(--fg);margin:0;padding:20px}
  h1{font-size:20px;margin:0 0 6px}
  .aviso{padding:10px 14px;border:1px solid #f59e0b;border-radius:10px;background:rgba(245,158,11,.1);margin:10px 0}
  button{padding:9px 16px;border-radius:10px;border:1px solid var(--bd);background:transparent;color:var(--fg);cursor:pointer;font-weight:600}
  button:disabled{opacity:.4;cursor:not-allowed}
  table{border-collapse:collapse;width:100%;margin-top:16px;display:block;overflow-x:auto}
  th,td{border-bottom:1px solid var(--bd);padding:8px 10px;text-align:left;vertical-align:top;white-space:pre-wrap}
  td:nth-child(4){min-width:320px}
  tr.PASS td:first-child{color:#22c55e;font-weight:700} tr.FAIL td:first-child{color:#ef4444;font-weight:700}
  tr.WARN td:first-child{color:#f59e0b;font-weight:700} tr.INFO td:first-child{color:#60a5fa;font-weight:700}
  pre{background:rgba(127,127,127,.12);padding:12px;border-radius:10px;overflow:auto;max-height:240px}
  #modo{color:var(--mut)}
</style>
</head>
<body>
<h1>Pruebas del carrito</h1>
<div id="modo"></div>
<div class="aviso">⚠️ Solo contra el <b>emulador de Firestore</b>. Si el emulador no responde o esta página no está en localhost, el script se niega a correr. Cada ejecución <b>borra los datos del emulador</b>.</div>
<button id="run">Ejecutar pruebas</button> <button id="dl" disabled>Descargar JSON</button>
<table><thead><tr><th>Estado</th><th>Grupo</th><th>Prueba</th><th>Detalle</th><th>Tiempo</th></tr></thead><tbody id="tbody"></tbody></table>
<h3>Registro</h3><pre id="log"></pre>
<script type="module" src="./carrito.test.js"
  onerror="document.getElementById('log').textContent='⛔ No se pudo cargar carrito.test.js o ../rutas/rutas.js. Revisa que este archivo esté junto a carrito.js y que lo abras por http://localhost (no file://).'"></script>
</body>
</html>
